<svg xmlns="http://www.w3.org/2000/svg"
     width="295mm" height="120mm"
     viewBox="0 0 250 100">

<style>
@font-face {
  font-family: 'AlienEncounters';
  src: url('Fonts/AlienEncounters.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

.hex {
  fill:#072158;
  stroke:#11c5ff;
  stroke-width:0.35mm;
  stroke-linejoin:miter;
  vector-effect:non-scaling-stroke;
}

.red { stroke:#db63b5; }

.text {
  font-family: 'AlienEncounters', sans-serif;
  font-size:2.25mm;
  fill:#ffffff;
  text-anchor:middle;
  dominant-baseline:middle;
  filter: url(#neonCyan);
}

.textRed { 
  fill:#db63b5; 
  filter: url(#neonRed);
}

</style>

<defs>
<path id="hex"
d="M 9.5 0
   L 4.75 -8.227241
   L -4.75 -8.227241
   L -9.5 0
   L -4.75 8.227241
   L 4.75 8.227241 Z"/>
   
<path id="hexBig"
d="M 14.25 0
   L 7.125 -12.340862
   L -7.125 -12.340862
   L -14.25 0
   L -7.125 12.340862
   L 7.125 12.340862 Z"/>
   
<filter id="neonCyan" x="-40%" y="-40%" width="180%" height="180%">
  
  <!-- основной мягкий glow -->
  <feGaussianBlur in="SourceGraphic"
                   stdDeviation="0.45"
                   result="blur1"/>

  <!-- лёгкий дополнительный ореол -->
  <feGaussianBlur in="SourceGraphic"
                   stdDeviation="0.9"
                   result="blur2"/>

  <!-- окрашивание только размытия -->
  <feColorMatrix in="blur2" type="matrix"
    values="0 0 0 0 0.086
            0 0 0 0 0.741
            0 0 0 0 0.835
            0 0 0 0.55 0" result="cyanGlow"/>

  <feMerge>
    <feMergeNode in="cyanGlow"/>
    <feMergeNode in="blur1"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>

<filter id="neonRed" x="-40%" y="-40%" width="180%" height="180%">

  <feGaussianBlur in="SourceGraphic" stdDeviation="0.45" result="blur1"/>
  <feGaussianBlur in="SourceGraphic" stdDeviation="0.9" result="blur2"/>

  <!-- чистое цветовое свечение без убийства яркости -->
  <feFlood flood-color="#ff0000" flood-opacity="0.55" result="tint"/>

  <feComposite in="tint" in2="blur2" operator="in" result="coloredGlow"/>

  <feMerge>
    <feMergeNode in="coloredGlow"/>
    <feMergeNode in="blur1"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>

<pattern id="bgPattern"
         patternUnits="userSpaceOnUse"
         width="60"
         height="40">

  <image
    href="background-fill.png"
    width="60"
    height="40"
    opacity="0.75"
	style="mix-blend-mode:screen"
    preserveAspectRatio="none"/>

</pattern>
</defs>

<rect width="250" height="100" fill="#000032"/>

<rect width="250"
      height="100"
      fill="url(#bgPattern)"/>

