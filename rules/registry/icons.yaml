  - id: ICON-001
    placeholder: "{OIL}"
    glyph: "R"
    font: Oil Wars
    meaning: Нефть
    original_concept: Power
    redesign_term: Нефть
    term_ref: TERM-001
    status: OK
    used_in: [Компоненты, Фаза получения ресурсов, Все стоимости действий, Глоссарий]
    notes: >
      Самая частая иконка книги: стоит в каждой строке стоимости. Без неё
      «Стоимость: 1 нефть» повторяется десятки раз. Обязательна.
      2026-09-25: нарисована и добавлена в шрифт, версия 1.2. Капля с бликом
      в тонком кольце — перерисована в векторе по значку на бочке трека
      (`print/Faction-Card-A/barrel.png`), совпадение с растром IoU 0.97.
      Строчная `r` — тот же глиф, не копия. Мастер — `print/icons/oil.svg`,
      там же клипарт PNG; в шрифт собирается `print/Fonts/OilWars/add_glyph.py`.
      На планшетах пишется `{R}` в данных, класс `.sym-R` в шаблоне.
      Набор (решение Alek 25.09.2026): вплотную к числу, без пробела — «10{R}»;
      цвет — цвет окружающего текста; по центру цифр, строку не раздвигает.
      От ICON-032 отличается кольцом: голая капля — пометка региона,
      капля в кольце — ресурс.
      Книга (D-112, решение Alek 2026-10-02): то же правило — значок сразу после
      числа вплотную, без числа через пробел. Слово при числе снимается:
      «Стоимость: 1{OIL}», «1{OIL} за отряд». Определение «Нефть {OIL}» —
      легенда, через пробел. «N нефти» в прозе и примерах осталось словом —
      решения по ним нет.

