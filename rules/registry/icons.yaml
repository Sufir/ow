  # === C. Знаки на компонентах ==============================================
  # В правила не идут. Обе записи разобраны решением D-029 и признаны
  # нормальными; оставлены, чтобы при разработке набора их не завели заново
  # как находки.

  - id: ICON-043
    placeholder: "{NET_MARK}"
    glyph: "📡"
    font: null
    meaning: Принадлежность компонента к сети Роя
    original_concept: null
    redesign_term: null
    term_ref: TERM-077
    status: EMOJI-SUBSTITUTE
    used_in: ["Factory.html строки 98, 104–107"]
    notes: >
      Один знак стоит и на жетоне узла управления (строка 98), и на четырёх
      жетонах зоны сети (строки 104–107).
      РАЗОБРАНО, НАРУШЕНИЯ НЕТ (D-029). В P7 я завёл это как двойной дефект;
      первая половина снята решением Alek: знак помечает связанные
      компоненты, которые друг без друга не имеют смысла, и значение у него
      ОДНО — принадлежность к сети Роя. Правило «один глиф = одно значение»
      выполняется. Различать узел и зону — работа формы жетона и подписи,
      а не этого знака: у узла жетон квадратный, у зон круглый
      (`shape-circle`).
      Осталась вторая половина, и она в силе: это emoji, а emoji запрещён
      уставом §10. Меняется на глиф, когда набор будет добавлен в шрифт
      (D-029). До тех пор статус EMOJI-SUBSTITUTE стоит по факту, а не
      в укор.

