# ICON REGISTRY — глифы кастомного шрифта и их значения.
# Схема — SCHEMA.md. Заполнено в P7, 2026-09-10.
# Правило: один глиф = одно значение, одно значение = один канонический глиф.
# Плейсхолдер в Markdown — {ICON_NAME}. Emoji не использовать.
#
# ГЛАВНЫЙ ВЫВОД РАЗБОРА. Иконочного набора у проекта нет.
# Кастомный шрифт `print/Fonts/Oil Wars.ttf` содержит 11 значащих глифов —
# E, Q, W и цифры 1–8. Три — символы ресурса на карте, восемь — логотипы
# восьми фракций. Ни одного глифа под нефть, влияние, фабрику, отряд или
# результат боя в нём нет. Значит все иконки, нужные тексту правил, ещё
# предстоит нарисовать.
# До тех пор текст пишется плейсхолдерами: {OIL}, {FACTORY} и так далее.
# Подмена emoji запрещена уставом §10 и здесь не применяется нигде.
#
# РЕШЕНИЕ D-029: недостающие иконки рисуются и добавляются В ЭТОТ ЖЕ ШРИФТ,
# а не в виде картинок, — чтобы их можно было набирать в любом редакторе
# и подставлять прямо в строку при сборке PDF. Отдельная подзадача, идёт
# после правил, вместе с выверкой компонентов (D-004).
#
# ДВА ДЕФЕКТА САМОГО ШРИФТА, чинить при добавлении глифов (CODE-04).
# Первый исправлен 2026-09-25 вместе с добавлением ICON-001 (версия 1.2):
# e/q/w теперь указывают на глифы E/Q/W. Второй (descender) не тронут —
# вёрстка принятых компонентов от него зависит, менять только с пересверкой.
#   1. Всего в файле 16 глифов: значащие 11 плюс .notdef, space и ТРИ КОПИИ
#      E/Q/W под строчными кодовыми точками с идентичными контурами
#      и ширинами. Одно изображение набирается двумя символами — это устав §10
#      с обратной стороны. В исходнике FontMaker строчные заданы как
#      characterAliases и должны были свестись к одному глифу; сборщик их
#      развёл.
#   2. descender −54 вместо −200 из исходника. Вреда пока нет, yMin у всех
#      глифов 0, но при добавлении иконок с выносом ниже базовой линии
#      это выстрелит.
#
# Реестр состоит из трёх частей:
#   A. Иконки, которые нужны тексту правил. Все status: MISSING.
#   B. Глифы, которые в шрифте уже есть. Опознаны по контактному листу
#      `../sources/pages/FONT-OILWARS/glyphs.png` (задача CODE-04).
#   C. Знаки на компонентах, которые могли бы сойти за иконки. Оба разобраны
#      и оба признаны нормальными (D-029); записи оставлены, чтобы при
#      разработке набора их не завели заново как находки.
#
# Статусы: OK — глиф есть и значение однозначно; MISSING — значение нужно,
# глифа нет; UNMAPPED — глиф есть, значение не определено; DUPLICATE —
# одно значение под двумя глифами или наоборот; EMOJI-SUBSTITUTE — вместо
# иконки стоит emoji.

