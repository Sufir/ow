  # --- Результаты боя. КРИТИЧЕСКИЙ БЛОК -----------------------------------------
  # Три разных результата, которые нельзя смешивать: множество способностей
  # срабатывает строго от одного из них. Термины взяты из глоссария самого
  # черновика (строки 820 и 826) и из раздела боя (строки 481–488).

  - id: TERM-028
    original_en: Kill
    original_ru: Убийство
    redesign: Смерть
    area: COMBAT
    semantic_equivalent: true
    status: CANONICAL
    variants_found:
      - убить
    refs: [BL-COMBAT-006, BL-COMBAT-007, BL-COMBAT-009, BL-COMBAT-017]
    notes: >
      Результат броска 6 в бою. Решение D-019: термин черновика сохраняется.
      Почему «смерть» устояла после трёх попыток её заменить. Главное требование —
      чтобы вложенность читалась из самих слов, а для этого термины должны лежать
      в РАЗНЫХ смысловых полях. «Смерть» и «уничтожение» — разные поля, поэтому
      формула «убитый отряд уничтожен, но не всякий уничтоженный убит» очевидна
      без пояснений. Все синонимы уничтожения — гибель, ликвидация, устранение —
      лежат в одном поле с ним, и вложенность в паре с ними не читается.
      Второе: «смерть» не может утечь в общее значение. Никто не напишет
      «умертвите 4 своих пехотинцев» в значении платы за действие.
      Известная слабость: для боевых роботов, машин, мехов и роя дронов слово
      звучит небезупречно. Принято как меньшее зло — глагольная форма «отряд убит»
      снимает большую часть неловкости.
      Черновик берёт термин в кавычки (строки 481, 484, 820): в чистовике кавычки
      убрать, термин ввести один раз в глоссарии и дальше писать без них.

  - id: TERM-029
    original_en: Pain
    original_ru: Боль
    redesign: Подавление
    area: COMBAT
    semantic_equivalent: true
    status: CANONICAL
    variants_found:
      - Отступление
    refs: [BL-COMBAT-006, BL-COMBAT-012, BL-COMBAT-013]
    notes: >
      Результат броска 4–5 в бою. Решение D-016: результат называется
      «подавление», а его применение остаётся «отступлением». В черновике оба
      понятия назывались «отступлением», и это стирало границу, которая
      в оригинале есть: Pain — назначаемый результат, отступление — его применение.
      Почему «подавление»: стандартный военный термин, называет состояние, а не
      движение, и укладывается в сеттинг — слово звучит уже во вступлении.
      Что это чинит:
      1) случай, когда отступать некуда, — отряд всё равно получил результат,
         и владелец обязан списать один отряд (BL-COMBAT-013);
      2) формулировку про энграммы — им нельзя назначить подавление, но чужому
         отступлению в свой регион они не мешают;
      3) способности, которые управляют направлением отступления, но не выбирают,
         какие отряды отступают (BL-COMBAT-014).

  - id: TERM-030
    original_en: Elimination / Eliminated
    original_ru: Устранение
    redesign: Уничтожение
    area: COMBAT
    semantic_equivalent: true
    status: CANONICAL
    variants_found:
      - Ликвидировать
      - удалить
    refs: [BL-COMBAT-007, BL-COMBAT-009, BL-COMBAT-011, BL-COMBAT-017]
    notes: >
      Удаление отряда с поля любым способом. Смерть входит сюда как частный
      случай, наряду с захватом и прочими способами.
      Решение D-019: оба термина черновика сохраняются как есть. Пара работает
      сама собой: **убитый отряд уничтожен, но не всякий уничтоженный убит** —
      эту фразу поставить в глоссарий дословно.
      ОДНОСТОРОННОСТЬ КРИТИЧНА. Способность, сформулированная через уничтожение,
      срабатывает и от смерти. Способность, сформулированная строго через смерть,
      от прочего уничтожения НЕ срабатывает. Проверка при вычитке каждой
      способности — через какое из двух слов она сформулирована.
      ВТОРОЙ СМЫСЛ. В бою «уничтожение» — это ещё и самостоятельный третий тип
      назначаемого результата, который добавляют способности после боя и который
      применяется раньше гибели. В оригинале одно слово несёт оба смысла;
      воспроизводим как есть, но в глоссарии проговариваем явно.
      В черновике всего пять вхождений «уничтож*»: строка 650 (Лаборатория) —
      верный перевод «Eliminate up to 4 of your Cultists»; строки 820 и 826 —
      глоссарий; строка 625–626 — вероятная ошибка перевода, см. DEV-001.
      Стихийный вариант «Ликвидировать» в строке 764 привести к «уничтожению».
      ИТОГ ПО ОБЪЁМУ ПРАВОК: терминология результатов боя в черновике меняется
      только в одном месте — «отступление» как название результата становится
      «подавлением» (TERM-029). «Смерть» и «уничтожение» остаются. Плюс точечно
      правится DEV-001 и единственный вариант «Ликвидировать».

