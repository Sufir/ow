  # в TERM-001, сам дефект живёт как issue TISS-009. Идентификатор
  # не переиспользуется (SCHEMA.md). Ссылка на TERM-060 в D-021 и в
  # redesign.yaml переведена на TISS-009.
  #
  # Исходный текст записи, чтобы не искать в истории:
  #   Отдельная запись под конкретный дефект, а не дубль TERM-001.
  #   Черновик, строка 417 — единственное место, где ресурс назван Силой,
  #   непереведённый остаток из оригинала (Cost: 0 Power). Опасно тем, что
  #   слово «сила» в черновике занято под боевую силу отряда (строки 93, 469,
  #   472, 787, см. TERM-054): одно слово означает в разных местах ресурс
  #   и боевую характеристику. Правка — «Стоимость: 0 нефти».

