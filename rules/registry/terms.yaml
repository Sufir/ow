      пятую категорию действий и потребовал общего имени для тех четырёх,
      что занимают шаг 2 хода.
      Значение: одно действие, которое игрок обязан совершить в свой ход, —
      общее, уникальное, по требованию задачи или действие варианта игры.
      Свободные действия (TERM-048) основными не являются и его не заменяют.
      Заведено 2026-09-22 решением D-050, после фриза терминологии в P7:
      статья глоссария уже существовала, а записи в карте не было (TISS-012).
