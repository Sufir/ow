  - id: TERM-056
    original_en: Convert
    original_ru: обращение
    redesign: Перепрошивка
    area: UNIT
    semantic_equivalent: true
    status: CANONICAL
    variants_found:
      - заменить
    refs: [BL-UNIT-007, TERM-016]
    notes: >
      Механика: черновик строка 666, «Когда захватывается энграмма, захвативший
      её игрок может, вместо обычного пленения, заменить на поле захваченную
      энграмму своей энграммой из резерва… Это по-прежнему считается захватом».
      Содержательно совпадает с оригиналом полностью.
      КОНФЛИКТ ЗАКРЫТ ПРИ ФРИЗЕ (TISS-006): механика получает имя
      «ПЕРЕПРОШИВКА», глагол — «перепрошить энграмму».
      Зачем имя вообще нужно. Собственного названия у механики не было,
      а глагол «заменить» в черновике работает ещё в трёх несвязанных смыслах:
      создание энграмм (строки 650–651, 669), фракционные технологии
      «Перевербовка» и «Подавление» (строки 770, 773), баланс сил (строка 715).
      Без отдельного слова эти четыре механики при вычитке склеиваются.
      Почему именно «перепрошивка». Энграмма — оцифрованное сознание
      в контейнере; захватчик не убеждает и не обращает её, а перезаписывает
      носитель под себя. Слово в сеттинге, не пересекается ни с одним другим
      термином и даёт естественную глагольную форму.
      СЛОВО ВВЕДЕНО РЕДАКТОРОМ, в черновике его нет. Механика не менялась.
      ПРАВО НА ИМЯ ПРОВЕРЕНО ПО ОРИГИНАЛУ (D-029). Условие Alek было такое:
      заводим термин, только если у механики имя было и в оригинале. Оно
      было — SRC-RB-NEW, стр. 173: «you may choose instead to "Convert" it
      into a Cylinder of your own Faction's Color». Слово взято в кавычки,
      то есть введено как термин, и дальше используется без них и как глагол:
      «it cannot be Converted». Если бы оригинал просто описывал замену,
      отдельного слова у нас бы не появилось.
      Отдельно, вне объёма правил: «Подавление» как название фракционной
      технологии Глобал Петролеум конфликтует с «подавлением» как результатом
      боя (TERM-029). Разбирается при выверке фракций (D-004), зафиксировано
      здесь, чтобы не потерялось.

