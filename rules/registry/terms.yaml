# CANONICAL TERM MAPPING — оригинальный термин → термин «Нефтяных войн».
# Схема — SCHEMA.md.
# status: PROVISIONAL | CANONICAL | CONFLICT | UNMAPPED
#
# ЗАФИКСИРОВАНО 2026-09-10, фаза P7. Все PROVISIONAL переведены в CANONICAL,
# все CONFLICT закрыты выбором одного написания. Дальше термины не меняются
# без решения D-###.
#
# Правило чтения: колонка `redesign` — единственное допустимое написание.
# Колонка `variants_found` — то, что встречается в черновике и подлежит
# сплошной замене при вычитке (P8). Список замен собран в issue TISS-010.
#
# Источник соответствий:
#   - глоссарий проекта (../../CLAUDE.md §8);
#   - SRC-RB-NEW и вики Cthulhu Wars — подтверждение по модулям (D-010);
#   - текст черновика, сверено в P4.
#
# Записи со статусом UNMAPPED — не долг, а результат: у термина одной стороны
# нет и не должно быть пары на другой. Причина в каждой такой записи названа.

