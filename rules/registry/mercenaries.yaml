      original_en: "The Beyond-One (Action: Cost 1): Yog-Sothoth must be in an Area containing a Gate, but no enemy Great Old One. Move Yog-Sothoth to any Area on the Map lacking a Gate. In doing so, he takes the Gate with him, along with any Controlling Unit."
