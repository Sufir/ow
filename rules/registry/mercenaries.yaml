      original_en: "Yog-Sothoth shares an Area with an enemy Great Old One."
      draft: "Ваш боевой робот находится в одном регионе с вражеским боевым роботом."
      text_draft: "“Шрёдингер” находится в одном регионе с вражеским боевым роботом. Наёмные боевые роботы тоже подходят."
