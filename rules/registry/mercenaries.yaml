# mercenaries.yaml — реестр наёмников «Нефтяных войн» (компонент COMP-V-10)
#
# Заведён 2026-10-01, этап 1 из трёх: данные. Этапы 2 (дизайн) и 3 (вёрстка) —
# отдельными чатами, промпты rules/tasks/ПРОМПТ-наёмники-2-дизайн.md и -3-вёрстка.md.
# Схема — SCHEMA.md, раздел «mercenaries.yaml».
#
# ЧТО ЗДЕСЬ. Три класса наёмников — боевые машины, мехи, боевые роботы. По каждому
# кандидату: что известно, чем он был в оригинале, откуда каждое число, как он
# соотносится с уже принятыми компонентами, и — где источник есть — черновой текст
# карты. Оформления и вёрстки здесь нет.
#
# СОСТОЯНИЕ НА 2026-10-01 — ЭТАП 1 ЗАКРЫТ, D-106. В комплект идут только семь
# наёмных боевых роботов наших восьми фракций (MRC-R-01…07), у них есть черновой
# текст карты (text_draft). Всё остальное — машины, мехи, прочие независимые GOO,
# роботы нереализованных фракций — сейчас не делаем; данные хранятся здесь на случай,
# если их реализуют позже, и тогда решается, всех или некоторых.
#
# ВАЛИДАТОР. rules/tools/registry.py знает семь файлов (sources … icons), этот
# не проверяет и в registry.db не собирает — как и factions.yaml, components.yaml.
#
# ИСТОЧНИКИ (пути от корня проекта):
#   SRC-APP-MERC    — source/gdocs/SRC-APP-MERC__mercenaries__2026-09-10.md (черновик приложения, 9 роботов)
#   SRC-DRAFT       — source/gdocs/SRC-DRAFT__rules-draft__2026-09-10.md (черновик правил, строки 602–630)
#   SRC-RB-OLD      — source/cthulhu-wars/SRC-RB-OLD__…md (с. 109–129: Neutral Monsters, Terrors,
#                     Independent GOO, «Faction Great Old Ones as Independents», с. 125–129 — тексты карт)
#   SRC-RB-NEW      — source/cthulhu-wars/SRC-RB-NEW__…md (с. 99–119, те же разделы, новая вёрстка)
#   SRC-NECRO       — source/cthulhu-wars/SRC-NECRO__rulebook__2026-09-10.json (общие правила NM/Terror/IGOO)
#   SRC-ERRATA-PACK — source/cthulhu-wars/SRC-ERRATA-PACK__cards-text__2026-09-10.md (Ultimate Errata Pack:
#                     Bokrug, Ghatanothoa, Dark Demon, Shadow Pharaoh, Eidolon, общий текст Terror)
#   SRC-FAQ         — source/cthulhu-wars/SRC-FAQ__cw-rules-faq__2026-09-10.md
#   SRC-WEB-LOYALTY — source/web/SRC-WEB-LOYALTY__cw-loyalty-cards__2026-10-01.md (транскрипции всех карт
#                     лояльности: necronomicon.app, HRF, блоги Petersen, BGG; у каждого факта — URL)
#   PL-<фракция>    — print/Faction-Card-A/Данные/<фракция>.json (принятые планшеты, D-078)
#   CARDS           — print/Saved/Cards - Технологии и задачи.json (принятые карты задач и технологий, D-088)
#   FAC-DOC         — source/gdocs/Нефтяные войны (фракции v.2.0).zip (док фракций)
#
# В текстах карт: {R} — значок нефти (ICON-001), кавычки на компонентах только “ ” (D-075).

