findings:

  - id: MRC-I-001
    type: REGISTRY-ERROR
    title: "DEV-014 — ложная тревога: цены карт лояльности в оригинале разные по классам"
    severity: ERROR
    status: CLOSED
    subject: [DEV-014, NUM-108, NUM-109, BL-MODULE-008]
    detail: >
      BL-MODULE-008 записал «правило покупки общее для карт лояльности Neutral
      Monster и Terror», отсюда DEV-014 («единая цена 2 Doom + 2 Power») и поле
      original у NUM-108. На деле Neutral Monster стоит 2 Doom (SRC-RB-OLD с. 109,
      SRC-RB-NEW с. 99, SRC-NECRO, все 20 карт), Terror — 2 Doom + 2 Power.
      Черновик (2 влияния; 2 нефти + 2 влияния) совпадает с оригиналом 1:1.
    proposal: >
      NUM-108: original «2 влияния», match PASS; NUM-109: match PASS;
      BL-MODULE-008: строку interactions переписать; DEV-014 — примечание
      «основание ложное, см. MRC-I-001». Книга не меняется: цена живёт на карте.
      Править вместе с записью решения по этапу.
