      text_draft: "Если “Шрёдингер” находится в регионе с фабрикой и без вражеских боевых роботов (в том числе наёмных), переместите “Шрёдингера” и эту фабрику (вместе с контролирующим её отрядом) в любой регион поля, где нет фабрик."
