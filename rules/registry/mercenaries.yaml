      SRC-RB-OLD с. 127 «Equal to the number of enemy Faction Great Old Ones (not
      counting any Independent Great Old Ones)»; necronomicon.app — то же.
      Удвоения, как у фракционного, у наёмного нет: два независимых источника (MRC-I-017)
    faction_numbers: {cost: 6, combat: "n — удвоенное число вражеских боевых роботов, наёмные не считаются", src: PL-Сайнтифик Солюшн}
    creation:
      original_en: "1) Your Controlled Gate is in an Area with your Great Old One. 2) Pay 6 Power, and place Yog-Sothoth in the Area containing the Gate."
      draft: "3. Ваш боевой робот находится в регионе с контролируемой вами фабрикой. 4. Заплатите 6 нефти и поместите “Шредингер” в регион с контролируемой вами фабрикой."
      text_draft:
        - "Ваш боевой робот находится в регионе с контролируемой вами фабрикой."
        - "Заплатите 6{R}."
        - "“Шрёдингер” появляется в регионе с этой фабрикой."
