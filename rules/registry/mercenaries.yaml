      text_draft: "Выберите регион и фракцию (в том числе свою): в этом регионе у неё должен быть хотя бы один пехотинец или боевая машина. Поменяйте местами “Жнеца” и один из этих отрядов — какой именно, выбирает владелец выбранной фракции. Обмен местами не считается перемещением."
