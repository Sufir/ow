      draft: "1. Ваш боевой робот находится в регионе с контролируемой вами фабрикой. 2. Заплатите 4 нефти и поместите “Жнеца” в регион с контролируемой вами фабрикой."
      text_draft:
        - "Ваш боевой робот находится в регионе с контролируемой вами фабрикой."
