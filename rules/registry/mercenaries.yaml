      draft: "1. Ваш боевой робот находится в регионе с контролируемой вами фабрикой. 2. Заплатите 6 нефти и поместите “Черный вихрь” в регион с контролируемой вами фабрикой. 3. Получите 1 жетон скрытого влияния."
      text_draft:
        - "Ваш боевой робот находится в регионе с контролируемой вами фабрикой."
        - "Заплатите 6{R}."
        - "“Чёрный вихрь” появляется в регионе с этой фабрикой."
        - "Получите карту скрытого влияния."
    ability:
      name: Нефть должна течь
      name_src: "SRC-APP-MERC (наше имя); в оригинале The Stars are Wrong"
      phase: Фаза влияния
      original_en: "The Stars are Wrong (Doom Phase): Gain 1 Elder Sign during each Doom Phase in which you Control a Gate in the Area containing Yellow Sign's Faction Glyph (NOT one of the King in Yellow's 3 Spellbook Glyphs, but the Yellow Sign, itself)."
      draft: "Получите 1 скрытое влияние в фазе влияния, если вы контролируете фабрику в регионе с логотипом Глобал Петролеум."
      text_draft: "Если вы контролируете фабрику в регионе Европа, получите карту скрытого влияния."
      basis: >
        Оригинал. Глиф Yellow Sign — Европа (board/glyphs.yaml MG-002; стартовый
        регион на планшете). Метки Глобал Петролеум на поле нет (D-102) — регион словами.
        Символы Q W E здесь ни при чём — оригинал оговаривает это прямо.
    task:
      original_en: "As an Action, select another player to gain 3 Doom points."
      draft: "В качестве действия: выберите другого игрока, этот игрок получает три очка влияния."
      text_draft: "В качестве действия: выберите противника — он получает 3 влияния."
      basis: "CARDS, задача Глобал Петролеум № 6 — то же требование"
    technology:
      name: Эффективность
      phase: Битва. Финал
      original_en: "Vengeance (Post-Battle): If Hastur is involved in a Battle, you choose which Combat results are applied to which enemy Units."
      draft: "Битва, фаза: финал. Если “Черный вихрь” участвует в битве, то вы сами выбираете, какие результаты боя будут применены к какому из вражеских отрядов."
      text_draft: "Если “Чёрный вихрь” участвует в битве, то вы, а не владелец, назначаете результаты боя вражеским отрядам."
      basis: "PL-Глобал Петролеум, “Эффективность” (D-092) — та же Vengeance"
    discrepancies:
      - {type: NAME, draft: “Черный вихрь”, canon: “Чёрный вихрь”, ref: D-065}
      - {type: TERM, draft: "«текущей стоимости оказания влияния на треке влияния»", canon: "«текущей стоимости оказания давления на треке Судного дня»", ref: D-065}
      - {type: TERM, draft: "жетон скрытого влияния; 1 скрытое влияние", canon: "карта скрытого влияния"}
      - {type: TERM, draft: "регион с логотипом Глобал Петролеум", canon: "регион Европа", ref: D-102}
    notes: >
      Наёмного “Чёрного вихря” создаёт любой ваш робот; фракционному нужен “Шепард”.

