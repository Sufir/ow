  - id: MRC-R-06
    name: “Шрёдингер”
    name_draft: “Шредингер”
    status: SOURCED
    decision: "делаем — D-106"
    faction: OW-F-07
    faction_name: Сайнтифик Солюшн
    original: {name_en: Yog-Sothoth, faction: CW-F-08 Opener of the Way, card: Yog-Sothoth Loyalty & Spellbook Cards, src: "SRC-RB-OLD с. 127"}
    figure: {carrier: MINIATURE, have: true, ref: COMP-F-05}
    cost: 6
