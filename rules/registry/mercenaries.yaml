      draft: "“Спрут”, при перемещении, может перемещаться до двух регионов. Можно пересекать регионы, в которых присутствуют отряды противников."
      text_draft: "При перемещении “Спрут” может пройти до двух регионов. Цена прежняя — 1{R}. Проходить можно и через регион с вражескими отрядами."
      basis: "оригинал; строй фраз — PL-Эйркрафт Корпорейшн, “Авиация” (у фракции она на все отряды)"
    task:
      original_en: "Capture an enemy Cultist."
      draft: "Захватить вражеского пехотинца."
      text_draft: "Захватить вражеского пехотинца."
      basis: "CARDS, задача Эйркрафт Корпорейшн № 5 — то же требование"
    technology:
      name: Военные трофеи
      phase: Битва. Финал
      original_en: "The Harbinger (Post-Battle): If Nyarlathotep is in a Battle in which one or more enemy Great Old Ones are Killed or Pained, receive Power equal to half of the cost of Awakening those Great Old Ones. For each enemy Great Old One so affected, you may choose to receive 2 Elder Signs instead of Power."
      draft: "Если “Спрут” участвует в битве, в которой убит или получил ранение хотя бы один боевой робот противника, то вы получаете нефть, в количестве равном половине стоимости создания каждого из вражеских б/р получивших повреждения (округление вниз). Вместо нефти за каждого вражеского б/р вы можете взять 2 жетона скрытого влияния. Получите военные трофеи, даже если “Спрут” и сам убит или ранен в битве."
      text_draft: "Если “Спрут” участвует в битве, за каждого вражеского боевого робота (в том числе наёмного), которому назначена смерть или подавление, получите на выбор: {R} — половину стоимости, за которую этого робота можно создать сейчас, с округлением вниз; или 2 карты скрытого влияния. Трофеи вы получаете, даже если “Спрут” в этой битве сам убит или подавлен."
      basis: "PL-Эйркрафт Корпорейшн, “Военные трофеи” по FAQ (D-077) — та же Harbinger"
    discrepancies:
      - {type: TERM, draft: "ранение; б/р; жетоны скрытого влияния", canon: "подавление; боевой робот; карты скрытого влияния"}
      - {type: RULE, draft: "«половине стоимости создания»", canon: "текущая стоимость создания — FAQ, D-077"}
    notes: >
      Сила считает и технологии наёмных роботов противника — у фракционного
      “Спрута” наоборот (сноска планшета). Так в оригинале: «as well as any others».

  - id: MRC-R-03
    name: “Шепард”
    name_draft: Промышленный робот “Пастух”
    status: SOURCED
    decision: "делаем — D-106"
    faction: OW-F-03
    faction_name: Глобал Петролеум
    original: {name_en: The King in Yellow, faction: CW-F-02 Yellow Sign, card: King in Yellow Loyalty & Spellbook Cards, src: "SRC-RB-OLD с. 125"}
    figure: {carrier: MINIATURE, have: true, ref: COMP-F-05}
    cost: 2
    cost_src: "SRC-RB-OLD с. 125 «Cost 2»; SRC-APP-MERC с. 5 — 2"
    combat: 0
    combat_note: null
    combat_src: "SRC-RB-OLD с. 125 «Combat: 0»; SRC-APP-MERC с. 5 — 0"
    faction_numbers: {cost: 4, combat: 0, src: PL-Глобал Петролеум}
    tokens: >
      Жетоны “Нефтяная вышка” Глобал Петролеум (акрил, `acrylic/01. Вышки`, 12 шт.).
      Глобал Петролеум в партии нет — жетоны свободны. В оригинале так же: «Add its
      Spellbook and any associated tokens to your Pool» (SRC-RB-OLD с. 120).
    creation:
      original_en: "1) Your Controlled Gate is in an Area with your Great Old One. 2) Pay 2 Power, and place The King in Yellow in the Area containing the Gate."
      draft: "1. Ваш боевой робот находится в регионе с контролируемой вами фабрикой. 2. Заплатите 2 нефти и поместите “Пастуха” в регион с контролируемой вами фабрикой."
      text_draft:
        - "Ваш боевой робот находится в регионе с контролируемой вами фабрикой."
        - "Заплатите 2{R}."
        - "“Шепард” появляется в регионе с этой фабрикой."
    ability:
      name: Бурение
      phase: "Действие. Стоимость: 2{R}"
      original_en: "Defilement (Action: Cost 2): If the King in Yellow is in an Area with no Desecration token, roll a die. On a roll equal to or less than the number of your Units in the Area (including the King), place a Desecration token into that Area. Whatever the result, place a Monster or Cultist with a cost of 2 or less into the Area."
      draft: "Действие. Стоимость: 2. Если “Пастух” находится в регионе без “Нефтяной вышки”, бросьте кубик. Если значение на кубике равно или меньше чем количество ваших отрядов в регионе (включая “Пастуха”), поместите в нее “Нефтяную вышку”. Можете поместить пехотинца или боевую машину стоимостью 2 или меньше в этот регион, независимо от результата броска."
      text_draft: "Если “Шепард” находится в регионе без “Нефтяной вышки”: бросьте D6. Если значение на кубике равно или меньше, чем количество ваших отрядов в регионе (включая “Шепарда”), поместите в этот регион “Нефтяную вышку”; независимо от результата броска поместите в этот регион пехотинца или боевую машину стоимостью 2 или меньше, если у вас в резерве есть такой отряд."
      basis: "PL-Глобал Петролеум, “Бурение” (D-066, D-071) — Defilement наёмного = Desecrate фракционного"
    task:
      original_en: "Place a Desecration token in an Area containing a enemy-Controlled Gate."
      draft: "Разместить “Нефтяную вышку” в регионе, где есть вражеская фабрика."
      text_draft: "Разместить “Нефтяную вышку” в регионе с фабрикой под контролем противника."
      basis: "оригинал; форма задачи — D-087 (инфинитив: событие вашей фракции)"
    technology:
      name: Нефтедобыча
      name_src: "SRC-APP-MERC; в оригинале Feast — как у фракционной способности (наша “Добыча”). MRC-I-009"
      phase: Фаза получения ресурсов
      original_en: "Feast (Gather Power Phase): Gain 1 Power for each Area that contains a Desecration token."
      draft: "В фазу получения нефти получите по 1 единице нефти за каждый регион, в котором есть жетон “Нефтяной вышки”."
      text_draft: "Получите по 1{R} за каждый регион, в котором есть “Нефтяная вышка”."
      basis: >
        Оригинал. У фракционной “Добычи” (PL-Глобал Петролеум) есть условие
        «и присутствует хотя бы один ваш отряд», у наёмной — нет: так у Сэнди.
    discrepancies:
      - {type: NAME, draft: “Пастух”, canon: “Шепард”, ref: D-066}
      - {type: CLASS, draft: "«Промышленный робот»", canon: "боевой робот", ref: "D-065, COMP-I-011"}
      - {type: TERM, draft: "«вражеская фабрика»", canon: "«фабрика под контролем противника» — enemy-Controlled Gate"}
      - {type: TERM, draft: "«поместите в нее»; «единице нефти»", canon: "«в этот регион»; {R}"}
    notes: >
      Вышка наёмного “Шепарда” засчитывается только его владельцу (D-081, D-087 п. 1).

  - id: MRC-R-04
    name: “Чёрный вихрь”
    name_draft: “Чёрный вихрь” / “Черный вихрь”
