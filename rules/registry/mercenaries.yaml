# ─────────────────────────────────────────────────────────────────────────────
# БОЕВЫЕ РОБОТЫ
#
# status:
#   SOURCED   — есть карта оригинала и наша фракция; текст карты черновой, вычитка — этап 3
#   EXCLUDED  — в черновике есть, решено не делать (Q-3)
#   NO-SOURCE — карты в оригинале нет
#
# Числа наёмника берутся с КАРТЫ ОРИГИНАЛА, а не с планшета: у Сэнди цена и сила
# наёмного GOO другие, чем у фракционного (MRC-I-004). Планшет даёт имена,
# термины и формулировки там, где механика та же. faction_numbers — только
# для сравнения, на карте наёмника не действуют.
#
# Шаги создания у всех семи одни и те же (оригинал, SRC-RB-OLD с. 125–129):
#   1) Your Controlled Gate is in an Area with your Great Old One.
#   2) Pay N Power, and place <GOO> in the Area containing the Gate.
#   3) Gain 1 Elder Sign — только Cthulhu и Hastur.
# «Ваш боевой робот» — и фракционный, и наёмный (SRC-RB-OLD с. 120: «You may use one
# Independent to help Awaken another»; §11.4.3). «В регионе с этой фабрикой» — дословно
# по оригиналу; так формулировка работает и для Братства, у которого робота нет
# (MRC-I-010).
# ─────────────────────────────────────────────────────────────────────────────

