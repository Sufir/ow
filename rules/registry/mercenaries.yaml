  # Что решает Alek. Пока вопрос открыт, соответствующие поля decision пусты.
  decisions_pending:
    - id: Q-1
      question: Сколько видов наёмных боевых машин и мехов делаем
      decision: >
        Сейчас ни одного. Делаем только наёмных боевых роботов, принадлежащих
        восьми реализованным фракциям. Машины, мехи и прочие независимые GOO
        исключены; возможно, реализуются позже — тогда и решим, всех или
        некоторых и как (Alek 2026-10-01, D-106).
      decided: 2026-10-01
      blocks: [COMP-I-018]
      facts: >
        Источника в проекте нет ни одного (MRC-I-013). В оригинале 20 карт Neutral
        Monster и 11 карт Terror плюс 14 кроссоверных (machines, mechs). Базовые
        наборы: CW-U1 и CW-U2 — по 3 вида и по 9 фигурок, Cosmic Terrors CW-U5 —
        3 Terror по одной фигурке. Отсюда ориентир «8–12 машин и 3 меха».
        Официальной нормы на партию нет; сообщество BGG берёт «видов на одного
        больше, чем игроков» (SRC-WEB-LOYALTY, D).
      options_seen:
        - "3 вида БМ + 3 меха — один набор оригинала и Cosmic Terrors; 12 фигурок"
        - "6 видов БМ + 3 меха — CW-U1 и CW-U2; 21 фигурка"
        - "без машин и мехов — §6.6 и §11.4.1–11.4.2 книги останутся без карт"
    - id: Q-2
      question: Чем представить наёмные машины и мехи на поле
      decision: "Снят вместе с Q-1: машин и мехов в комплекте нет (D-106). Вернуться при их реализации."
      decided: 2026-10-01
      blocks: [COMP-I-018]
      facts: >
        Фигурок под них в проекте нет. Варианты — купить миниатюры или резать
        акриловые стенды, как Рой дронов (COMP-V-07). Размеры подставок оригинала:
        кольца CW-U26 — 25/40/50/60/80 мм; какой фигурке какая — не найдено (вики закрыта).
    - id: Q-3
      question: Делаем ли карты “Халифа” и “Имама”
      decision: >
        Нет. Alek 2026-10-01: Windwalker у нас не реализован, заготовка черновая
        и может быть переделана целиком; на неё не смотрим и не ориентируемся.
        Работаем только с восемью фракциями.
      decided: 2026-10-01
      facts: >
        Оба есть в черновике приложения. Оригинал — Ithaqua и Rhan-Tegoth фракции
        Windwalker; среди восьми наших фракций пары нет (Alek 2026-10-01). Фигурок
        нет, задачи обоих завязаны на стартовые области Windwalker (MRC-I-012).

  # Соответствие терминов, по которому переведены тексты карт оригинала.
  # Источник — terms.yaml; здесь только то, что встречается на картах лояльности.
  term_map:
    Doom: влияние
    Power: нефть ({R})
    Elder Sign: карта скрытого влияния
    Ritual of Annihilation: оказание давления
    Doom Phase: фаза влияния
    Gather Power Phase: фаза получения ресурсов
    Action Phase: фаза действий
    Gate / Controlled Gate: фабрика / фабрика под вашим контролем
    Cultist / Acolyte: пехотинец / рекрут
    Monster: боевая машина
    Terror: мех (D-011)
    Great Old One: боевой робот
    Independent Great Old One: наёмный боевой робот
    Neutral Monster: наёмная боевая машина
    Spellbook: технология
    Spellbook requirement: задача
    Faction Card: планшет фракции
    Kill / Pain / Eliminate: смерть / подавление / уничтожение (D-019)
    Summon / Recruit / Awaken: произвести / завербовать / создать
    Start Area / Faction Glyph: стартовый регион (глифов на поле нет, MF-009)
    Pre-Battle / Post-Battle: Битва. Тактическая подготовка / Битва. Финал

  counts:
    robots:
      draft_cards: 9               # SRC-APP-MERC
      sourced_and_paired: 7        # есть карта Сэнди и наша фракция — MRC-R-01…07
      excluded: 2                  # “Халиф”, “Имам” — Q-3 решён: не делаем
      no_source: 1                 # “Зардоз” — карты в оригинале нет
      decided: 7                   # D-106
    machines:
      project_source: 0
      original_cards: 20           # 18 официальных + 2 кроссовера Planet Apocalypse
      decided: 0                   # D-106: не делаем сейчас
    mechs:
      project_source: 0
      original_cards: 11           # без 14 кроссоверных Fourth Circle
      decided: 0                   # D-106: не делаем сейчас

  figures:
    robots: >
      Фигурка наёмного робота — та же, что у фракционного (COMP-F-05, закуплены
      и покрашены). Оригинал так же берёт фигурку фракционного GOO и не советует
      брать робота фракции, которая есть в партии (SRC-RB-NEW, с. 113; §11.4.3 книги).
      Покупать ничего не нужно.
    machines_and_mechs: >
      Сейчас не нужны (D-106). Фигурок под них нет; если будут, вопрос Q-2. Владельца в оригинале показывает карта лояльности; кольца
      CW-U26 — необязательный аксессуар. У нас на тип одна карта, все фигурки типа
      принадлежат её владельцу, поэтому маркер владельца не нужен (MRC-I-015).

