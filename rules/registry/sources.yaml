  - id: SRC-BGA-GRAPH
    side: ORIGINAL
    priority: 3
    kind: FORUM
    title: "Board Game Analysis — Graph analysis of the Cthulhu Wars maps"
    edition: "статья от 2017-11-17, правки от 2017-11-20"
    url: https://www.boardgameanalysis.com/graph-analysis-of-the-cthulhu-wars-maps/
    local_path: null
    retrieved: 2026-09-16
    status: AVAILABLE
    need: null
    notes: >
      Фанатский разбор, но для карты это самый ценный источник после рулбука:
      автор сфотографировал ЧЕТЫРЕ реальные раскладки настоящих планшетов
      (3P, 4P 3-5, 4P 5-3, 5P) и опубликовал посчитанные по ним величины —
      гистограммы степеней (для 3P пофамильно, все 13 областей), диаметры и
      полные списки самых длинных пар для всех четырёх раскладок, долю воды
      (6 областей в любой раскладке) и разницу между двумя раскладками на
      четверых («у 3-5 на одно ребро больше»). Именно против этих чисел
      сверяется наш граф в board/configs.yaml → published.
      Величины независимы от нашего арта: считались по оригиналу.

  - id: SRC-CW-MAP-SCAN
    side: ORIGINAL
    priority: 1
    kind: MODULE
    title: "Cthulhu Wars Earth Map — растр обеих сторон оригинального поля"
    edition: "сторона «3 игрока» и сторона «5 игроков», обе целиком"
    url: null
    local_path: ../../board/legacy/карта.jpg, ../../board/legacy/карта_5.jpg
    retrieved: 2026-09-17
    status: AVAILABLE
    need: null
    notes: >
      САМ КОМПОНЕНТ, а не разбор компонента, поэтому приоритет 1: по вопросам
      «что напечатано на поле» это высшая инстанция, выше рулбука и вики.
      `карта.jpg` — 11024×5523, CMYK, в углах напечатано «EARTH / 3 PLAYER»
      и «Cthulhu Wars — A Sandy Petersen Game, © 2014». `карта_5.jpg` —
      10630×5287, CMYK, то же с подписью «5 PLAYER». Обе стороны собраны
      в один лист, шов между планшетами на растре не виден.
      ЧИТАЕТСЯ НА НИХ ВСЁ: названия областей, семь стартовых глифов фракций,
      подписи-ориентиры, три Spellbook Glyph Yellow Sign (наши символы
      регионов — `region_symbols` в map/glyphs.yaml) и декоративная графика.
      Разрешение хватает, чтобы отличить символ от рисунка: символ залит
      оранжевым с чёрным контуром, рисунок — тонкая штриховая графика тоном
      материка.
      ПОЧЕМУ ЭТОТ ИСТОЧНИК ПОЯВИЛСЯ ПОЗДНО. До 2026-09-17 стартовые глифы
      снимались по SRC-WIKI-MAP и фотографиям SRC-BGA-GRAPH, а в заметке
      SRC-WIKI-MAP записано «единственный источник, по которому вообще
      определяются стартовые регионы». Это было неверно: оба растра лежали
      в папке `board/legacy/` с самого начала и по ним видно больше, чем по вики.
      Заметка SRC-WIKI-MAP исправлена, MEDIUM-глифы по этому растру можно
      довести до HIGH — `MF-004`.
      НЕ ПУТАТЬ с соседними файлами той же папки: `карта 5.jpg`
      и `карта-тест2.jpg` — наши схемы (русские подписи, плоская заливка),
      `шаблон-карта.jpg` — силуэты материков чёрным по белому,
      `карта-тест.jpg` — пустой белый лист.

