  # --- ORIGINAL: рулбук -------------------------------------------------------

  - id: SRC-RB-NEW
    side: ORIGINAL
    priority: 1
    kind: RULEBOOK
    title: Cthulhu Wars Rulebook — новая вёрстка (полный компендиум)
    edition: "омнибус эпохи Final Onslaught: есть Rule Omega и фракция Daemon Sultan"
    url: https://drive.google.com/file/d/1320UvIs5J2c8kUHPIuItAThc7f1NGwD6/view
    local_path: sources/original/SRC-RB-NEW__cw-rulebook-new-layout__2026-09-10.pdf
    retrieved: 2026-09-10
    status: AVAILABLE
    need: null
    notes: >
      ГЛАВНЫЙ ИСТОЧНИК. 213 страниц, текст 425 КБ рядом в .md. Это не буклет базовой
      коробки, а полный сборник: ядро правил (с. 1–40), правила на двоих (с. 39),
      4 базовые фракции (с. 41), 7 дополнительных фракций (с. 61), нейтральные
      монстры (с. 99), Terrors (с. 103), Independent Great Old Ones (с. 107),
      смешанные дополнения включая High Priests и Unique High Priests (с. 117),
      дополнительные карты (с. 141) и ВСТРОЕННЫЙ FAQ (с. 181–196).
      Структурно это ровно та форма, к которой мы ведём наш рулбук (D-003).

