    notes: >
      Файлы вида «File:Faction Card - <Фракция>.png», по одному на фракцию,
      разрешение 609×342 — мелко, но таблица юнитов читается при увеличении
      втрое. Это фотографии официального компонента, отсюда приоритет 2,
      а не 4 как у текста вики. Прочитаны и сверены все десять: Ancients,
      Bubastis, Daemon Sultan, Opener, Sleeper, Tcho-Tcho, Windwalker,
      Crawling Chaos, Black Goat, Yellow Sign, Great Cthulhu.
      Есть и тринадцатая карта, The Bad Movie Dimension, — шуточная фракция,
      в реестр не берётся (FAC-018).

  - id: SRC-WIKI-MAP
    side: ORIGINAL
    priority: 2
    kind: WIKI
    title: Карта Земли Cthulhu Wars с глифами фракций (изображения на вики)
    edition: "раскладка на 5 игроков, половины 5P-L и 5P-R"
    url: https://cthulhuwars.fandom.com/wiki/Earth_Map
    local_path: null
    retrieved: 2026-09-11
    status: AVAILABLE
    need: null
    notes: >
      ИСПРАВЛЕНО 2026-09-17: раньше здесь стояло «единственный источник, по
      которому вообще определяются стартовые регионы». Это неверно — растр
      обеих сторон оригинального поля лежит в папке проекта, SRC-CW-MAP-SCAN,
      и он подробнее. Вики остаётся удобной сверкой, а не единственным словом.
      Faction card региона не называет, в ней написано «in the Area marked with
      this Glyph». Прочитаны глифы: Great Cthulhu — South Pacific (рядом подпись
      «R'lyeh»), Yellow Sign — Europe, Crawling Chaos — South Asia, Black Goat —
      West Africa, Sleeper — North America West, Windwalker — Arctic Ocean
      (подпись «Lomar») и Antarctica. Глифы опознавались сличением с картинками
      «File:Sigil - <Фракция>.png» с той же вики.
      Заодно подтверждено, что наша карта повторяет деление оригинала один
      в один: те же области под теми же именами. ИСПРАВЛЕНО 2026-09-18
      (`MF-008`): раньше здесь стояло «те же 17 зон». Число неверно — 17 бывает
      только в смешанной раскладке на четверых; на стороне «3» областей 13,
      на стороне «5» — 21. Числа названы в рулбуке, SRC-RB-NEW, с. 7.

