  - id: SRC-PLANCARD
    side: ORIGINAL
    priority: 3                        # понижен с 1 решением Alek 2026-09-11 (FAC-017)
    kind: RULEBOOK
    title: "Cthulhu Wars — русское издание: планшеты и карты заклинаний четырёх фракций ядра"
    edition: "PDF создан 2015-10-14, изменён 2017-08-22 — издание O1/O2"
    url: null
    local_path: Plan_Card.pdf          # в корне проекта, не в rules/
    retrieved: 2026-09-11
    status: AVAILABLE
    need: null
    notes: >
      8 страниц A4, растровые (Photoshop), текстового слоя нет — читается только
      рендером в картинку. Чётные страницы — планшеты фракций (2 Ползучий Хаос,
      4 Чёрные Козлы, 6 Великий Ктулху, 8 Жёлтый Знак), нечётные — по шесть карт
      заклинаний к каждой. Это официальный компонент, поэтому приоритет 1.
      ОГОВОРКА, решение Alek 2026-09-11: издание устарело, ЧИСЛА ИЗ НЕГО
      НЕ ПРИНИМАЮТСЯ. По трём фракциям они совпадают с актуальными, по Ползучему
      Хаосу расходятся на два боевых значения (FAC-017) — и в таком конфликте
      выигрывает актуальное издание. Источник остаётся в работе ради другого:
      официальных русских названий юнитов и Великих Древних (внесены
      в factions.yaml как `name_ru`) и русской терминологии планшета.

  - id: SRC-WIKI-FC
    side: ORIGINAL
    priority: 2
    kind: WIKI
    title: Изображения faction cards на Cthulhu Wars Strategy Wiki
    edition: null
    url: https://cthulhuwars.fandom.com/wiki/Category:Factions
