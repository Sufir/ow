      потратить 2 Doom и 2 Power. Если он это делает, он выбирает карту лояльности
      Terror, кладёт её у своего планшета и выставляет фигурку на карту так, как
      указано. После этого он при желании всё равно может провести Ритуал
      Уничтожения. Приобретённая карта лояльности Terror остаётся у игрока до
      конца партии, и с этого момента только он может призывать и контролировать
      связанный с ней Terror.
