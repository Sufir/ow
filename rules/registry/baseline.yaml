    errata_applied: []
    faq_applied: []
    confidence: HIGH
    status: VERIFIED

  - id: BL-UNIT-008
    area: UNIT
    title: High Priest
    rule: >
      High Priest — Cultist. Вербуется так же, как Acolytes, и приносит 1 Power
      в фазу сбора Power. Может создавать врата и контролировать их, может быть
      захвачен. Ключевая способность — Unspeakable Oath (описана на карте
      лояльности): позволяет в любой момент принести High Priest в жертву ради
      Power. У каждой фракции доступен только один High Priest. Поскольку High
      Priest вербуется, а не призывается, контролируемые врата для этого не нужны.
      High Priest получает выгоду от всех книг заклинаний и способностей, которые
      ссылаются на Cultists, но не на Acolytes.
    numbers: {per_faction: 1, power_per_gather_phase: 1, cost: 3, combat: 0}
    timing: >
      Жертвоприношение по Unspeakable Oath — не действие, см. BL-UNIT-012.
    prerequisites: []
    targets: null
    cost: 3
    limits:
      - 1 на фракцию
    exceptions:
      - Контролируемые врата для вербовки не нужны
      - У фракции Tcho-Tcho High Priests трое, а не один
    interactions:
      - >
        Является Cultist, но не Acolyte, — как и Brain Cylinder (BL-UNIT-007).
      - >
        Уникальные High Priests способности Unspeakable Oath не имеют и могут
        пользоваться только способностями со своих карт лояльности (BL-UNIT-011).
    sources:
      - {ref: SRC-RB-NEW, loc: "с. 131, строки 3086–3096 в .md", note: null}
      - {ref: SRC-WIKI, loc: "High Priest", note: "стоимость 3, боевое значение 0, исключение по Tcho-Tcho"}
      - {ref: SRC-FAQ, loc: "вопрос про Tcho-Tcho и Unique High Priest", note: null}
    errata_applied: []
    faq_applied: ["Tcho-Tcho / Unique High Priest"]
    confidence: HIGH
    status: VERIFIED

  - id: BL-UNIT-011
    area: UNIT
    title: Unique High Priests
    rule: >
      Unique High Priests — дополнительный набор правил для High Priests, дающий
      восемь уникальных способностей; используются те же фигурки обычного High
      Priest. Вербуя High Priest, игрок каждый раз выбирает, будет тот обычным
      (со способностью Unspeakable Oath) или одним из именованных уникальных.
      Уникальные High Priests способности Unspeakable Oath НЕ имеют. Как только
      игрок выбрал конкретного уникального High Priest, до конца партии он может
      вербовать только его. Как только уникальный High Priest завербован одним
      игроком, никакой другой игрок не может завербовать именно этого High Priest —
      даже если тот в данный момент не на карте, потому что убит или снят.
    numbers: {unique_priests: 8}
    timing: >
      Выбор «обычный или уникальный» делается в момент вербовки, каждый раз.
    prerequisites: []
    targets: null
    cost: null
    limits:
      - Один и тот же уникальный High Priest на партию для игрока
      - Уникальный High Priest занят навсегда за тем, кто его завербовал первым
    exceptions:
      - Уникальные High Priests не имеют Unspeakable Oath
    interactions: []
    sources:
      - {ref: SRC-RB-NEW, loc: "с. 132, строки 3119–3138 в .md", note: null}
    errata_applied: []
    faq_applied: []
    confidence: HIGH
    status: VERIFIED

  - id: BL-UNIT-012
    area: UNIT
    title: "Unspeakable Oath — жертвоприношение High Priest"
    rule: >
      Постоянная способность. В конце действия любого игрока — даже если сейчас
      не ваш ход — вы можете принести своего High Priest в жертву: вернуть его
      в резерв и прибавить себе 2 Power. То же можно сделать в фазу сбора Power
      и в фазу Doom.
    numbers: {power_gained: 2}
    timing: >
      В конце действия любого игрока, включая чужой ход. Также в фазу сбора Power
      и в фазу Doom.
    prerequisites:
      - Свой High Priest в игре
    targets: "собственный High Priest"
    cost: 0
    limits: []
    exceptions:
      - >
        Уникальные High Priests этой способностью не обладают (BL-UNIT-011).
    interactions:
      - >
        Это постоянная способность, а не действие: она не стоит Power, не
        занимает ход и работает при нулевом запасе Power (BL-ACTION-020).
      - >
        Возможность применить её в чужой ход делает её ответом на угрозу захвата
        и на действия противника вообще. Отдельные способности прямо оговаривают,
        что на них нельзя ответить Unspeakable Oath.
    sources:
      - {ref: SRC-WIKI, loc: "High Priest → Unspeakable Oath", note: "полный текст способности с карты лояльности"}
      - {ref: SRC-RB-NEW, loc: "с. 131, строка 3115 в .md", note: "косвенно подтверждает величину: в примере после жертвы остаётся 2 Power"}
    errata_applied: []
    faq_applied: []
    confidence: MEDIUM
    status: VERIFIED

  - id: BL-UNIT-009
    area: UNIT
    title: Slime Mold — нейтральный монстр
    rule: >
      Slime Mold — нейтральный Monster со стоимостью 1. Пока он не под контролем,
      считается не имеющим ни книг заклинаний, ни Doom, ни Power, ни прочих
      признаков фракции. Slime Mold не призывается обычным образом и не может
      попасть на карту ничем, кроме действия Call Slime Mold. Slime Mold не может
      действием Move уйти в регион с жетоном No Slime, но может быть туда
      отброшен болью или перемещён способностью.
    numbers: {count: 6, cost: 1, cost_if_none_in_play: 0, combat: 2}
    timing: null
    prerequisites:
      - Контроль врат в регионе с жетоном No Slime даёт карту лояльности Роя
    targets: null
    cost: "1; 0, если в игре нет ни одного Slime Mold"
    limits:
      - 6 фигурок
    exceptions:
      - Не может уйти в регион No Slime действием Move
    interactions:
      - >
        Контроль над всеми Slime Molds переходит вместе с контролем над вратами
        в узловом регионе, БЕЗ привязки к фазе: «If this Gate becomes Controlled
        by another Faction, all Slime Molds in play change their allegiance
        to the Gate's new Controller.» Если врата оставлены, все Slime Molds
        становятся неконтролируемыми и перестают считаться частью какой-либо
        фракции, в том числе для эффектов боли.
      - >
        ВАЖНО, И Я СНАЧАЛА ЗАПИСАЛ ЭТО НЕВЕРНО: неконтролируемым Slime Molds
        МОЖНО объявлять бой. «It is possible to declare Battle against
        uncontrolled Slime Molds without affecting any other Faction. The Slime
        Molds do fight back — roll dice for them and mark losses normally.»
        То есть они не только допустимая цель, но и полноценно отвечают: за них
        бросаются кубики и им назначаются потери.
      - >
        «Slimes are Monsters, but they cannot be Summoned. They may only be
        brought into play via this Action.»
    sources:
      - {ref: SRC-RB-NEW, loc: "с. 171–172, строки 3975–4070 в .md", note: null}
      - {ref: SRC-WIKI, loc: "Yuggoth Map → Slime Molds", note: "сверено"}
    errata_applied: []
    faq_applied: []
    confidence: HIGH
    status: VERIFIED

  - id: BL-UNIT-016
    area: UNIT
    title: Предел числа Brain Cylinders и захват сверх предела
    rule: >
      У каждой фракции жёсткий предел в 4 Brain Cylinders. Поэтому если у игрока
      уже четыре Brain Cylinders в игре и он захватывает пятого, обратить его
