# ORIGINAL RULE BASELINE — эталон механики Cthulhu Wars. Схема — SCHEMA.md.
# Заполняется в P2. Основной источник — SRC-RB-NEW (компендиум эпохи Final Onslaught).
# loc указывает страницу рулбука и строку в извлечённом .md — чтобы можно было
# вернуться к месту без пролистывания 213 страниц.
#
# Прогресс P2: UNIT — вчерне; остальные области не начаты.

baseline:

