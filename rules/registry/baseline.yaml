  - id: BL-POWER-001
    area: POWER
    title: Фаза сбора Power и источники Power
    rule: >
      Фаза действий заканчивается, когда Power не осталось ни у кого; в фазу сбора
      Power все игроки восстанавливают запас. Фаза выполняется одновременно всеми
      игроками. Источники: 1 Power за каждого своего Cultist в игре; 2 Power за
      каждые контролируемые вами врата; 1 Power за каждые оставленные врата на
      карте, причём это получает каждый игрок за каждые такие врата; 1 Power за
      каждого захваченного Cultist на вашем планшете, после чего все захваченные
      Cultists возвращаются в резервы владельцев. Оставить захваченного Cultist
      у себя нельзя — возврат обязателен. Отдельно проверяются особые способности
      и книги заклинаний, дающие Power в эту фазу.
    numbers: {per_cultist: 1, per_controlled_gate: 2, per_abandoned_gate: 1, per_captured_cultist: 1}
    timing: После фазы действий, одновременно всеми игроками
    prerequisites: []
    targets: null
