    area: ACTION
    title: "Неограниченное действие: Unlimited Battle"
    rule: >
      Если на планшете фракции лежат все 6 книг заклинаний, игрок может проводить
      Unlimited Battle. Каждый такой бой всё равно стоит 1 Power и позволяет
      инициировать сколько угодно боёв до и после единственного общего,
      уникального или книжного действия. Battle остаётся доступен и как обычное
      общее действие. Поскольку после получения всех книг бой может быть и общим,
      и неограниченным, игрок вправе провести бой и только потом решить, каким он
      был. Важное ограничение: в одном регионе можно инициировать только один
      бой. Нельзя объявить бой общим действием, а затем провести Unlimited Battle
      в том же регионе. Если по итогам боя ваши отряды отступили в другой регион,
      там Unlimited Battle провести можно; но если затем они вернулись отступлением
      в исходный регион, инициировать бой там уже нельзя.
