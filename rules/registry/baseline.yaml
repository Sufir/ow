  - id: BL-ACTION-016
    area: ACTION
    title: Иерархия защитников при захвате
    rule: >
      Иерархия такая: Great Old One старше Monster, Monster старше Cultist.
      Great Old One может захватить вражеского Cultist, если того не защищает
      его собственный Great Old One в этом регионе. Monster может захватить
