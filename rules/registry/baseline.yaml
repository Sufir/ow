        Это базовая тройка. Дополнения добавляют ещё два типа отрядов — Terror
        (BL-UNIT-005) и Elder God (BL-UNIT-006), — а также особые Cultists
        (BL-UNIT-007) и High Priest (BL-UNIT-008).
    interactions: []
    sources:
      - {ref: SRC-RB-NEW, loc: "с. 14, строка 263 в .md", note: "«Each Faction has 3 categories of Units: Cultists, Monsters, and Great Old Ones.»"}
