    title: "Неограниченное действие: Control or Abandon Gate"
    rule: >
      Неограниченных действий у игроков два: Control or Abandon Gate и Unlimited
      Battle. Первое стоит 0 Power. Если у вас есть Cultist в регионе с
      оставленными вратами, на которых нет вражеского Cultist, это действие
      переводит вашего Cultist на врата и даёт контроль над ними. Созданные вами
      врата можно взять под контроль сразу. Тем же действием можно снять Cultist
      с врат, оставив их, и поместить Cultist в тот же регион. Действие можно
      выполнять в свой ход сколько угодно раз, но оно не может быть единственным:
      обязательное одно общее, уникальное или книжное действие всё равно нужно
      выполнить. Неограниченные действия совершаются только в свой ход: взять
      контроль над оставленными вратами вне своего хода нельзя. Если Cultists в
      регионе с оставленными вратами есть у двух игроков, врата достанутся тому,
      кто первым получит ход.
    numbers: {cost: 0, unlimited_action_types: 2}
    timing: Только в свой ход, до или после основного действия
