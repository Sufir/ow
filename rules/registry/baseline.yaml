  # ============================================================================
  # MODULE — Лаборатория и действие Surgery (у нас «Извлечение сознания»)
  # ============================================================================
  # Запись заведена 2026-09-11 при написании 11.5. Закрывает пробел, найденный
  # приёмкой CODE-03: числа для NUM-119 и NUM-120 брались из D-010, потому что
  # записи baseline не существовало.

  - id: BL-MODULE-018
    area: MODULE
    title: "The Laboratory и действие Surgery"
    rule: >
      Игрок, контролирующий врата в области Лаборатории, может выполнять действие
      Surgery. Дословно: «Surgery (Action: Cost 1) If you Control the Laboratory
      Gate, Eliminate up to 4 of your Cultists IN PLAY and replace them with
      an equal number of Brain Cylinder tokens in your Faction's Color.»
      Условие — контроль врат именно в области Лаборатории; предел замены —
      до четырёх; стоимость 1 Power.
      Сама Лаборатория — область на карте Yuggoth, но оригинал прямо
      предусматривает её перенос на другие карты жетоном Laboratory Token,
      то есть наша адаптация к общему полю — штатный режим, а не отклонение.
    numbers: {cost: 1, max_replaced: 4}
    timing: Действие в фазу действий
    prerequisites:
      - Контролируемые врата в области Лаборатории
    targets: "до 4 собственных Cultists в игре"
    cost: 1
    limits:
      - Не более 4 за одно применение
    exceptions:
      - >
        Фракционное исключение оригинала, у нас не применяется: если в игре
        Opener of the Way, Yog-Sothoth может выполнять Surgery, находясь
        в области Лаборатории; и если в это же время другая фракция
        контролирует там обычные врата, Surgery могут выполнять обе. Обе
        оговорки фракционные (D-021, D-004) и в наш текст не идут.
    interactions:
      - >
        «Eliminate up to 4 of your Cultists IN PLAY» — именно «в игре»,
        не «на поле». То же различение, что в BL-POWER-001 и DEV-019.
      - >
        Требования к самим энграммам — BL-UNIT-007; предел в 4 на фракцию
        и судьба пятой захваченной — BL-UNIT-016; назначение результатов боя
        при участии энграмм — BL-UNIT-013.
      - >
        «Replace them» в оригинале не уточняет регион размещения. Черновик
        добавляет «точно в тех же местах, где находились заменяемые
        пехотинцы» — это уточнение, следующее из слова «replace»,
        а не расхождение.
    sources:
      - {ref: SRC-RB-OLD, loc: "с. ~166, раздел The Laboratory и Surgery", note: "лучший читаемый вариант: в старой вёрстке абзац не разорван колонками"}
      - {ref: SRC-RB-NEW, loc: "с. ~171, LABORATORY", note: "тот же текст, разорван вёрсткой в две колонки"}
      - {ref: SRC-WIKI, loc: "Yuggoth Map → The Laboratory", note: "сверено в P2, D-010"}
    errata_applied: []
    faq_applied: []
    confidence: HIGH
    status: VERIFIED

