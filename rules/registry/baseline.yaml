    title: Terror — отдельный тип отряда
    rule: >
      Terror — отдельный тип отряда, появляющийся в части дополнений. Terror
      призывается так же, как Monster, действием Summon Terror, которое требует
      контролируемых врат. В захвате Cultists Terror равен Monster: Monster может
      защитить Cultist от Terror и наоборот, а Great Old One всё равно может
      захватить Cultist, прикрытого Terror. При этом, будучи отдельным типом
      отряда, Terror НЕ уязвим к способностям, которые прицельно бьют по Monsters.
    numbers: {}
