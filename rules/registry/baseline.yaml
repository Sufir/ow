  - id: BL-UNIT-007
    area: UNIT
    title: Brain Cylinder — особый Cultist
    rule: >
      Brain Cylinder — Cultist во всём, кроме трёх пунктов. Первое: не вербуется
      обычным образом и не может попасть на карту иначе как действием Surgery.
      Второе: не может двигаться сам — чтобы переместить Brain Cylinder, должен
      двигаться другой ваш отряд из того же региона, и он берёт с собой любое
      число присутствующих Brain Cylinders без дополнительной платы. Третье:
      Brain Cylinder не получает результат Pain и не подвержен эффектам вида
      «отступление от боли», но при этом и не мешает отрядам противника
      отступать в его регион.
    numbers: {per_faction: 4, cost: 0, combat: 0}
    timing: null
    prerequisites: []
    targets: null
    cost: 0
    limits:
      - 4 на фракцию
    exceptions:
      - Не вербуется и не размещается ничем, кроме Surgery
      - Не двигается самостоятельно
      - Не получает Pain
    interactions:
      - >
        Является Cultist для эффектов, адресованных Cultists без уточнения,
        но НЕ является Acolyte.
      - >
        При захвате Brain Cylinder захватившая фракция может вместо взятия отряда
        «обратить» его, заменив своим Brain Cylinder. Это всё равно считается
        захватом для способностей.
    sources:
      - {ref: SRC-RB-NEW, loc: "с. ~92, строки 3996–4056 в .md", note: null}
