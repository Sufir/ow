  # ============================================================================
  # DOOM — трофеи Elder Sign
  # ============================================================================

  - id: BL-DOOM-003
    area: DOOM
    title: Трофеи Elder Sign
    rule: >
      Заработав Elder Sign, игрок берёт жетон из мешочка и, не показывая другим,
      кладёт его рубашкой вверх у своего планшета. Свои жетоны игрок может
      свободно рассматривать. На каждом напечатано 1, 2 или 3 — это его стоимость
      в Doom. Всего 18 жетонов достоинством 1, 12 достоинством 2 и 6 достоинством
      3. Doom по жетонам не отмечается на треке сразу: игрок сам решает, когда
      его получить. Для этого он раскрывает жетоны и продвигает свой маркер Doom
      на соответствующее число делений. Сделать это можно в любой момент — в любую
      из четырёх фаз или даже в самом конце партии. Обычно большая часть жетонов
      остаётся нераскрытой до конца игры, что скрывает истинный Doom игроков.
      Раскрытый жетон в мешочек не возвращается: он убирается в коробку и больше
      никогда не может быть вытянут.
    numbers: {total: 36, value_1: 18, value_2: 12, value_3: 6}
    timing: >
      Раскрытие — в любой момент партии, по решению владельца, включая самый
      конец игры.
    prerequisites: []
    targets: null
    cost: null
    limits: []
    exceptions:
      - >
        Если все Elder Signs уже разобраны и нужно вытянуть новый, игрок вместо
        этого получает 1 Doom, и это не является тайной.
    interactions:
      - >
        Скрытость Elder Signs означает, что видимая позиция на треке Doom не
        отражает реального счёта. Это существенно для оценки момента окончания
        игры.
