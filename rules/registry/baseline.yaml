  - id: BL-COMBAT-009
    area: COMBAT
    title: Kill — частный случай Elimination, но не наоборот
    rule: >
      Отношение между Kill и Elimination одностороннее.
      Elimination — это удаление отряда с поля любым способом; Kill входит в него
      как частный случай, наряду с захватом и прочими способами.
      Поэтому способность, сформулированная через Elimination, срабатывает
      и от Kill. Способность, сформулированная строго через Kill, от прочих
      Elimination НЕ срабатывает.
      Отдельно: в бою Elimination является ещё и самостоятельным третьим типом
      назначаемого результата, который добавляют способности после боя.
      Наши термины (D-019): Kill — смерть, Elimination — уничтожение.
      Проверочная формула: убитый отряд уничтожен, но не всякий уничтоженный убит.
