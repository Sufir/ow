    area: VICTORY
    title: Момент окончания при достижении 30 Doom
    rule: >
      Когда фракция набирает 30 или более Doom на треке, игра заканчивается.
      Поскольку Doom чаще всего растёт в фазу Doom, обычно игра заканчивается
      именно в ней; в этом случае фазу Doom нужно доиграть целиком, и только затем
      объявлять победу. Однако игрок может раскрыть Elder Signs и в фазу действий:
      если новый Doom доводит его до 30 и более, игра закончится по завершении
      хода текущего игрока — даже если это не тот игрок, который раскрыл Elder
      Signs.
