    area: ACTION
    title: Порядок ходов в фазе действий
    rule: >
      Фаза действий всегда начинается с текущего первого игрока, который совершает
      одно действие. Затем действие совершает следующий игрок по направлению хода,
      и так по кругу; когда действие совершили все, первый игрок начинает новый
      круг. Фаза продолжается, пока у игроков остаётся Power, и заканчивается,
      когда Power не осталось ни у кого и действий больше сделать нельзя. После
      этого начинается фаза сбора Power.
