    rule: >
      Каждое действие стоит определённое количество Power, и его нужно потратить
      до выполнения действия. Игрок никогда не может совершить больше одного
      действия за ход и не может отказаться от действия, пока у него остаётся
      Power: он обязан выбрать доступное действие и заплатить за него. Если Power
      не хватает на желаемое действие, нужно выбрать то, которое по карману.
      Если Power есть, но совершать действия игрок больше не хочет, он может
      добровольно опустить свой запас Power до нуля.
