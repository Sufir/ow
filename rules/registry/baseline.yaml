  - id: BL-MODULE-017
    area: MODULE
    title: Handicap Acolytes — выравнивание сил игроков
    rule: >
      Модуль на 9 нейтральных серых Acolytes, позволяющий уравнивать партию,
      когда один игрок или фракция заметно сильнее либо слабее прочих.
      Игрок слишком силён: взять одного Acolyte Cultist уравниваемой фракции
      и убрать в коробку — он в этой партии не используется; вместо него
      поставить серого Acolyte этой фракции вместе с оставшимися пятью
      культистами на стартовых вратах. Если серый культист когда-либо
      отправляется в резерв по любой причине, вместо этого он немедленно
      убирается в коробку. То есть игрок до конца партии ограничен максимум
      пятью культистами и получает уязвимое место.
      Игрок слишком слаб: просто добавить серого Acolyte в его резерв — теперь
      у него семь культистов для вербовки.
    numbers: {grey_acolytes: 9, strong_limit: 5, weak_pool: 7}
    timing: Определяется до начала партии
    prerequisites: []
    targets: null
    cost: null
    limits: []
    exceptions: []
    interactions:
      - >
        Издатель отмечает, что от участи серого культиста есть способы уйти
        фракционными способностями, и считает это частью замысла.
    sources:
