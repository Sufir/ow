      Ритуал Уничтожения. В этой фазе каждый игрок может провести только один
      Ритуал. Порядок выполнения: 1) потратить Power, равный текущему положению
      маркера на треке Ритуала Уничтожения, — от 5 до 10; 2) продвинуть маркер
      Ритуала на одно деление вверх, что обычно повышает стоимость для тех, кто
      ходит позже; 3) продвинуть свой маркер Doom на одно деление за каждые
      контролируемые врата; 4) получить один Elder Sign за каждого своего
      фракционного Great Old One в игре.
