  # --- Структура хода и неограниченные действия -------------------------------

  - id: BL-ACTION-017
    area: ACTION
    title: Структура хода в фазе действий
    rule: >
      Неограниченные действия — единственный тип действий, который можно
      совершать сверх одного действия своего хода. Их можно совершать и до, и
      после основного действия, поэтому ход в фазе действий раскладывается на три
      шага: 1) любое количество неограниченных действий, включая ноль;
      2) ровно одно общее, уникальное или действие по требованию книги;
      3) любое количество неограниченных действий, включая ноль.
    numbers: {steps: 3, main_actions: 1}
    timing: null
    prerequisites: []
    targets: null
    cost: null
    limits:
