  - id: BL-UNIT-006
    area: UNIT
    title: Elder God — отдельный тип отряда
    rule: >
      Elder God во всём считается Great Old One, кроме двух пунктов: он не даёт
      собственного Elder Sign для Ритуала Уничтожения (хотя обычно имеет иные
      способы получать Elder Signs), и он никогда не бросает боевые кубики, а
      вместо этого даёт фиксированный эффект. В остальном Elder God равен Great
      Old One: он блокирует захват отрядов и позволяет захватывать Cultists даже
      при вражеском Monster в регионе.
    numbers: {combat_dice: 0}
    timing: null
    prerequisites: []
    targets: null
    cost: null
    limits: []
    exceptions:
