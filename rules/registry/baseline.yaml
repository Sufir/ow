    exceptions:
      - >
        Книги заклинаний Yellow Sign «The Screaming Dead» и «He Who is Not to be
        Named» дают два действия подряд. Между этими двумя действиями нельзя
        вставить неограниченное действие, поскольку сказано «немедленно».
        Применение такой книги целиком составляет шаг 2.
