      и вовлекает ровно две фракции, независимо от того, чьи ещё отряды там
      присутствуют. Фракция, инициирующая бой, должна иметь в этом регионе не
      менее 1 боевого значения. Даже когда бой доступен как неограниченное
      действие, в одном регионе за ход конкретного игрока может состояться только
      один бой. Все отряды сражающихся фракций, находящиеся в регионе, обязаны
      участвовать в бою.
