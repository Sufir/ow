  - id: BL-ACTION-015
    area: ACTION
    title: "Общее действие 7: Capture Cultist"
    rule: >
      Способ убрать вражеского Cultist с карты и позже принести его в жертву
      своему Great Old One ради Power. Захваченный Cultist считается
      уничтоженным и выбывает из игры, но, в отличие от обычного уничтожения,
      возвращается в резерв своей фракции не сразу, а в следующую фазу сбора
      Power, принося захватившей фракции 1 Power. Пока Cultist захвачен, он
      кладётся на планшет захватившего. Чтобы захватить вражеского Cultist,
      нужен ваш Monster или Great Old One в том же регионе, и у цели не должно
      быть защитника в этом регионе. За одно действие захватывается один Cultist.
    numbers: {cost: 1, per_action: 1, power_on_return: 1}
    timing: >
      Захваченный Cultist возвращается в резерв владельца в следующую фазу сбора
      Power, и тогда же захвативший получает 1 Power.
    prerequisites:
      - Ваш Monster или Great Old One в регионе с целью
      - У цели нет защитника
    targets: "вражеский Cultist без защитника"
