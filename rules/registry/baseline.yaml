  - id: BL-MODULE-010
    area: MODULE
    title: "Colour Gates: таблица эффектов по броску d6"
    rule: |
      1 — МЕТЕОРИТ. Начиная со стартового игрока и далее по порядку хода, первый
      игрок, не контролирующий цветных врат, обязан взять цветные врата из резерва,
      если они есть, и заменить ими одни свои обычные врата. Это делает не более
      одного игрока.

      2 — ПЛОДОРОДИЕ. Синие: контролирующий получает 1 Power. Зелёные:
      контролирующий получает дополнительный Elder Sign за Ритуал Уничтожения в эту
      фазу Doom. Оранжевые: 1 Power. Фиолетовые: 1 Doom. Красные: контролирующий
      уничтожает самый дешёвый вражеский Monster или Cultist на вратах, если такой
      есть. Розовые: дополнительный Elder Sign за Ритуал Уничтожения в этот ход.
      Голубые: уничтожает самый дешёвый вражеский Monster или Cultist на вратах,
      если есть. Жёлтые: 1 Doom. Бирюзовые: контролирующий выбирает двое цветных
      врат и меняет их местами непосредственно перед срабатыванием эффектов врат.
      Светящиеся: контролирующий выбирает эффект любого другого цвета из столбца
      «Плодородие».

      3 — ПИРШЕСТВО. Синие: контролирующий теряет 1 Power. Зелёные: дополнительный
      Elder Sign за Ритуал в эту фазу Doom. Оранжевые: получает 1 Power.
      Фиолетовые: теряет 1 Doom. Красные: уничтожает свой отряд на вратах.
      Розовые: не может провести Ритуал Уничтожения в эту фазу Doom. Голубые:
      уничтожает свой отряд на вратах. Жёлтые: получает 1 Doom. Бирюзовые: выбирает
      двое цветных врат и меняет их местами перед срабатыванием эффектов.
      Светящиеся: выбирает эффект любого другого цвета из столбца «Пиршество».

      4 — БЕЗУМИЕ. Синие: получает 1 Power. Зелёные: не может провести Ритуал в эту
      фазу Doom. Оранжевые: теряет 1 Power. Фиолетовые: получает 1 Doom. Красные:
      уничтожает самый дешёвый вражеский Monster или Cultist на вратах, если есть.
      Розовые: получает дополнительный Elder Sign за Ритуал в эту фазу Doom.
      Голубые: уничтожает самый дешёвый вражеский Monster или Cultist на вратах,
      если есть. Жёлтые: теряет 1 Doom. Бирюзовые: заменяет одни свои цветные врата
      на обычные. Светящиеся: выбирает эффект любого другого цвета из столбца
      «Безумие».

      5 — ПОРЧА. Синие: теряет 1 Power. Зелёные: не может провести Ритуал в эту фазу
      Doom. Оранжевые: теряет 1 Power. Фиолетовые: теряет 1 Doom. Красные:
      уничтожает свой отряд на вратах. Розовые: не может провести Ритуал в эту фазу
      Doom. Голубые: уничтожает свой отряд на вратах. Жёлтые: теряет 1 Doom.
      Бирюзовые: заменяет одни свои цветные врата на обычные. Светящиеся: выбирает
      эффект любого другого цвета из столбца «Порча».

      6 — УХОД. Игрок с наименьшим Doom может выбрать одни цветные врата в любом
      месте карты и заменить их обычными. При равенстве наименьшего Doom это делают
      все игроки с равным счётом, по порядку хода. После этого кубик цвета
      перебрасывается. При повторном броске 6 больше ничего не происходит. При любом
      другом результате сверяются с соответствующим столбцом таблицы.
