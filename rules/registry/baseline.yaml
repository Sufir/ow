  - id: BL-COMBAT-003
    area: COMBAT
    title: Способности до боя
    rule: >
      Первый шаг — применить или не применять способности и книги заклинаний,
      срабатывающие до боя. Как и все способности, они необязательны, если прямо
      не сказано иное. Поскольку они не являются действиями, Power для них обычно
      не нужен. Части таких способностей нужен определённый тип отряда в бою,
      другим достаточно, чтобы отряд был в игре — не обязательно в самом бою.
      Первой применяет все свои способности до боя фракция, инициировавшая бой,
      и в любом порядке по своему выбору; затем то же делает защищающаяся
      фракция. То есть все способности атакующего срабатывают до любой из
      способностей защищающегося. Если атакующий воздержался от способности
      до боя, он не может применить её после того, как защищающийся выбрал и
      применил свои.
