# components.yaml — реестр физических компонентов «Нефтяных войн»
#
# Источник истины по вопросу «что физически есть в коробке, из чего сделано
# и в каком состоянии». Игровые данные компонента (числа отрядов, стоимости,
# составы фракций, термины, правила) здесь НЕ дублируются — на них стоят ссылки.
# Схема и словари состояний — rules/registry/SCHEMA.md, раздел «components.yaml».
#
# Собирается отчёт: python rules/tools/components.py all → rules/reports/16-components.md
# Руками правится только этот файл.

meta:
  updated: 2026-09-24
  created: 2026-09-22
  supersedes: >
    archive/Инвентаризация компонентов (v2, 2026-09-22).xlsx — черновая ревизия
    от 2026-08-27, снята с работы и перенесена в архив 2026-09-22
  task_ref: D-004
  factions_canon: 8
  counters_note: >
    Счётчики не проставляются руками — их считает components.py и печатает
    в шапке отчёта. Здесь только то, что счётчиком не является.

  # Где живёт истина по каждому вопросу. Реестр компонентов ни один из этих
  # вопросов не решает и чисел оттуда не копирует — только ссылается.
  truth_map:
    Состав и количества отрядов фракции: rules/registry/factions.yaml → redesign[].units
    Уникальные компоненты фракции: rules/registry/factions.yaml → redesign[].extras
    Очередь расстановки: rules/registry/factions.yaml → meta.queue_scale
    Числа правил: rules/registry/numbers.yaml
    Термины и написания: rules/registry/terms.yaml, CLAUDE.md §2
    Иконки: rules/registry/icons.yaml
    Как работает правило: rules/RULEBOOK.md
    Области и смежности поля: board/regions.yaml, board/edges.yaml
    Геометрия и раскладки поля: board/geo/, board/derived/
    Решения автора: rules/DECISIONS.md
    Находки по правилам: rules/registry/issues.yaml
    Находки по фракциям: rules/registry/factions.yaml → findings

  # Правило дедупликации. Нарушение — дефект реестра, ловится валидатором.
  dedup_rule: >
    Количество отрядов фракции в этом файле не пишется ни разу. Запись
    фракционного компонента несёт count_source: FACTIONS и count_ref на путь
    внутри factions.yaml; число подставляет отчёт при сборке. Если число
    понадобилось прямо здесь — значит, запись заведена не там, где надо.

  state_vocab:
    content: [N/A, TODO, IN-REVIEW, ISSUES, VERIFIED]
    design: [N/A, NONE, DRAFT, IN-REVIEW, APPROVED]
    production: [N/A, NONE, READY, PARTIAL, DONE, UNKNOWN]

  # Что означает UNKNOWN: состояние не выяснено, и выдумывать его нельзя.
  # Такие записи отчёт выносит отдельным списком «требует подтверждения Alek».
  unknown_policy: >
    production: UNKNOWN ставится там, где готовый файл есть, старая
    инвентаризация называла компонент напечатанным, но в перечне физически
    готового от 2026-09-22 он не назван. Это не «скорее всего готово» —
    это «не подтверждено».

  # Перечень ниже — устное подтверждение Alek в рабочей сессии 22.09.2026.
  # Документом проекта он не зафиксирован: ни в DECISIONS.md, ни в STATE.md,
  # ни в release-notes его нет. На нём стоит production у четырнадцати
  # записей, поэтому он же — самое слабое звено реестра (COMP-I-022).
  production_confirmed_2026_09_22: >
    Перечень названного Alek физически готовым на 22.09.2026: все миниатюры;
    акрил — энграммы, рой дронов, жетон первого игрока, лаборатория, маркеры
    фракций; напечатаны трек влияния (победных очков) и треки Судного дня;
    закуплены маркеры нефти; боевые кубики оклеены наклейками.
    Остальной акрил (вышки, маркер Судного дня, ЦУ, зоны сети) в перечень
    не входит — у него production: NONE.

  production_confirmed_2026_09_22_round4: >
    Четвёртый круг, тем же днём. Зон сети нарезано 4 — количество
    зафиксировано. Карта «Контроль сети» не сделана: «готовы» третьего
    круга относилось только к акрилу, к стендам и жетонам. Тайл «Луна»
    не печатался, картинка сгенерирована.

  production_confirmed_2026_09_22_round3: >
    Третий круг, тем же днём. Нарезан весь оставшийся акрил: маркер Судного
    дня, ЦУ, зоны сети, вышки Глобал Петролеум. Планшеты фракций признаны
    неготовыми совсем — их переверстают и вычитают, только потом печать.
    Игровое поле объявлено не начатым: есть сырые наброски, топология
    и реестр областей, полотна нет. Наёмники не начаты и идут последними.
    Кубики готовы, наклейки печатались с запасом — лишние остались.
    Все миниатюры готовы. Карты задач и технологий напечатаны, решение
    о перепечатке — после ещё одной вычитки.

  production_confirmed_2026_09_22_round2: >
    Второй круг, тем же днём: Alek прошёл список из десяти записей
    с production: UNKNOWN и ответил по каждой. Напечатано — обычные
    фабрики, карты скрытого влияния, карты задач, карты технологий,
    жетоны «Община», особые фабрики, карты уникальных полковников;
    числовой кубик куплен. Планшеты фракций НЕ напечатаны: требуют
    доработки. Карты задач и технологий напечатаны, но, по словам Alek,
    могут потребовать переработки — поэтому у них production: DONE
    при content: ISSUES. Карты событий фабрик остались UNKNOWN:
    Alek не помнит и проверит позже. Тайл «Луна» в круг не входил
    (COMP-I-008).

