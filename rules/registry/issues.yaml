      removal from Battle does not prevent that Unit from using its own
      Post-Battle abilities.»
      РАЗВОДИТ ИХ FAQ, и делает это дважды, прямым текстом:
      «The Invisibility Spellbook states that the Unit "takes no part in the
      rest of the Battle." THIS INCLUDES ALL POST-BATTLE ABILITIES AND EFFECTS.»
      И вопрос про отряд, отброшенный из битвы способностью Howl: «Can Units
      retreated due to Howl still use Battle Abilities that have not yet been
      activated (such as promoting Units via Million Favored Ones, or
      Nyarlathotep's Harbinger)? — No, they do not participate in the rest
      of the Battle, and so cannot use their Abilities.» Harbinger — финальный
      эффект, то есть спрошено ровно про наш случай.
      Цитаты сверены лично по SRC-FAQ и по встроенному FAQ обеих вёрсток
      рулбука: «takes no part» — 3 вхождения, «do not participate in the rest
      of the Battle» — 6.
    redesign: >
      Первая редакция части 8, написанная в P8. В 8.3 стояло «его собственные
      ТАКТИЧЕСКИЕ эффекты применить уже нельзя» — сужение против «any
      Battle-related ability» оригинала. В 8.8 исключение было выдано «любому
      иному удалению из битвы» без привязки к фазе, дословно по второму
      правилу.
      Вместе два сужения давали перевёрнутое правило: отряд, снесённый
      тактическим эффектом, сохранял право разыграть свой финальный эффект.
    difference: >
      Меняет игровое поведение и обесценивает тактическую фазу как средство
      превентивного удара: в оригинале снести отряд до бросков — значит лишить
      его всех боевых эффектов, а по нашей первой редакции финальный эффект
      всё равно срабатывал бы.
      Правильное чтение: область второго правила — удаление КАК РЕЗУЛЬТАТ
      БИТВЫ, назначенный в финальной фазе. Отряд, выбывший раньше, в битве
      уже не участвует, и боевых эффектов у него в этой битве нет вовсе.
    severity: CRITICAL
    status: DECIDED
    proposal: >
      В 8.3 расширить до «ни один его боевой эффект — ни тактический,
      ни финальный». В 8.8 сузить исключение до удаления результатом битвы
      и проговорить, чем две строки таблицы различаются.
    confidence: HIGH
    decision: >
      Приводим к оригиналу по прайм-директиве устава §3. Отдельного решения
      автора не требует: обе правки восстанавливают исходное правило, а решения
      потребовало бы как раз сохранение нашей перевёрнутой редакции.
      Внесено в 8.3 и 8.8 при правке части 8 по итогам сверки. Формулировка
      различия: «выбыл ли отряд из битвы раньше, чем дошло до результатов».
      Вынесено Alek в отчёте по части 8.
      СЛЕДСТВИЕ ДЛЯ РЕЕСТРА: BL-COMBAT-004 и BL-COMBAT-010 надо дополнить
      областью действия и ссылкой на эти два ответа FAQ. Сейчас они читаются
      как противоречие, и именно поэтому дефект прошёл в текст.
    decision_ref: D-022
    opened: 2026-09-11
    closed: null

  - id: MISS-019
    type: MISSING
    category: [EFFECT, CONDITION]
    area: COMBAT
    batch: B3
    title: "Потеряно: эффект, написанный через смерть, от уничтожения не срабатывает"
    baseline_ref: BL-COMBAT-009
    redesign_ref: null
    original: >
      SRC-RB-NEW и SRC-RB-OLD, глава про битву, сразу после введения третьего
      типа результата: «Note that many Post-Battle abilities are triggered by
      Kills or Pains. These are specific results, meaning that if an Elimination
      occurs, it would not trigger one of those abilities. For example,
      Windwalker's Cannibalism requires an enemy Unit to be Killed, not
      Eliminated (such as via Devour, Abduct, etc.). Sleeper's Demand Sacrifice
      does not protect against Eliminations, only actual Kills, etc.»
      Сверено лично, вхождений «triggered by Kills» — 2, по одному на вёрстку.
    redesign: >
      В черновике правила нет. Сплошной поиск по всем шести файлам редизайна:
      формулировок об условиях срабатывания способностей через смерть против
      уничтожения нет ни одной.
      В нашем тексте односторонняя вложенность была проговорена в 3.4
      («уничтожен — убит в бою или удалён с поля любым другим способом»),
      но практическое следствие для способностей — нет.
    difference: >
      Потеряно правило, без которого вся односторонность терминов остаётся
      теорией. Именно оно объясняет, ЗАЧЕМ смерть и уничтожение разведены:
      десятки способностей срабатывают строго от одного из результатов.
      D-019 и TERM-030 требуют, чтобы это читалось; STRUCTURE §13 закрепляет
      в глоссарий только формулу вложенности, а само правило не несёт ни один
      раздел структуры — при том что в оригинале оно стоит в главе про битву.
    severity: ERROR
    status: DECIDED
    proposal: >
      Дописать в 8.5, сразу после «финальный эффект может добавить третий тип
      результата», и повторить кратко в статье глоссария «Уничтожение».
    confidence: HIGH
    decision: >
      Восстанавливаем по D-022, общий принцип «потерянные правила возвращаем».
      Внесено в 8.5: «Многие финальные эффекты срабатывают строго от смерти
      или строго от подавления. Это конкретные результаты: если отряд не убит,
      а уничтожен, эффект, написанный через смерть, не срабатывает. Всегда
      смотрите, через какое слово написан эффект.»
      Примеры оригинала не переносятся — они фракционные (D-021).
      В требования STRUCTURE §13 добавить: статья «Уничтожение» несёт не только
      формулу вложенности, но и это следствие.
    decision_ref: D-022
    opened: 2026-09-11
    closed: null

  - id: MISS-020
    type: MISSING
    category: [SEQUENCE]
    area: COMBAT
    batch: B3
    title: "Потеряно: способность, ведущая чужое отступление, не связана порядком сторон"
    baseline_ref: BL-COMBAT-014
    redesign_ref: null
    original: >
      FAQ, ответ из трёх частей, из которых BL-COMBAT-014 записал две:
      «Regarding Crawling Chaos's Madness Spellbook, must he obey normal
      restrictions on retreating Units? — Yes, he must obey normal retreat
      rules. He also does not get to choose WHICH Units retreat, only their
      destination. ALSO NOTE THAT WITH MADNESS, CRAWLING CHAOS CAN RETREAT
      PLAYERS IN EITHER ORDER. THAT IS, HE MAY RETREAT THE DEFENDER FIRST.»
      Сверено лично: «retreat the Defender first» — 3 вхождения, в SRC-FAQ
      и во встроенных FAQ обеих вёрсток, то есть правило живо и в самом свежем
      источнике.
    redesign: >
      Третья часть ответа не записана ни в baseline, ни в черновике.
      В первой редакции части 8 наш текст вдобавок её запрещал: 8.2 говорил,
      что при применении подавлений порядок «атакующий, затем защищающийся»
      обязателен всегда, а 8.7 — что такая способность «подчиняется тем же
      ограничениям».
    difference: >
      Общее правило порядка (атакующий первым) в оригинале есть, но для
      способности, распоряжающейся чужим отступлением, оно прямо снято.
      Наш текст снятие терял и превращал в запрет.
    severity: WARNING
    status: APPLIED
    proposal: >
      Дописать в 8.7 одну фразу и дополнить BL-COMBAT-014 третьим элементом
      ответа.
    confidence: HIGH
    decision: >
      Восстанавливаем по D-022. Внесено в 8.7: «Зато порядок сторон она
      не связывает: отряды атакующего и защищающегося такая способность
      отводит в любом порядке.»
      BL-COMBAT-014 дополнить при следующем проходе по baseline: запись
      сейчас несёт два элемента ответа FAQ из трёх.
      2026-09-15, ВТОРОЙ ЗАХОД. Проход P9 (раздел B2 отчёта) удалил эту фразу
      как «добавку, под которую нет решения», — решение было, это D-022.
      Фраза возвращена в 8.7 и переформулирована: «Зато порядок сторон такая
      способность не связывает: отряды атакующего и защищающегося она отводит
      в любом порядке — правило „сначала атакующий“ на неё не распространяется.»
      Противоречие с 8.2 снято с другой стороны: 8.2 требует порядок только
      в тактической подготовке. См. D-038.
    decision_ref: D-022
    opened: 2026-09-11
    closed: null

  - id: RULE-008
    type: AMBIGUITY
    category: [SEQUENCE]
    area: COMBAT
    batch: B3
    title: "Судьба фабрики, чей пехотинец убит или отступил, нигде не названа"
    baseline_ref: BL-GATE-001
    redesign_ref: null
    original: >
      Прямого правила нет, но оригинал многократно показывает, что пехотинец
      на вратах — законная цель результатов боя. Разбор битвы, SRC-RB-NEW
      стр. 26: «Rich assigns the 4 Pains against him… to everything except
      the Cultist on his Gate» — то есть мог бы и на него.
      FAQ, дословно: «If a Battle takes place on the Slime Sea Overlook and
      THE GATE'S CONTROLLER IS PAINED OR KILLED, can his enemy retreat into
      an adjacent Area containing only Slimes? — Yes, because the Slimes are
      now uncontrolled!» Сверено лично.
    redesign: >
      Ни черновик, ни наш текст не говорят, что происходит с фабрикой, когда
      её пехотинец подавлен или убит. При этом 7.3.5 требует снимать пехотинца
      с фабрики свободным действием, а свободные действия доступны только
      в свой ход (7.6). Игрок, получивший подавление на пехотинца-контролёра
      в чужой ход, ответа в тексте не находит.
    difference: >
      Пробел не оригинала, а подачи: у нас правило про уход с фабрики
      сформулировано через свободное действие, и из-за этого отступление
      выглядит невозможным. В оригинале такого противоречия не возникает,
      потому что там нет нашей фразы про свободное действие.
    severity: WARNING
    status: DECIDED
    proposal: >
      Одна фраза в 8.7.
    confidence: HIGH
    decision: >
      Закрываем по D-026, «пробел закрываем, а не оставляем». Новой механики
      это не вводит: контроль по определению обозначается пехотинцем на фабрике
      (BL-GATE-001), поэтому его уход делает фабрику незанятой — следствие
      определения, а не новое правило.
      Внесено в 8.7: «Пехотинец, который стоял на фабрике, при отступлении её
      покидает, и фабрика становится незанятой. То же происходит, если он убит.
      Свободное действие для этого не нужно и очереди хода не требуется:
      результаты битвы применяются сразу.»
    decision_ref: D-026
    opened: 2026-09-11
    closed: null

  - id: DEV-023
    type: DEVIATION
    category: [COST]
    area: UNIT
    batch: B5
    title: "Первая редакция 11.2 напечатала цену вербовки полковника, а вопрос открыт"
    baseline_ref: BL-UNIT-008
    redesign_ref: RD-UNIT-001
    original: >
      В рулбуке числа нет: «High Priests are a new type of Cultist. They are
      RECRUITED LIKE ACOLYTES, and they each generate 1 Power during the Gather
      Power Phase.» Оборот «like Acolytes» описывает ПРОЦЕДУРУ — не нужны
      контролируемые врата, годится любой регион со своим отрядом, — а не цену.
      Цена живёт на компоненте; BL-UNIT-008 берёт `cost: 3` из SRC-WIKI.
    redesign: >
      NUM-095, match UNKNOWN, дословно: «Три источника редизайна дают три разных
      ответа. Черновик (586): полковник вербуется "по тем же правилам, что
      и обычный пехотинец", — то есть за 1 нефть. Приложение, подпись под
      таблицей (49): повторная вербовка стоит 2 нефти. Сама таблица (35–44):
      "Стоим." = 3 у восьми полковников и "2/2" у двоих. Оригинал даёт 3.
      Числа живут на карте лояльности, то есть на компоненте (D-004); выбор
      между тремя вариантами здесь не делается.»
      ПЕРВАЯ РЕДАКЦИЯ 11.2 написала: «вербуется по тем же правилам, что рекрут
      (7.3.1): 1 нефть, контролируемая фабрика не нужна…»
    difference: >
      Открытый числовой вопрос был закрыт молча, и выбранный вариант не совпадает
      ни с оригиналом (3), ни с нашей же таблицей приложения (3 и «2/2»).
      Механизм ошибки: ссылка на 7.3.1 подтянула из того раздела не только
      процедуру, но и цену, потому что у нас в 7.3.1 они стоят рядом.
      Это ровно та ловушка, от которой предупреждает устав §4: одно слово
      меняет правило, а «по тем же правилам» — не то же, что «по той же цене».
    severity: CRITICAL
    status: DECIDED
    proposal: >
      Число из текста убрать, процедурную часть сохранить, цену отнести
      к компоненту — как сделано в 7.3.2 для боевых машин.
    confidence: HIGH
    decision: >
      Правим немедленно: «вербуется тем же действием и по той же процедуре, что
      рекрут: контролируемая фабрика не нужна, ставится в любой регион, где есть
      любой ваш отряд. Стоимость вербовки указана на планшете фракции.»
      NUM-095 остаётся UNKNOWN: выбор между 1 / 2 / 3 — вопрос компонента
      и решения Alek, не редактуры. Текст правил больше его не предрешает.
      ВЫВОД НА БУДУЩЕЕ: ссылаясь на другой раздел за процедурой, проверять,
      не втащил ли ты вместе с ней число.
    decision_ref: D-022
    opened: 2026-09-11
    closed: null

  - id: MISS-021
    type: MISSING
    category: [EFFECT, CONDITION]
    area: UNIT
    batch: B5
    title: "Энграммы: потеряна разрешающая половина правила и замена на фабрике"
    baseline_ref: BL-UNIT-007
    redesign_ref: RD-UNIT-004
    original: >
      ДВА ПРАВИЛА, оба сверены лично по SRC-RB-OLD и SRC-RB-NEW.
      Первое: «They CANNOT use the Move Action, BUT THEY MAY PERFORM ANY OTHER
      GAME ACTION in addition to all Cultist functions — i.e., they earn Power
      during the Gather Power Phase, Create, Control, and Abandon Gates, and
      permit the Recruitment of Cultists in their Areas.»
      Второе, сразу за текстом Surgery: «You must place these Brain Cylinders
      in the same Area(s) as the Cultists they replace — THEY CAN REPLACE YOUR
      CULTISTS ON GATES, IMMEDIATELY RETAKING CONTROL OF THOSE GATES. You can
      also swap out Cultists that are not on the Map, but still in play.»
    redesign: >
      Черновик несёт только запретительные половины: три исключения энграмм
      и требование размещать «точно в тех же местах». Ни «может выполнять любые
      действия, кроме перемещения», ни замены пехотинца на фабрике с возвратом
      контроля, ни замены пехотинца, который в игре но не на поле, в черновике
      нет. Первая редакция 11.5 повторила черновик.
    difference: >
      Потеряны два правила, и оба всплывают за столом первым же вопросом.
      Первое: «а фабрику энграмма держать может?» Формально выводится
      из «энграмма — пехотинец во всём, кроме трёх исключений», но на этом
      проекте дважды ошибались именно на выводах, и игрок будет выводить сам.
      Второе серьёзнее: без него Извлечение сознания читается как потеря
      контроля над фабриками — ведь по 7.6 взятие фабрики под контроль
      отдельное свободное действие и только в свой ход.
      ПРОБЕЛ ЕСТЬ И В BASELINE: BL-UNIT-007 разрешающей половины не содержит,
      BL-MODULE-018 — правила про фабрики.
    severity: ERROR
    status: DECIDED
    proposal: >
      Дописать обе половины в 11.5 и дополнить BL-UNIT-007 и BL-MODULE-018.
    confidence: HIGH
    decision: >
      Восстанавливаем по D-022. Внесено в 11.5 двумя абзацами: «Энграммой можно
      заменить и пехотинца, стоящего на фабрике — она сразу же занимает его
      место и снова берёт её под контроль. Свободное действие для этого
      не нужно» и «Во всём остальном энграмма — полноценный пехотинец. Кроме
      перемещения, она выполняет любые действия; приносит 1 нефть в фазу
      получения ресурсов; строит фабрики, берёт их под контроль и покидает их;
      и позволяет вербовать пехотинцев в своём регионе.»
      Оговорка про пехотинцев «в игре, но не на поле» перенесена условно —
      «если у вашей фракции бывают такие состояния»: примеры оригинала
      фракционные (Submerged у Cthulhu, Cursed Slumbering Gate у Sleeper),
      а есть ли аналог у нас, решается при выверке фракций.
      Дополнить baseline: BL-UNIT-007 разрешающей половиной, BL-MODULE-018 —
      правилом про замену на вратах.
    decision_ref: D-022
    opened: 2026-09-11
    closed: null

  - id: MISS-022
    type: MISSING
    category: [CONDITION, SEQUENCE]
    area: UNIT
    batch: B8
    title: "Рой: потеряно условие развёртывания и отступление ничейного Роя"
    baseline_ref: BL-UNIT-009
    redesign_ref: RD-UNIT-005
    original: >
      ДВА ПРАВИЛА, оба сверены лично по SRC-RB-OLD.
      Первое, условие действия: «The Faction that CONTROLS THE GATE on the Slime
      Sea Overlook takes this Loyalty Card and IS ALLOWED TO PERFORM the new Call
      Slime Mold Action.» То есть развёртывать Рой может только держатель карты,
      а не любой игрок.
      Второе, отступление бесхозного Роя: «If an uncontrolled Slime Mold is
      Pained (or Retreated) and Madness is not in effect, THEIR ATTACKER CHOOSES
      THE AREA to which they are Pained, following normal Pain rules.»
      Подтверждено SRC-FAQ: «…and in the latter, you choose where the Slime
      is sent».
    redesign: >
      Черновик описывает «Развёртывание роя» как единственный способ вывести Рой
      на поле, но условия выполнения действия не называет: сказано только, что
      контроль узловой фабрики даёт карту Контроля сети. Правила отступления
      ничейного Роя в черновике нет вовсе.
      Первая редакция 11.6 повторила оба пробела и вдобавок закрыла второй
      выдумкой: «Кто бросает за ничейный Рой — решают игроки за столом.»
      Такого правила в оригинале нет: «roll dice for them» — 1 вхождение
      на вёрстку, «who rolls» — только про Watcher в примере боя.
    difference: >
      Первое: без условия непонятно, может ли развернуть Рой игрок, не держащий
      узел. Это прямо меняет ценность узловой фабрики.
