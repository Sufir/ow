      «Список регионов Лаборатории: на стороне "3" нет "Аравийского полуострова"»
      со статусом «ждёт Alek», и в реестре её нет.
      Практически: три региона на выбор для партии втроём — это мало, и ошибка
      даже в одном из трёх режет выбор до двух.
    severity: WARNING
    status: DECIDED
    proposal: >
      1. Сверить все три списка с готовой картой и выправить по факту.
      2. Ту же сверку провести для §11.6: примеры размещения Узла управления
         и Зон сети называют регионы (Скандинавия, Северная Азия, Восточная Африка
         и другие) без привязки к числу игроков.
      3. Заодно решить, что делать со списками для 6–8 игроков: D-040 п.6 решил
