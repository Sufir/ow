      §4.2: «Если у вас 21 и больше, "оберните" трек: при запасе 23 поставьте маркер
      на отметку 3 и помните, что на самом деле у вас 23».
      Для скрытого влияния книга оговаривает режим информации прямо (§3.8, §6.4:
