  - id: RED-012
    type: PLAYTHROUGH
    category: [CONDITION]
    area: ACTION
    batch: P11
    title: "§7.5 не говорит, что делать с невыполнимым требованием задачи (задачи 5 и 6 Братства против Moon Systems)"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по классу 6 — невозможные состояния; проход по задачам Братства Сингулярности"
    assumption: >
      §7.4 закрывает этот случай для уникальных действий, §7.5 — нет; какое из
      трёх чтений верно, книга не говорит.
    original: >
      ДЫРА ТА ЖЕ И ОНА В ОРИГИНАЛЕ ОТКРЫТА: правило «нельзя выполнить не
      целиком» там дано только уникальным действиям — «you cannot execute a
      UNIQUE ACTION unless you are able to perform it completely» (SRC-RB-NEW,
      с. 22), — а следующий абзац, Spellbook Requirement Actions, такой
      оговорки не содержит. НО ЭТО НЕ ORIGINAL PARITY ISSUE: в оригинале
      конфликтующей пары не бывает, потому что Bubastis (= Moon Systems)
      ВСЕГДА контролирует Луну (с. 75). Случай создан тем, что Луны у нас нет
      (RED-006), а не механикой оригинала.
    redesign: >
      Задачи Братства Сингулярности № 5 и № 6: «В качестве действия: каждый
      противник бесплатно строит одну боевую машину, с наименьшей (с самой
      высокой) стоимостью из доступных, на контролируемой им фабрике». §7.4:
      «Уникальное действие нельзя выполнить, если вы не в состоянии выполнить
      его целиком». §7.5: такого правила нет.
    difference: >
      Moon Systems не контролирует ни одной фабрики и контролировать не может
      (RED-006), значит требование для неё невыполнимо физически. Три чтения:
      задача выполняется частично (все, кроме неё); задача не выполняется
      вовсе; задача выполняется, а невозможная часть пропускается. Та же
      развилка проще: у противника нет боевых машин в резерве. Две задачи
      Братства из шести — треть его пути к шести технологиям — зависят от
      состава партии и от выбранного чтения.
    severity: WARNING
    status: APPLIED
    proposal: >
      Дописать в §7.5 одну фразу по образцу §7.4: «Требование задачи, которое
      вы не можете выполнить целиком, выполнять нельзя; часть, невыполнимая
      для отдельного противника, пропускается, и требование считается
      выполненным». Формулировку выбирает Alek — это механика. Альтернативный
      путь: чинится само собой, если закрыть RED-006.
    confidence: HIGH
    decision: >
      D-049: решение автора не потребовалось — ответ нашёлся в FAQ оригинала.
      «Q. How do the Ancients generally interact with requirements or rules
      necessitating all Factions to have a Great Old One? — A. THE ANCIENTS ARE IGNORED
      FOR THIS PURPOSE. For example, the Ancients need not have a Great Old One for an
      independent Azathoth controller to earn his Nuclear Chaos Spellbook.»
      Это и есть общий принцип: фракция, которая физически не может удовлетворить
      требование, ИГНОРИРУЕТСЯ для него, а требование продолжает работать для
      остальных. Вариант А подтверждён источником.
      Второй ответ FAQ показывает границу принципа: «Crawling Chaos can never get his
      Capture Spellbook requirement from Bubastis, which means you cannot use Crawling
      Chaos and Bubastis as opponents in a 2-player game». Когда требование завязано
      на ОДНОГО конкретного противника, оригинал правила не выдумывает, а предупреждает
      о составе. Наш случай другой — требование адресовано каждому противнику.
      Третий ответ подтверждает и саму пару карт: «Q. Can Opener of the Way use They
      Break Through when the Ancients ALLOW EVERYONE TO SUMMON their cheapest / most
      expensive monster? — A. Yes» — то есть это разрешение, а не обязанность.
      Внесено в §7.5: «Требование, направленное на всех противников, выполняется для
      каждого, для кого оно выполнимо. Противник, для которого выполнить его физически
      нельзя, просто пропускается, и требование считается выполненным. Если оно
      невыполнимо ни для кого, выполнять его нельзя.»
    decision_ref: D-049
    opened: 2026-09-16
    closed: null

  - id: RED-013
    type: PLAYTHROUGH
    category: [EXCEPTION, CONDITION]
    area: GATE
    batch: P11
    title: "Уникальный полковник «Роберт Клоуз» ставит вторую фабрику в регион и перебивает §3.6 через §3.9"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по стыку 2 и 7 — §3.9 против §3.6; вариант «Уникальные полковники»"
    assumption: >
      Читается по букве карты («в любом регионе») и §3.9; §3.6 маркера
      безусловности не несёт, см. RED-005.
    original: >
      СВЕРКА НЕПОЛНА. Набор из одиннадцати уникальных полковников
      (print/UniqueColonel/) — реcкин оригинальных Unique High Priests, но
      имена у нас другие и соответствие поимённо не выверено (SRC-002, D-028).
      Однокоренного правила в оригинале не найдено. По уставу §3 расхождение
      без подтверждения считается потенциальной ошибкой, а не замыслом.
    redesign: >
      Карта «Полковник Роберт Клоуз», способность «Эвакуация промышленности»
      (Постоянная): «после действия любого игрока можете уничтожить Роберта
      Клоуза и либо убрать свою контролируемую военную фабрику (контролирующий
      её отряд сохраняется) из любого региона карты, либо разместить новую
      военную фабрику в любом регионе, где у тебя есть отряд». §3.6: «В одном
      регионе не может стоять больше одной фабрики одновременно». §7.3.4:
      нужен свой ПЕХОТИНЕЦ, и обычной фабрики в регионе быть не должно.
    difference: >
      Текст карты не исключает регион, где фабрика уже стоит, и говорит «в
      любом регионе». По §3.9 текст способности побеждает, значит в регион с
      чужой контролируемой фабрикой ставится вторая. §3.6 этот случай не
      разбирает — он его отрицает, а вместе с ним ломаются правило приоритета
