    title: "«Оперативная пауза» замораживает фазу действий навсегда: правило FAQ оригинала не перенесено"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по стыку 1 — окончание фазы действий §7.1, Североамериканский Альянс"
    assumption: >
      Допущений не требуется. «Оперативная пауза» стоит 0 нефти и объявлена
      действием на планшете; §7.1 требует действовать, пока нефть есть, и
      заканчивает фазу только когда круг прошёл впустую.
    original: >
      ДЫРА ЕСТЬ И В ОРИГИНАЛЕ, НО ОРИГИНАЛ ЕЁ ЗАКРЫЛ, А МЫ ПЕРЕНЕСЛИ ТОЛЬКО
      ДЫРУ. Правило конца фазы там такое же уязвимое: «The Action Phase
      continues with each player who still has Power, until all players are
      finally out of Power and no more Actions can be taken» (SRC-RB-NEW, с.
      24), а Lethargy фракции Sleeper стоит 0 и Power не тратит. Но FAQ
      отвечает прямо и по имени: «Q. Can I use Lethargy forever, thus
      preventing the game from ending? — A. …Sleeper CANNOT USE LETHARGY IF NO
      ONE ELSE IS ACTIVE; just go ahead and finish out the Action Phase». По
      D-003 и D-022 это правило обязано было войти в тело книги. Оно не вошло,
      потому что в baseline.yaml его нет, — ровно тот случай, который разбирал
      D-038.
    redesign: >
      §7.1: «Нефть — топливо фазы: пока она есть хоть у кого-то, фаза идёт»;
      «Точный момент окончания: круг обошёл всех и никто не смог действовать»;
      «отказаться от действия, пока у вас есть нефть, тоже нельзя»; «Ход при
      нулевом запасе пропускается». Планшет Североамериканского Альянса:
      «Оперативная пауза (Действие. Стоимость: 0). Если Тексан в игре, ничего
