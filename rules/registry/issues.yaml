  - id: RED-014
    type: PLAYTHROUGH
    category: [LIMIT, EFFECT]
    area: DOOM
    batch: P11
    title: "«Репрессии» без лимита частоты: шесть и более карт скрытого влияния за одну фазу влияния"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по классу 1 — циклы; технология Клонэйд Ресёрч"
    assumption: >
      Читается по §3.9: пометка на карте задаёт МОМЕНТ («Фаза влияния»), а
      частоту не задаёт, значит лимита нет.
    original: >
      ЭКСПЛОЙТ НЕ ВОСПРОИЗВОДИТСЯ. Это Blood Sacrifice фракции Black Goat
      (MAP-05). Рулбук называет число единственным дважды: «Blood Sacrifice.
      This lets you earn AN Elder Sign IN EVERY DOOM PHASE. As a bonus, it
      puts Cultists back into your Pool…» (с. 71) и «even with just two Gates
      and Shub-Niggurath, Blood Sacrifice nets you TWO Elder Signs and four
      Doom every time you perform a Ritual during the Doom Phase» — вторая
      приходит за Great Old One по шагу 4 Ритуала, сама способность даёт одну.
    redesign: >
      Технология «Репрессии» (Клонэйд Ресёрч, Фаза влияния): «Если боевой
      робот "Жнец" находится в игре, вы можете уничтожить одного из своих
      пехотинцев и получить за это карту скрытого влияния». §3.9: «Кроме
      момента, пометка на карте может задавать частоту — например, "один раз
      за игру"».
    difference: >
      Пометки частоты у «Репрессий» нет. В фазу влияния на поле шесть рекрутов
      и полковник, а с Лабораторией — ещё до четырёх энграмм. Игрок уничтожает
      их одного за другим и берёт семь (одиннадцать) карт скрытого влияния за
      одну фазу: около 12 (18) влияния при пороге окончания партии 30.
      Пехотинцы возвращаются в резерв (§3.4) и вербуются заново по 1 нефти.
      Побочно ломается колода: §6.4 говорит, что раскрытые карты в колоду не
      возвращаются, а 36 карт при таком темпе кончаются за две-три фазы.
    severity: WARNING
    status: APPLIED
    proposal: >
      Правка на карте (D-004): дописать «один раз за фазу влияния». Плюс
      сплошным поиском (D-036) пройти все карты технологий и восемь планшетов
      и проверить, у каких способностей момент задан, а частота нет: тот же
      дефект может стоять не только здесь.
    confidence: HIGH
    decision: >
      D-045: АДРЕС ПРАВКИ ОКАЗАЛСЯ ДРУГИМ. Оригинальная карта тоже не несёт пометки
      частоты — наш перевод точен. Потеряно правило тела рулбука: «Some Spellbooks,
      special abilities… take effect during the Doom Phase. These will usually occur
      when it is your turn to perform a Ritual of Annihilation».
      Внесено в §6.5: «Каждый такой эффект срабатывает один раз за фазу — в вашу
      очередь, если в его тексте прямо не сказано иное. То же относится к эффектам
      фазы получения ресурсов».
    decision_ref: D-045
    opened: 2026-09-16
    closed: null

  - id: RED-015
    type: PLAYTHROUGH
    category: [SEQUENCE, EFFECT]
    area: COMBAT
    batch: P11
    title: "«Санкции» и «Системный сбой» преобразуют результаты по кругу; §8.5 порядка между ними не даёт"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по стыку 4 — тайминг боевых эффектов; Североамериканский Альянс против Moon Systems"
    assumption: >
      Пришлось бы решать за столом, применяется ли финальный эффект к
      результатам, уже преобразованным тактическим, или к исходным.
    original: >
      ВОПРОС ЗАКРЫТ FAQ ОРИГИНАЛА, И ОТВЕТ У НАС НЕ ПЕРЕНЕСЁН. Это Demand
      Sacrifice (Sleeper) против Zagazig (Bubastis), и FAQ содержит ровно эту
      пару: «Q. What happens in a Battle with Sleeper if Bubastis chooses to
      both use Zagazig and chooses option 2 from Sleeper's Demand Sacrifice
      ("All of their Kill results against your Units in this Battle count as
      Pains, instead.")? — A. ANY PAINS CONVERTED INTO KILLS BECOME SINGLE
      PAINS. I recommend against using Bloodthirst!» То есть конверсия не идёт
      по кругу: результат, ставший подавлением, обратно смертью не становится.
    redesign: >
      Технология «Санкции» (Североамериканский Альянс, Битва. Тактическая
      подготовка): «Если "Техасец" в игре, перед битвой ваш противник должен
      выбрать одно: — Вы получаете скрытое влияние. ИЛИ — Все его результаты
      со смертью будут считаться отступлениями». Технология «Системный сбой»
      (Moon Systems, Битва. Финал): «Если в битве участвовала Модель 2,
      все выброшенные отступления считаются смертями, а все смерти —
      отступлениями. Для обоих участников битвы». §8.5 задаёт порядок только
      между игроками («первым применяет атакующий»), но не между тактическим
      эффектом, изменившим будущие результаты, и финальным, изменяющим
      назначаемые.
    difference: >
      Moon Systems выбирает второй вариант «Санкций»: её смерти станут
      подавлениями. В финале «Системный сбой» меняет смерти и подавления
      местами у обеих сторон — и, если применять его к уже преобразованным
      результатам, возвращает Moon Systems её смерти, то есть отменяет
      «Санкции» целиком. Выбор, который «Санкции» навязывают противнику,
