  - id: PLAY-037
    type: PLAYTHROUGH
    category: [SEQUENCE, EXCEPTION]
    area: COMBAT
    batch: P10B
    title: Отряд, ушедший из региона битвы до бросков, не описан ни одним из двух способов §8.3
    baseline_ref: null
    redesign_ref: null
    step: "Пограничный случай Б2 — «Специальная операция» Североамериканского Альянса"
    assumption: >
      Пришлось решить, окончена ли битва, если защищающийся увёл все свои отряды
      В СОСЕДНИЙ РЕГИОН до тактической подготовки. Играли по §8.9: отрядов
      у стороны в битве не осталось — битва окончена, кубиков никто не бросает,
      нефть атакующему не возвращается. Но это чтение по смыслу, не по букве.
    original: "Не сверялось: в P10B оригинал не открывается."
    redesign: >
      §8.3: «Если тактический эффект вывел отряд из битвы, этот отряд из битвы
      выбывает. Вывести можно ДВУМЯ СПОСОБАМИ: убрать отряд с поля или оставить
      его в регионе, исключив из битвы».
      §8.9: «Если до бросков кубиков все отряды одной из сторон ВЫВЕДЕНЫ
      ИЗ БИТВЫ, битва окончена. Неважно, убраны они с поля или остались
      в регионе, исключённые из битвы (8.3)».
      Технология «Специальная операция» (Североамериканский Альянс):
      «Непосредственно перед битвой (до начала тактической фазы) в регионе, где
      находится БРМ "Визард", вы можете выполнить одно действие, за его обычную
      стоимость (даже если это не ваш ход или у вас 0 нефти). После выполнения,
      битва продолжается в обычном режиме».
    difference: >
      «Специальная операция» разрешает выполнить ЛЮБОЕ действие до тактической
      фазы, в том числе перемещение, и увести отряды из региона битвы. Получается
      третий способ покинуть битву: отряд остаётся на поле и из битвы
      не исключается — его просто больше нет там, где битва идёт. §8.3 такого
      случая не знает, а §8.9 перечисляет ровно два способа §8.3 и словом
      «неважно» закрывает список.
      Вопросы, которые встают за столом и на которые книга не отвечает прямо:
      окончена ли битва; бросают ли кубики; возвращается ли нефть; и, если
      в регионе у уходящего осталась фабрика с пехотинцем, — считается ли она
      его присутствием в битве.
      Отдельно: сама «Специальная операция» кончается словами «битва продолжается
      в обычном режиме» — то есть компонент утверждает, что битва продолжается,
      а §8.9 при пустой стороне велит её закончить.
    severity: ERROR
    status: APPLIED
    proposal: >
      Переписать §8.9 через состояние, а не через перечисление способов:
      «Если до бросков кубиков в регионе битвы не осталось ни одного отряда
      одной из сторон — убраны они с поля, исключены из битвы или перемещены
