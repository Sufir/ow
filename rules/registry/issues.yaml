  - id: PLAY-033
    type: PLAYTHROUGH
    category: [CONDITION, EFFECT]
    area: GATE
    batch: P10B
    title: Фабрика, которую нельзя взять под контроль, не попадает ни в одно состояние §3.6
    baseline_ref: null
