    decision: >
      D-042: внесено в §4. Свои эффекты игрок применяет в любом порядке; спор эффектов разных игроков за один момент разрешается порядком хода от первого игрока — та же формула, что уже работает в §6.5.
    decision_ref: D-042
    opened: 2026-09-15
    closed: null

  - id: PLAY-009
