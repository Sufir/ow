      региона. Отсюда прямой вопрос за столом: даёт ли группа из трёх «Саранчей»
      силу 2 (формула один раз на группу) или 6 (формула на каждую). Разница
      в три кубика.
      Смежный вопрос, который книга тоже не закрывает: считается ли n по региону
      или по числу отрядов, участвующих в битве (после «Стелса» это разные числа).
