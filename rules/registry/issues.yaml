  - id: TISS-012
    type: TERMINOLOGY
    category: [OTHER]
    area: GLOSSARY
    batch: P12
    title: "Глоссарий вырос с 47 статей до 49: «Карта лояльности» и «Основное действие» стоят вне замороженного состава"
    baseline_ref: null
    redesign_ref: null
    original: null
    redesign: >
      Найдено финальной QA-проверкой P12 (терминология): состав части 13 сверен
      со STRUCTURE.md §13 и с terms.yaml. Замороженная таблица перечисляет
      47 статей, в книге их 49. Лишние две:
        - «Карта лояльности» — запись в карте терминов есть (TERM-020,
          CANONICAL, Loyalty Card), в таблице STRUCTURE.md §13 её нет;
        - «Основное действие» — нет ни в таблице STRUCTURE.md §13, ни
          в terms.yaml вовсе.
    difference: >
      Расхождение реестров с книгой, а не ошибка текста. Обе статьи написаны
      верно и нужны: «Карта лояльности» появилась вместе с разбором наёмников
      (D-038, D-045), «Основное действие» — следствие D-037, который завёл
      пятую категорию действий уже после фриза терминологии в P7. Ни одна
      из двух не меняет игрового поведения и не противоречит телу правил.
      Формально нарушены два правила устава: состав глоссария меняется только
      решением D-###, а «Основное действие» — термин книги без записи в карте.
    severity: INFO
    status: CLOSED
    proposal: >
      Одной строкой решения автора: (1) завести в terms.yaml запись под
      «Основное действие» (оригинал — Action; у нас противопоставлено
      свободному действию, §7.1 и §7.2) и (2) дописать обе статьи в таблицу
      STRUCTURE.md §13, доведя её до 49 позиций. До решения текст не трогать:
      статьи согласованы с телом правил, удаление их обеднит книгу.
      Печать не блокирует.
    confidence: HIGH
    decision: >
      D-050: состав глоссария расширен до сорока девяти статей, обе статьи
      остаются.
      Разбор. Это не дефект текста: обе статьи написаны верно и нужны книге.
      «Карта лояльности» употребляется в правилах семнадцать раз и вводится
      за 350 строк до первого объяснения; «Основное действие» — несущий термин,
      через него определено свободное действие и шаг 2 хода. Расхождение
      процедурное: состав заморожен в P7, а обе статьи появились позже, в P8–P9,
      вместе с разбором наёмников и с пятой категорией действий (D-026, D-037).
      Что сделано: заведена запись TERM-080 «Основное действие» — наш термин,
      прямого соответствия в оригинале нет; у «Карты лояльности» запись была
      (TERM-020, CANONICAL), не хватало строки в таблице STRUCTURE.md §13. Обе
      строки добавлены, счётчик «сорок семь» исправлен на «сорок девять»,
      под таблицей записано, что и почему добавлено.
      Альтернатива — удалить две статьи ради формального соответствия фризу —
      отвергнута: фриз заведён против молчаливого расползания состава, а не
      против обоснованных добавок, и книга от удаления стала бы хуже.
      Проверка terminology в QA-таблице переходит в PASS.
    decision_ref: D-050
    opened: 2026-09-22
    closed: 2026-09-22
  - id: RULE-012
