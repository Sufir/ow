      незаконным назначением.
      Второе даёт прямой тактический трюк: «утопить» лишние подавления в отряде,
      который и так убит, чтобы остальные отряды не отступали. Текст его не запрещает.
      Механика назначения нескольких результатов одному отряду у нас уже существует
      на компоненте: технология Островной Империи «Комбинированная броня» требует
      назначить одному отряду «до 2 смертей и/или отступлений». Значит общее правило
      в книге обязано быть — сейчас его нет.
    severity: ERROR
    status: APPLIED
    proposal: >
      Дописать в §8.5 два предложения: сколько результатов может получить один отряд
      по умолчанию и что происходит с подавлением, назначенным отряду, который
      по итогам такта 2 будет убран с поля. Формулировка должна оставлять место
      способностям, которые прямо требуют нескольких результатов на один отряд.
    confidence: HIGH
    decision: >
      D-041: сверено по оригиналу и внесено в §8.5 тремя абзацами.
      (а) По умолчанию один отряд получает один результат. Прямого запрета в оригинале
      нет, но правило однозначно следует из механики избытка: «If the number of Kills
      rolled exceeds the number of vulnerable Units, ignore the excess results»
      (SRC-RB-NEW, с. 29). Само понятие «лишних» смертей возможно только при
      соотношении 1 результат : 1 отряд. Подтверждено разбором Complex Battle
      Example 7 (с. 38): «all Units... without a result» — учёт ведётся по отрядам
      с результатом и без.
      (б) Отряд, которому назначена смерть, перестаёт быть целью: подавление ему
      не назначается, лишнее подавление пропадает. FAQ, раздел Yuggoth: «If you assign
      the Kill to the other Unit, then the Pain is ignored». Complex Battle Example 5:
      «The other Pain that Lincoln rolled is ignored, as there are no Units to assign
      it to» — при живом, но обречённом отряде на столе. Трюка «утопить подавления
      в убитом» в оригинале нет.
      (в) Исключение — способность, дающая пережить смерть: такой отряд остаётся целью
      и может получить ещё и подавление, и тогда он отступает, а не гибнет. Это ровно
      наша «Комбинированная броня» (в оригинале Regenerate у Great Cthulhu): текст
      нашей карты совпадает с поведением из Example 5 дословно, вопросов к компоненту
      нет.
    decision_ref: D-041
    opened: 2026-09-15
    closed: null

  - id: PLAY-004
    type: PLAYTHROUGH
    category: [EFFECT, CONDITION, SEQUENCE]
    area: COMBAT
    batch: P10
    title: Состояния «отряд выведен из битвы, оставшись в регионе» в правилах нет
    baseline_ref: null
    redesign_ref: null
    step: "Раунд 3, ход 35, битва №4 — защищающийся применяет «Стелс» на единственный отряд атакующего"
    assumption: >
      Пришлось приравнять «не участвует в дальнейшей битве» к «удалён» и объявить
      битву оконченной по §8.9. Книга такого приравнивания не делает.
    original: >
      Не сверялось: в P10 оригинал не открывается.
    redesign: >
      §8.3 знает ровно один случай: «Если тактический эффект удалил отряд, этот отряд
      из битвы выбывает». §8.9: «Если до бросков кубиков удалены все отряды одной
      из сторон, битва окончена». Глоссарий, статья «Тактический эффект», говорит
      «отряд, удалённый из битвы».
      Технология Эйркрафт Корпорейшн «Стелс» (Битва. Тактическая подготовка):
      «Выбранные отряды не участвуют в дальнейшей битве (как если бы их не было
      в регионе)». Отряд при этом остаётся в регионе и с поля не убирается.
    difference: >
      Книга не различает «убран с поля» и «выведен из битвы», а компонент создаёт
      именно второе состояние. В партии это остановило битву: у атакующего в битве
      не осталось ни одного отряда, но ни один не был удалён, поэтому §8.9 формально
      не применяется. Без ответа остались четыре вопроса: окончена ли битва;
      бросает ли сторона ноль кубиков; бросает ли вторая сторона свои и кому
      назначать результаты; применяются ли финальные эффекты выведенного отряда.
      Дополнительно неясно положение отряда после битвы: регион он не покидал,
      значит на удержание региона он влияет.
    severity: ERROR
    status: APPLIED
    proposal: >
      Ввести в §8.3 второе состояние явно и развести формулировки: «убран с поля»
      и «выведен из битвы, оставаясь в регионе». Для второго сказать три вещи:
      его боевая сила не считается, результаты ему не назначаются, его боевые
      эффекты не применяются. И распространить §8.9 на оба случая: битва окончена,
      если до бросков одна из сторон осталась без отрядов В БИТВЕ.
    confidence: HIGH
    decision: >
      D-041: сверено по оригиналу и внесено в §8.3 и §8.9.
      Главное: в оригинале это НЕ отдельное состояние, а часть одного общего понятия.
      SRC-RB-NEW, с. 28: «Some Pre-Battle abilities Eliminate, Kill, or otherwise
      remove a Unit from the Battle. If this happens, that Unit does not participate
      for the remainder of the Battle... Any Battle-related ability possessed by that
      Unit cannot be used». И примером к этому правилу там же стоит именно Invisibility
      (наш «Стелс»): «Crawling Chaos can... use its Flying Polyp's Invisibility to
      "exempt" Great Cthulhu's Shoggoth». Официальное имя состояния — removed from
      Battle.
      Значит наш §8.3 не потерял правило, а сузил его: прочитал «удалил» как «убрал
      с поля». Правка — возврат к 1:1, а не изобретение.
      Ответы оригинала на четыре вопроса симуляции: битва окончена («If all Units of
      one Faction are somehow removed during Pre-Battle... The Battle is over»);
      кубиков не бросает ни одна сторона и нефть не возвращается (FAQ про Energy
      Nexus); финальные эффекты выведенного отряда НЕ применяются («This includes all
      Post-Battle abilities and effects», FAQ про Invisibility). Пятый вопрос: отряд
      остаётся в регионе и действует вне битвы — FAQ разрешает Necrophagy отряду,
      выведенному Стелсом.
      По компонентам: состояние создаёт ровно один наш компонент — карта технологии
      «Стелс» Эйркрафт Корпорейшн, и только она же его упоминает. На планшете фракции
      её нет: технологии живут отдельными картами. Ни один компонент механику
      состояния не объясняет — значит место правилу в книге.
      Два хвоста вынесены отдельно: расхождение формулировки карты и дока фракций
      («как если бы их не было в регионе» против «никак не участвуют») и расхождение
      источников «for any purpose» / «for this purpose» в FAQ про боевую силу.
    decision_ref: D-041
    opened: 2026-09-15
    closed: null

  - id: PLAY-005
    type: PLAYTHROUGH
    category: [NUMBER, CONDITION]
    area: COMBAT
    batch: P10
    title: Формула боевой силы разрешена только боевым роботам, а на планшете она у боевых машин
    baseline_ref: null
    redesign_ref: null
    step: "Раунд 1, битва №1 — подсчёт боевой силы Глобал Петролеум"
    assumption: >
