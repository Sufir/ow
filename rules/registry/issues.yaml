      Солюшн противоречит этому и должен быть исправлен. Связано с D-038 F2.
    confidence: HIGH
    decision: >
      D-042: разобрано по оригиналу; наша книга инвертировала правило, и это исправлено.
      Оригинал: «Yog-Sothoth counts as a Gate for every purpose, except that he is not Controlled by a Cultist and can exist in the same Area as another Gate» (SRC-RB-OLD, с. 117). FAQ: «he is never considered to be Abandoned… Cultists do not Control him, nor can they ride him». И прямо про доход: «Opener gets 2 Power for Yog-Sothoth during the Gather Power Phase. He also gets 1 Doom for having Yog-Sothoth on the Map during the Doom Phase».
      То есть такая фабрика ВСЕГДА считается контролируемой владельцем: 2 нефти ему, ноль противникам, влияние идёт в счёт. По букве нашей книги было наоборот — она была всегда незанятой, кормила по 1 нефти каждого противника и не давала владельцу ничего.
      Внесено: третий случай в §3.6 («Фабрика, которую нельзя взять под контроль»), оговорка в §4.1, оговорка в §6.2, правка статьи глоссария «Незанятая фабрика». Термин намеренно не вводится: terms.yaml заморожен, признак описан по месту.
