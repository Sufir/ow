      Каждый "Рипо" М-3 в игре добавляет 1 к силе б/р "Жнеца", также как
      пехотинцы. "Рипо" М-3 не считаются пехотинцами».
    difference: >
      Часть общих правил книги написана с оговоркой на исключения, часть — нет,
      и разница не систематическая.
      С оговоркой: §3.5 «Боевой силы у пехотинца, КАК ПРАВИЛО, нет»;
      §4.1 «Боевые машины, мехи и боевые роботы, ЗА РЕДКИМИ ИСКЛЮЧЕНИЯМИ, нефти
      не дают»; §1.2 «Слово "обычно" здесь рабочее»; §3.9 «Применять способность
      необязательно, ЕСЛИ В ЕЁ ТЕКСТЕ ПРЯМО НЕ СКАЗАНО ОБРАТНОЕ».
      Без оговорки: §3.6 про контроль фабрики (переопределяется
      «Универсализацией»); §3.6 «в одном регионе не больше одной фабрики, и это
      на всю партию» (переопределяется «Пространственным сдвигом», см.
