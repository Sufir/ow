  - id: DEV-021
    type: DEVIATION
    category: [OTHER]
    area: ACTION
    batch: B2
    title: "Мех: в оригинале отдельное действие призыва, у нас имени действия нет"
    baseline_ref: BL-UNIT-005
    redesign_ref: RD-UNIT-003
    original: >
      «Terror призывается так же, как Monster, действием SUMMON TERROR, которое
      требует контролируемых врат.» SRC-RB-NEW стр. 103. То есть у мехов
      в оригинале своё общее действие с собственным именем, отдельное
      от Summon Monster.
    redesign: >
      Черновик, строка 610: «Мехи строятся по тем же правилам, что и основные
      боевые машины, на военных фабриках.» Название действия не дано;
      отдельного действия в перечне семи общих действий нет.
    difference: >
      Пока игрок делает одно действие за ход, разницы нет: правила постройки
      и лимит «один за действие» совпадают. Разница появляется там, где
      способность даёт ещё одно действие конкретного вида: по оригиналу
      «ещё одно производство боевой машины» мех не даёт, по нашему тексту —
      неясно. Тот же вопрос у лимита: один мех и одна боевая машина за одно
      действие, или один отряд суммарно.
      Второй слой — число общих действий. В оригинале с мехами их восемь,
      у нас в правилах семь (BL-ACTION-005 говорит про семь для базовой игры).
    severity: WARNING
    status: APPLIED
    proposal: >
      Три варианта, выбор за Alek.
      1) Оставить как в черновике: мех строится действием «Производство боевой
         машины», лимит общий — один отряд за действие. Проще всего за столом,
         но расходится с оригиналом в описанном выше случае.
      2) Завести отдельное общее действие «Производство меха» — восьмое.
         Точный перенос оригинала, но ломает счёт «семь общих действий»
         и требует правки памятки.
      3) Оставить одно действие, но написать лимит явно: «за это действие
         производится один отряд — боевая машина ИЛИ мех».
      В любом случае проверить по планшету Братства Сингулярности и по картам
      лояльности наёмных мехов, не написано ли там уже, каким действием
      строится мех.
      До решения текст 7.3.2 повторяет черновик дословно и ничего лишнего
      не утверждает: «Мехи строятся по тем же правилам, что боевые машины,
      и на тех же военных фабриках.» Ранняя редакция части 7 добавляла
      «и тем же действием» — это было моё утверждение сверх источника, снято.
    confidence: HIGH
    decision: >
      РЕШЕНИЕ D-032: СЛИВАЕМ. Действие называется «Производство боевой машины
      или меха», лимит — «за это действие производится ровно один отряд —
      боевая машина или мех». Одна формулировка, списка исключений нет.
      ОБОСНОВАНИЕ, добыто сплошным разбором, а не рассуждением:
      1) Официальная эррата уже слила это сама. SRC-ERRATA-PACK стр. 12:
         «Terrors are summoned AS THOUGH THEY ARE MONSTERS, and require
         a Controlled Gate to be able to enter play» — ни слова «Action»,
         ни имени «Summon Terror». Эррата от 12.2023 свежее рулбука и по D-015
         побеждает.
      2) Summon Terror не был общим действием и в рулбуке: «seven Common
         Actions» — 7 вхождений, «eight Common Actions» — 0. В перечне семи
         действий его нет, раздел Terrors лежит в главе дополнений.
         Официальная карта-памятка перечисляет ровно семь действий.
      3) Имя действия во всём корпусе встречается только внутри определения
         самого действия — 5 вхождений. Ни один spellbook, ни одна карта
         лояльности, ни одна фракционная способность, ни одно правило
         не ссылается на «Summon Monster Action» по имени. Нулевые шаблоны:
         as a Summon Monster, counts as a Summon Monster, additional Summon,
         extra Summon, second Summon, another Summon Monster,
         instead of Summoning, free Summon, additional Action — по нулю.
      4) Все способности, трогающие призыв, адресуют ТИП ОТРЯДА или глагол,
         но никогда действие: Brainless, Festival, Extinction — через тип юнита;
         Fertility Cult — «may Summon any number of Monsters at once»;
         Slime Mold — «Slimes are Monsters, but they cannot be Summoned».
         Слияние действий ни одну формулировку не задевает.
      5) Единственный пробел, который слияние обязывает закрыть: лимит
         «1 за действие» оригинал задаёт только для Monster и про Terror молчит
         (only Summon 1 Terror, 1 Terror, one Terror, single Terror, Terror per —
         0 вхождений). Закрыт самым строгим чтением.
      ЧТО СОХРАНЕНО ОТДЕЛЬНО И ПРОГОВОРЕНО В 7.3.2: мех остаётся отдельным типом
      отряда, способности против боевых машин на него не действуют. Раздельность
      в оригинале объявлена ТОЛЬКО для «abilities that specifically target
      Monsters» — она про юниты, а не про действие.
      ПРАВИЛО ПИСЬМА НА БУДУЩЕЕ: любая наша способность, меняющая производство —
      стоимость, количество, запрет, — обязана называть ТИП ОТРЯДА, а не
      действие. Проверить при выверке технологий и карт лояльности (D-004).
      2026-09-22, D-051: запись оставалась OPEN по недосмотру — решение D-032
      принято, применено и проверено в тексте. Книга говорит ровно то, что оно
      предписывает: раздел называется «7.3.2. Производство боевой машины или меха»,
      в сводной таблице действий он же, лимит — «За это действие производится ровно
      один отряд — боевая машина или мех». Второго имени действия не требуется
      и не вводится. Общих действий по-прежнему семь.
    decision_ref: D-032
    opened: 2026-09-10
    closed: null

  - id: SRC-001
    type: SOURCE-CONFLICT
    category: [TARGET, EFFECT]
    area: COMBAT
    batch: null
    title: "Невидимость: «for this purpose» против «for any purpose»"
    baseline_ref: null
    redesign_ref: null
    original: >
      Один и тот же вопрос FAQ — про то, считается ли отряд, сделанный невидимым,
      присутствующим в регионе, — в двух официальных источниках отвечен по-разному
      по объёму.
    redesign: null
    difference: >
      Отдельный FAQ 2019 года: «An Invisible Unit does not count as being
      "present" in the Area FOR THIS PURPOSE». Встроенный FAQ рулбука эпохи Final
      Onslaught: «...FOR ANY PURPOSE». Первая формулировка ограничивает эффект
      подсчётом боевых значений, вторая распространяет его на всё: присутствие
      для захвата, для прикрытия Cultists, для запрета отступления и так далее.
      Это разное игровое поведение, а не разная редактура.
    severity: WARNING
    status: APPLIED
    proposal: >
      Принять формулировку рулбука — «для любых целей», как более позднюю.
    confidence: HIGH
    source_a: {ref: SRC-FAQ, says: "for this purpose"}
    source_b: {ref: SRC-RB-NEW, says: "for any purpose"}
    newer: SRC-RB-NEW
    official: both
    decision: >
      РЕШЕНИЕ ПРИНЯТО, НО ЕГО ПОСЫЛКА ОПРОВЕРГНУТА — ТРЕБУЕТСЯ ПОДТВЕРЖДЕНИЕ.
      2026-09-10: принята формулировка рулбука «не считается присутствующим
      для любых целей». Основание — D-015: при расхождении официальных источников
      берётся самый свежий. С оговоркой: «на нас, скорее всего, не влияет:
      аналога невидимости у наших фракций, по предварительной оценке Alek, нет».
      2026-09-16, P10: аналог ЕСТЬ. Технология «Стелс» Эйркрафт Корпорейшн =
      Invisibility (factions.yaml, MAP-02): «Выбранные отряды не участвуют
      в дальнейшей битве (как если бы их не было в регионе)». Значит выбор
      формулировки теперь имеет игровые последствия, а не является
      теоретическим.
      Что меняется от выбора: держит ли выведенный отряд фабрику во время битвы,
      блокирует ли он отступление противника в свой регион (8.7), прикрывает ли
      пехотинца при захвате (7.3.7).
      Текст §8.3 написан осторожно и ни одного из трёх вопросов не решает:
      сказано только, что отряд с поля не убирается и в следующей битве
      участвует как обычно. Как только Alek подтвердит или пересмотрит выбор —
      дописать в §8.3 одну фразу.
      Замечу и обратную улику: наша собственная карта «Стелс» написана
      формулировкой «как если бы их не было в регионе», то есть компонент стоит
      ближе к версии «для любых целей».
      2026-09-22, ЗАКРЫТО. Решение никуда не девалось: D-015 — правило постоянное
      и срабатывает само, без вопроса автору. Опровергнутой оказалась не оно,
      а моя оговорка «нас это не касается». Значит подтверждать было нечего —
      надо было дописать следствие в текст, что и сделано.
      §8.3: «Пока идёт эта битва, он не считается присутствующим в регионе —
      ни для каких целей. Где правило считает отряды в регионе, его не считают:
      он не мешает противнику отступить сюда (8.7) и не прикрывает пехотинца
      при захвате (7.3.7). Контроля фабрики это не касается: контроль обозначен
      самой фигуркой и от участия в битве не зависит.»
      Последняя фраза — наше чтение, а не цитата: вопрос FAQ был про подсчёт
      присутствия, а контроль фабрики подсчётом не является. Обратного в
      источниках нет, и наша карта «Стелс» («как если бы их не было в регионе»)
      этому не противоречит.
    decision_ref: D-015
    opened: 2026-09-10
    closed: null

  - id: TISS-001
    type: TERMINOLOGY
    category: [EFFECT]
    area: COMBAT
    batch: null
    title: "Разведение трёх терминов: результат боя, удаление и подавление"
    baseline_ref: BL-COMBAT-009
    redesign_ref: null
    original: >
      Три раздельных понятия: Kill — результат броска 6 в бою; Elimination —
      удаление отряда с поля любым иным способом; Pain — результат броска 4–5.
      Исход у Kill и Elimination одинаков, но десятки способностей срабатывают
      от Kill и не срабатывают от Elimination.
    redesign: >
      В черновике: Kill = «смерть», Elimination = «уничтожение», в одном месте —
      «ликвидировать», Pain = «отступление». При этом «уничтожить» используется
      и как обычный глагол: «уничтожьте до 4 ваших пехотинцев» (строка 650).
    difference: >
      Термин Elimination совпадает с обычным русским глаголом, поэтому граница
      между конкретным результатом и общим удалением с поля не держится.
      Термин Pain назван по своему последствию, из-за чего исчезает различие
      между «получить результат» и «отступить».
    severity: CRITICAL
    status: DECIDED
    proposal: >
      Kill → «смерть», Elimination → «уничтожение», Pain → «подавление»
      с применением через отступление.
    confidence: HIGH
    decision: >
      Принято по D-019, после трёх отменённых попыток (D-016 списание,
      D-017 ликвидация, D-018 гибель).
      Итог: смерть — результат броска 6; уничтожение — любое удаление с поля,
      включая смерть; подавление — результат броска 4–5, применяется отступлением.
      Отношение одностороннее, формула для глоссария: убитый отряд уничтожен,
      но не всякий уничтоженный убит.
      Ключевой вывод, ради которого стоило перебрать варианты: пара терминов
      обязана лежать в РАЗНЫХ смысловых полях, иначе вложенность не читается.
      «Смерть» и «уничтожение» это условие выполняют, а все синонимы уничтожения —
      гибель, ликвидация, устранение, списание — нет.
      Из черновика меняется только «отступление» на «подавление».
    decision_ref: D-019
    opened: 2026-09-10
    closed: null

