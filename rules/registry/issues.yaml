      За столом это решается доверием, а не текстом — а после обёртки трека
      умолчание становится выгодной стратегией: занизив свой запас, игрок может
      и уступить жетон первого игрока, и подтянуть себя правилом минимального запаса.
    severity: WARNING
    status: APPLIED
    proposal: >
      Одно предложение в §3.7 или §4.2: запас нефти — открытая информация, любой
      игрок вправе спросить точное число, и при обёрнутом треке владелец обязан
