    difference: >
      У Альянса 1 нефть и «Тексан» в игре, у остальных ноль. Остальные
      пропускаются по §7.1. Альянс обязан действовать и берёт «Оперативную
      паузу» за 0 — запас не меняется. Круг не пуст, значит фаза не кончается.
      Фазы получения ресурсов не наступает, значит нефть не появляется ни у
      кого, значит все остальные пропускаются вечно. Партия замораживается: ни
      проверки победы (§6.8), ни конца игры (§9.1). Единственный выход —
      Альянс добровольно обнулит запас, но он не обязан, а проигрывающий игрок
      имеет прямой мотив этого не делать.
    severity: ERROR
