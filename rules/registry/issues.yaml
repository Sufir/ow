  - id: RED-004
    type: PLAYTHROUGH
    category: [SEQUENCE, TIMING, LIMIT]
    area: COMBAT
    batch: P11
    title: "«Специальная операция» даёт бесконечную цепочку битв: три ограничения FAQ оригинала не перенесены"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по стыку 1 и 4 — действие вне своего хода, Североамериканский Альянс"
    assumption: >
      Читается по букве карты и §7.3.6: лимит «одна битва в регионе» привязан
      к СВОЕМУ ходу, а способность работает в чужой, поэтому лимит не
      срабатывает ни разу.
    original: >
      ЭКСПЛОЙТ НЕ ВОСПРОИЗВОДИТСЯ. «Специальная операция» — это Energy Nexus
      фракции Sleeper (factions.yaml, MAP-08, CONFIRMED/HIGH), и FAQ закрывает
      все три дыры отдельными ответами. (1) «Q. Can I do the Battle Action
      with Energy Nexus? — A. Yes… YOU CAN ONLY DO 2 TOTAL BATTLES IN A ROW
      (i.e., you cannot use Energy Nexus to "chain" Battles together into an
      infinite loop)». (2) «Q. What does it mean that an Action must ORIGINATE
      IN THE BATTLE AREA when using Energy Nexus? — A. It means that the
      Action, if tied to Map Areas, must begin in those Areas…». (3) «Q. If I
      have Energy Nexus and 0 Power, can I still do an Action that COSTS 0? —
      A. Yes! Using Energy Nexus does not require it to be your turn, so the
      rule that your turn is skipped when at 0 Power doesn't apply» — то есть
      при нуле открыты только действия стоимостью 0, а не любые бесплатно.
    redesign: >
      Технология «Специальная операция» (Североамериканский Альянс,
      Постоянное): «Непосредственно перед битвой (до начала тактической фазы)
      в регионе, где находится БРМ "Визард", вы можете выполнить одно
      действие, за его обычную стоимость (даже если это не ваш ход или у вас 0
      нефти). После выполнения, битва продолжается в обычном режиме». §7.3.6:
      «В одном регионе за свой ход вы можете начать только одну битву». §7.1:
      «Одно основное действие за ход»; «Ход при нулевом запасе пропускается».
    difference: >
      (1) Действием по «Специальной операции» выбирается Битва в том же
      регионе. У новой битвы тоже есть момент «непосредственно перед битвой»,
      «Визард» на месте, лимита частоты у способности нет — цепочка не
      обрывается ничем, кроме нефти. (2) Лимит §7.3.6 сформулирован через СВОЙ
      ход и в чужой ход не срабатывает; §7.1 по той же причине. (3) Карта
      противоречит сама себе: «за его обычную стоимость» и «даже если у вас 0
      нефти» вместе невыполнимы для действия ценой 1. Ни одно из трёх
      ограничений оригинала в книге и на карте не стоит.
    severity: ERROR
    status: APPLIED
    proposal: >
      Механика, решает Alek. Тронуть три места. §7.3.6 — переписать лимит
      через регион и битву, а не через ход («две битвы подряд в одном регионе
      — предел», перенос ответа FAQ). §7.8 или §3.9 — общее правило для
      способностей, дающих действие вне своего хода: действие обязано
      начинаться в названном способностью регионе, а оговорка «даже при
      нулевом запасе» открывает только действия стоимостью 0. §7.9 — там живёт
      родственное правило про второе действие, поставить рядом или связать
      ссылкой. Компонентный след (D-004): те же три ограничения внести в текст
      «Специальной операции» — карта не несёт ни одного.
    confidence: HIGH
    decision: >
      D-045: перенесены оба ограничения оригинала.
      §7.3.6: «Две битвы подряд — предел» — перенос ответа FAQ «you can only do
      2 total battles in a row (i.e., you cannot use Energy Nexus to chain Battles
      together into an infinite loop)».
      §7.8: способность, дающая действие вне вашего хода, подчиняется двум общим
      ограничениям — действие начинается в названном способностью регионе (из него
      можно, в него нельзя), а оговорка «даже при нулевом запасе» открывает только
      действия стоимостью 0.
      Компонентный след (D-004): те же ограничения внести в текст «Специальной
      операции». Карта не несёт ни одного и вдобавок противоречит сама себе:
      «за его обычную стоимость» против «даже если у вас 0 нефти».
    decision_ref: D-045
    opened: 2026-09-16
    closed: null

  - id: RED-005
    type: PLAYTHROUGH
    category: [EXCEPTION, LIMIT]
    area: TECH
    batch: P11
    title: "§3.9 защищает не те правила, которые D-042 считал безусловными: §3.4 и §8.7 маркеров не несут"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по стыку 2 — «текст способности побеждает общее правило» §3.9"
    assumption: >
      Читается буквально: §3.9 перечисляет ЗАКРЫТЫЙ список из трёх
      формулировок-маркеров, и правило без маркера способность перебивает.
    original: >
      ЭКСПЛОЙТА В ОРИГИНАЛЕ НЕТ, ПОТОМУ ЧТО НЕТ САМОГО ПРАВИЛА. Сквозного
      «текст способности побеждает книгу» в Cthulhu Wars не существует; это
      зафиксировано при внесении, в D-042: «И в оригинале такого сквозного
      правила нет вовсе — это наше обобщение». Оригинал вместо него пишет
      оговорки по месту и отвечает FAQ на каждый случай отдельно. Значит и
      риск наш, и чинить его нам.
    redesign: >
      §3.9: «Если текст способности расходится с общим правилом этой книги,
      действует текст способности… Но из правила, объявленного безусловным,
      исключений не бывает. Там, где книга пишет "никакая способность",
      "никогда", "ни для каких целей", способность его не перебивает». §3.4:
      «Резерв — жёсткий предел. Вы ограничены количеством фигурок: рекрутов у
      большинства фракций шесть, и седьмого взять неоткуда, если правило
      варианта прямо не говорит иное… сколько бы у вас ни было нефти и какие
      бы условия вы ни выполнили». §8.7: «Способность, распоряжающаяся чужим
      отступлением, подчиняется тем же ограничениям, включая запрет отступать
      к недавнему противнику».
    difference: >
      D-042 при внесении §3.9 назвал четыре безусловных места: §8.7, §3.4,
      §11.5 и §8.3. Маркер из списка §3.9 несут только два: §11.5 («никакой
      способностью») — да; §8.3 («ни один его боевой эффект не применяется») —
      спорно, формулы «ни один …не» в списке нет; §3.4 и §8.7 — нет вовсе.
      Хуже того, §3.4 содержит прямую оговорку «если правило варианта прямо не
      говорит иное», то есть сам объявляет, что исключения бывают. По букве
      §3.9 любая способность вида «поставьте рекрута» перебивает предел
      резерва и разрешает седьмого. Предел фигурок — единственное, что
      удерживает экономику игры.
    severity: ERROR
    status: APPLIED
    proposal: >
      Список маркеров снять, заменив его перечнем того, что защищено по
      существу: «Исключения не бывает там, где правило говорит о пределе
      компонентов (§3.4), о порядке применения результатов битвы (§8.5, §8.6),
      и там, где книга прямо пишет "никакая способность", "никогда", "ни для
      каких целей"». Затем сплошным поиском (D-036) пройти §3.4, §8.3, §8.5,
      §8.7, §11.5 и привести формулировки к одному виду.
    confidence: HIGH
    decision: >
      D-045: перечень безусловных правил в §3.9 переписан по существу, а не по
      словесным маркерам. Названы: предел фигурок (3.4), «одна фабрика в регионе»
      и «один пехотинец на фабрике» (3.6), порядок назначения и применения результатов
      битвы (8.5, 8.6), одна возможность оказать давление за фазу (6.3), плюс любое
      место со словами «никакая способность», «никогда», «ни для каких целей».
      §3.4 приведён к безусловной форме оригинала («you can never have more than
      6 Acolyte Cultists in play»).
      ИСПРАВЛЕНО В ТОТ ЖЕ ДЕНЬ. Первая редакция сняла оговорку «если правило
      варианта прямо не говорит иное» на ложном основании: «в Балансе сил
      берётся фигурка не из вашего резерва». Для ветки «игрок слишком слабый»
      это неверно, и оригинал говорит прямо противоположное: «simply add the gray
      acolyte to his pool. He now has a pool of 7 acolytes from which to recruit».
      Итог: §3.4 называет ДВА исключения — захваченный пехотинец и вариант
      «Баланс сил» (11.7), который сам меняет состав резерва. То же в статье
      глоссария «Резерв».
    decision_ref: D-045
    opened: 2026-09-16
    closed: null

