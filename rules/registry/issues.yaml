  - id: PLAY-006
    type: PLAYTHROUGH
    category: [CONDITION, EFFECT]
    area: ACTION
    batch: P10
    title: Бросок кубика вне битвы не описан, а символьные наклейки делают его невозможным
    baseline_ref: null
    redesign_ref: null
    step: "Раунд 1, ход 8 — уникальное действие «Бурение» Глобал Петролеум"
    assumption: >
      Пришлось догадаться, что «бросьте кубик» в тексте способности означает обычный
      числовой шестигранный кубик, а не боевой, и что наклейки на него клеить нельзя.
    original: >
      Не сверялось: в P10 оригинал не открывается.
    redesign: >
      Книга описывает кубик ровно один раз и только как боевой: §8.4 задаёт таблицу
      6 / 4–5 / 1–3, глоссарий даёт статью «Боевой кубик». §1.1: «Боевые кубики —
      20 шт., шестигранные. Плюс лист наклеек с символами результатов боя — по
      желанию». §8.4: «В комплект входит лист наклеек, превращающий обычные кубики
      в боевые: смерть на одной грани, подавление на двух, цифры 1, 2 и 3 на
      остальных трёх».
      При этом уникальное действие «Бурение» (Глобал Петролеум) сравнивает
      выпавшее число с количеством отрядов в регионе, а технология «Шантаж»
      (Эйркрафт Корпорейшн) отнимает у противников столько нефти, сколько выпало.
      Обоим нужен числовой результат от 1 до 6.
    difference: >
      Два дефекта сразу.
      (а) Правила не описывают бросок кубика вне битвы: не сказано, каким кубиком
      бросают, как читают результат и что делать при переброске. Игрок выводит это
      сам.
      (б) Наклейки заявлены как применимые ко всем двадцати кубикам, и после
      оклейки числовых граней остаётся три из шести (1, 2 и 3). Способности,
      требующие числа от 1 до 6, становятся невыполнимыми. Книга об этом
      не предупреждает и не говорит, что нужно оставить кубики без наклеек.
      D-040 разбирал состав листа наклеек, но не это следствие.
    severity: ERROR
    status: APPLIED
    proposal: >
      1. Ввести в §8.4 (или отдельным коротким абзацем в часть 1) общее правило:
         кубик шестигранный, и часть способностей просит бросить его ради числа,
         а не ради результата боя.
      2. Там же, в абзаце про наклейки, предупредить: оклеивать все кубики нельзя —
         часть способностей читает число, поэтому какое-то количество кубиков
         остаётся числовыми. Назвать это количество.
      3. Проверить при выверке компонентов, сколько способностей всех восьми
         фракций требуют числового броска (D-004).
    confidence: HIGH
    decision: >
      D-041, Alek: «не вижу проблемы — заведём один обычный не кастомный d6, можно
      отдать его в компоненты фракции».
      Внесено: в §1.1 добавлен компонент «Числовой кубик — 1 шт., шестигранный, без
      наклеек», в §8.4 — абзац «Числовой кубик»: часть способностей просит бросить
      кубик ради числа от 1 до 6, для них нужен обычный шестигранник, его наклейками
      не оклеивают.
      Тем самым закрыты оба дефекта находки: бросок вне битвы описан, и ловушка
      «оклеил все двадцать кубиков — способности на число стали невыполнимы» снята.
    decision_ref: D-041
    opened: 2026-09-15
    closed: null

