  - id: PLAY-008
    type: PLAYTHROUGH
    category: [SEQUENCE, TIMING]
    area: POWER
    batch: P10
    title: Порядок собственных эффектов внутри фазы получения ресурсов не задан
    baseline_ref: null
    redesign_ref: null
    step: "Раунд 2, фаза получения ресурсов — «Добыча» и «Боевое донесение» в одну фазу"
    assumption: >
      Пришлось решить, в каком порядке игрок применяет свои эффекты фазы ресурсов,
      когда порядок меняет результат.
    original: >
      Не сверялось: в P10 оригинал не открывается.
    redesign: >
      §4 задаёт два этапа фазы: все получают нефть, затем правило минимального
      запаса. §4.1 перечисляет источники и заканчивает пунктом «Проверьте свои
      уникальные способности и технологии, дающие нефть в эту фазу».
      Для фазы влияния такое правило есть и сформулировано прямо (§6.5: «Если
      у игрока в этот момент срабатывает несколько эффектов, порядок он выбирает
      сам, и выбор бывает значимым: один эффект способен лишить возможности
      применить другой», и дальше — порядок между игроками).
      Для фазы получения ресурсов ни того, ни другого нет.
    difference: >
      Порядок в фазе ресурсов значим, и это вылезло в первой же сыгранной фазе.
      Способность «Боевое донесение» (есть у семи фракций из восьми) разрешает
      в фазу получения ресурсов уничтожить полковника и получить 2 нефти. Полковник
      при этом — пехотинец, приносящий 1 нефть, и может быть единственным отрядом
      в регионе, за который платит другая способность («Добыча» Глобал Петролеум
      даёт нефть за регион с «Нефтяной вышкой», где есть хотя бы один ваш отряд).
      Применить донесение до подсчёта или после — разные числа.
      Отдельно не закрыт порядок между игроками: §4 говорит «фазу выполняют
      одновременно все», а чужой эффект способен изменить мою добычу.
    severity: WARNING
    status: APPLIED
    proposal: >
      Перенести формулировку §6.5 в §4 одним абзацем: если у игрока в фазу получения
      ресурсов срабатывает несколько эффектов, порядок он выбирает сам; если эффекты
      разных игроков спорят за один момент, первым применяет первый игрок и далее
