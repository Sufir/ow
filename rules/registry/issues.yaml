  - id: RED-001
    type: PLAYTHROUGH
    category: [NUMBER, EFFECT]
    area: COMBAT
    batch: P11
    title: "§8.4 умножает формульную боевую силу на число отрядов: 4 «Саранчи» дают 12 кубиков вместо трёх"
    baseline_ref: null
    redesign_ref: null
    step: "Атака по стыку 4 — формульная боевая сила §8.4, Глобал Петролеум"
    assumption: >
      Эксплойт воспроизводится по прямому чтению §8.4 и не требует никаких
      допущений: два предложения этого раздела («считается для каждого отряда
      отдельно» и «равна сумме боевых сил всех её отрядов») вместе дают
      умножение.
    original: >
      ЭКСПЛОЙТ НЕ ВОСПРОИЗВОДИТСЯ. Рулбук разбирает ровно эту пару отрядов
      числами в развёрнутом примере битвы (SRC-RB-NEW, с. 31): «Angela rolls
      her 3 dice (the amount she gets for having 4 remaining Undead in the
      Battle after Cthulhu Devoured one)». Четыре Undead — три кубика на
      группу, а не 4 x 3 = 12. Реестр фиксирует то же: combat_note у CW-F-02 —
      «кубиков на 1 меньше, чем всего Undead в битве (4 Undead -> 3 кубика)».
      Общее правило суммы (с. 23) покомпонентности не вводит, а FAQ по
      Chaugnar Faugn прямо решает соседний случай в обратную сторону: «you get
      the Combat bonus once per Area rather than once per Gate».
    redesign: >
      §8.4: «Боевая сила считается для каждого отряда отдельно. Три одинаковых
      отряда с формулой дают три её значения, а не одно на всех» и «Боевая
      сила фракции в битве равна сумме боевых сил всех её отрядов, участвующих
      в битве». Планшет Глобал Петролеум: ББМП «Саранча» — 4 шт., стоимость 1,
      сила «n − 1»; Моторизированный десантник — 2 шт., стоимость 2, сила «n +
      1».
    difference: >
      Четыре «Саранчи» (4 нефти) и два десантника (4 нефти) дают по нашей
      книге 4 x 3 + 2 x 3 = 18 кубиков, по оригиналу — 3 + 3 = 6. Разница
      втрое, и она квадратична: удвоение числа отрядов учетверяет силу. Для
      сравнения, C.R.A.B. Островной Империи стоит 10 нефти и бросает 6
      кубиков. Формулировка внесена решением D-042 по допущению из PLAY-005
      («пришлось решить, что формула считается для каждой "Саранчи"
      отдельно»); сверка велась по общему правилу суммы и не дошла до примера
      битвы.
    severity: CRITICAL
    status: APPLIED
    proposal: >
      Развести два вида формул. Формула, считающая сам отряд (сила = запас
      нефти противника, число вражеских боевых роботов), даёт своё значение
      каждому такому отряду. Формула, считающая число отрядов этого типа в
      битве, даёт ОДНО значение на всю группу. Перенести в текст пример
      оригинала числами. Сплошным поиском (D-036) тронуть: §8.4, §8.1 (абзац
      про формульную силу при объявлении битвы), §3.5 (последний абзац) и
      статью глоссария «Боевая сила». Компонентный след (D-004): на планшете
      Глобал Петролеум уточнить, считается n по региону или по битве — после
      «Стелса» это разные числа.
    confidence: HIGH
    decision: >
      D-045: правка внесена. §8.4 теперь различает два вида формул: считающая сам
      отряд даёт значение каждому такому отряду, считающая число отрядов в битве —
      одно значение на всю группу. Добавлен пример числами по образцу оригинала:
      четыре отряда с формулой «на один меньше, чем их в битве» дают 3 кубика.
      Сплошным поиском тронуты §8.1 и статья глоссария «Боевая сила».
      Формулировка «боевая сила считается для каждого отряда отдельно», внесённая
      вчера решением D-042, снята: она и создавала умножение.
      Компонентный след закрыт D-065 (2026-09-24): сноска планшета Глобал Петролеум — «n — число отрядов этого типа в битве. Сила — на всю группу.»
