      эффекты, а §8.9 покрывает любой способ. Сплошной поиск по §8.1, §8.3,
      §8.9, §7.3.6 и глоссарию (D-036).
    confidence: HIGH
    decision: >
      D-042: подтверждено оригиналом ровно в предположенном Alek виде. FAQ, прямо про наш случай: «Or if Sleeper simply Moves all of his units out of the Area? — …follow the same rule as to what happens when all Units of a side are removed during Pre-Battle. The Battle ends, no dice are rolled, and no abilities (including Pre-Battle!) can be used. The Power is paid to initiate the Battle, but no Battle actually takes place!»
      Причина в оригинале намеренно не перечисляется: «If all Units of one Faction are SOMEHOW removed during Pre-Battle». Наши §8.3 и §8.9 перечисляли два способа и тем сужали правило.
      §8.9 переписан через состояние: «если до бросков у одной из сторон не осталось в битве ни одного отряда — убраны с поля, исключены из битвы или уведены из региона». Добавлено, что пехотинец на фабрике — такой же отряд и присутствие даёт, а сама фабрика отрядом не является.
    decision_ref: D-042
    opened: 2026-09-16
    closed: null

