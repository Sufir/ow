# ISSUE LOG — единый реестр находок. Схема — SCHEMA.md.
# Ничего не чинится молча: любая находка сначала сюда.
# Правка текста правил допустима только после status: DECIDED со ссылкой на D-###
# (исключение — чисто языковая правка с severity: INFO).
#
# На этапе P2 сюда попадают только находки в самом оригинале. Сравнение
# с черновиком начнётся в P5.

issues:

  - id: DEV-001
    type: DEVIATION
    category: [CONDITION, EFFECT]
    area: MODULE
    batch: B8
    title: "Наёмный боевой робот: «уничтожен» вместо «погиб» расширяет условие"
    baseline_ref: BL-MODULE-013
    redesign_ref: null
    original: >
      «If your Independent Great Old One is KILLED, place its Loyalty Card,
      figure, unused tokens, and Spellbook back into the general Pool.»
      Условие — именно гибель, то есть результат броска 6 в бою.
    redesign: >
      Черновик, строка 626: «Если контролируемый вами наемный б/р УНИЧТОЖЕН,
      поместите его карту лояльности, фигурку, неиспользованные жетоны
      и технологию обратно в общий запас». Заголовок раздела в строке 625 —
      тоже «Уничтожение».
    difference: >
      Уничтожение шире гибели: оно включает любое удаление с поля, в том числе
      способностями и оплатой. В нашей формулировке наёмный боевой робот терял бы
      карту лояльности и технологию в случаях, когда по оригиналу не должен.
      Это меняет игровое поведение, а не только слова.
    severity: ERROR
    status: DECIDED
    proposal: >
      Заменить на «убит» и переименовать раздел в «Смерть». Условие должно
      читаться строго как результат броска 6.
      Перед правкой проверить в P5 сплошным поиском: не сформулированы ли через
      «уничтожение» другие условия, которые в оригинале завязаны на Kill. Это же
      расхождение могло повториться в приложениях, которые сверяются отдельно.
    confidence: HIGH
    decision: >
      Решение принято ещё в D-020 и подтверждено D-019, статус здесь просто
      не был проставлен — исправлено при сводке P5.
      Фиксируем: «уничтожен» меняется на «убит», заголовок раздела — на
      «Смерть». Условие читается строго как результат броска 6, по D-019.
      ПРОВЕРКА ВЫПОЛНЕНА 2026-09-10, сплошной поиск «уничтож*» по черновику:
      пять вхождений, других дефектов среди них нет.
        - строка 626 — это оно, единственная правка;
        - строка 650 «уничтожьте до 4 ваших пехотинцев» — корректный перевод
          «Eliminate up to 4 of your Cultists», термин на месте;
        - строки 820 и 826 — статьи глоссария, употребление верное.
      Расхождение единичное и в тексте правил больше не повторяется.
      Сплошная сверка фракций, карт и планшетов на терминологию — отдельная
      задача после правил (D-020).
    decision_ref: D-020
    opened: 2026-09-10
    closed: null

  - id: DEV-002
    type: DEVIATION
    category: [SEQUENCE, SETUP, NUMBER]
    area: ROUND
    batch: B1
    title: "Порядок фаз и стартовый запас сдвинуты — но результат эквивалентен"
    baseline_ref: BL-ROUND-001
    redesign_ref: null
    original: >
      Порядок фаз: действия, сбор Power, определение первого игрока, Doom.
      Игра начинается с фазы действий. Стартовый запас Power — 8, маркер ставится
      на 8 при подготовке.
    redesign: >
      Порядок фаз: получение ресурсов, определение первого игрока, влияние,
      действия. Стартовый запас нефти — 0 (строка 163). Фаза влияния
      пропускается в первом раунде (строки 196, 199).
    difference: >
      Цикл тот же самый, но вход в него сдвинут на одну позицию, а стартовый
      запас обнулён и заменён первым сбором ресурсов.
      ПРОВЕРКА НА ЭКВИВАЛЕНТНОСТЬ ПРОЙДЕНА. В первом раунде игрок по черновику
      получает 6 нефти за шесть пехотинцев и 2 за одну контролируемую фабрику,
      итого 8, — и входит в фазу действий ровно с теми же 8, что и в оригинале.
      Незанятых фабрик на старте нет, поэтому дополнительного дохода не возникает.
      Правило минимального запаса в первом раунде ни на что не влияет: у всех
      поровну. Пропуск фазы влияния в первом раунде убирает лишнее продвижение
      по треку, которого в оригинале на этом месте тоже нет.
    severity: INFO
    status: CLOSED
    proposal: >
      Ничего не менять. Перестройка сделана осознанно и воспроизводит оригинал
      точно.
    confidence: HIGH
    decision: >
      ПЕРЕОТКРЫТО И ЗАКРЫТО ЗАНОВО 2026-09-11 РЕШЕНИЕМ D-035.
      Первая редакция решения (см. ниже) ОТМЕНЕНА: проверка на эквивалентность
      была неполной. Считалась только арифметика 6 + 2 = 8 и не учитывалось,
      что §4.1 велит применять в фазу получения ресурсов фракционные
      способности добычи. Фракция с такой способностью входила в первую фазу
      действий БОЛЬШЕ чем с восемью нефтями, чего в оригинале нет, — значит
      перестройка не эквивалентна.
      АКТУАЛЬНОЕ СОСТОЯНИЕ (D-035): правила приведены максимально близко
      к оригиналу. Стартовые 8 нефти выдаются ПРИ ПОДГОТОВКЕ (§2.4 и §2.6),
      а ПЕРВЫЙ РАУНД СОСТОИТ ТОЛЬКО ИЗ ФАЗЫ ДЕЙСТВИЙ (§3.2) — первые три фазы
      в нём не играются. Последовательность сыгранных фаз получается ровно
      оригинальной, меняются только границы раундов: оригинал «действия →
      ресурсы → первый игрок → влияние | действия → …», у нас «действия |
      ресурсы → первый игрок → влияние → действия | …» — та же цепочка.
      Побочно снят абзац §5.1 про «в первом раунде запас у всех одинаков»:
      фаза в первом раунде просто не играется (см. RULE-007).
      ПЕРВАЯ РЕДАКЦИЯ, ОТМЕНЕНА (2026-09-10, без решения автора): «Признано
      эквивалентным. Записано отдельным issue не для правки, а чтобы при
      следующем проходе никто не открыл это заново как «критическое
      расхождение порядка фаз»: выглядит оно именно так, пока не сядешь
      считать.» Ровно это и произошло — и открыли правильно.
    decision_ref: D-035
    opened: 2026-09-10
    closed: 2026-09-11

  - id: DEV-003
    type: DEVIATION
    category: [TIMING, SEQUENCE]
    area: DOOM
    batch: B7
    title: "Особые события фазы влияния перенесены на конец фазы"
    baseline_ref: BL-RITUAL-003
    redesign_ref: null
    original: >
      Особые способности и события фазы Doom срабатывают, когда подходит очередь
      игрока проводить Ритуал Уничтожения, — независимо от того, проводит он
      Ритуал или нет. То есть они чередуются с Ритуалами по ходу очереди.
    redesign: >
      Черновик, строка 313: «Если не указано иное, то это происходит после того,
      как все игроки приняли решение об оказании давления, но перед определением
      победителя». Особые события вынесены отдельным третьим этапом фазы влияния,
      после всех Ритуалов.
    difference: >
      Тайминг разный. В оригинале способность игрока может сработать до того, как
      следующие игроки решат, проводить ли Ритуал, и повлиять на их решение —
      например, изменив стоимость или запас. В черновике все Ритуалы уже
      разыграны, когда способности начинают действовать.
      Правило разрешения споров при этом совпадает: первым ходит первый игрок,
      далее по кругу.
    severity: ERROR
    status: DECIDED
    proposal: >
      Вернуть оригинальный тайминг, четырёхэтапную подачу сохранить.
    confidence: HIGH
    decision: >
      Правим, приводим к оригиналу. Убирается фраза «после того, как все игроки
      приняли решение об оказании давления». Особые события срабатывают в очередь
      игрока на оказание давления, независимо от того, оказывает он давление
      или нет.
      Четырёхэтапную структуру фазы НЕ трогаем: карта-памятка из Ultimate Errata
      Pack сама перечисляет фазу влияния тремя пунктами, где особые события идут
      последним. Подача официальна, ломает механику только добавленная фраза.
      В P5 проверить, нет ли фракционных способностей, написанных в расчёте
      на изменённый тайминг.
    decision_ref: D-020
    opened: 2026-09-10
    closed: null

  - id: DEV-004
    type: DEVIATION
    category: [CONDITION]
    area: ROUND
    batch: B1
    title: "Первый игрок в начале партии: «всегда» заменено на «рекомендуется»"
    baseline_ref: BL-ROUND-002
    redesign_ref: null
    original: >
      «When Great Cthulhu is in play, that Faction's player IS ALWAYS the First
      Player at the start of the game.» Плюс отдельная оговорка: фракция
      Windwalker никогда не может быть первым игроком в начале партии.
    redesign: >
      Черновик, строка 241: «Если в текущей партии участвует Островная Империя,
      в начале игры РЕКОМЕНДУЕТСЯ первенство отдать игроку, выбравшему данную
      фракцию».
    difference: >
      Обязательное правило превращено в рекомендацию: must стало may.
      Кроме того, при беглом просмотре не найдена оговорка про фракцию, которая
      не может быть первым игроком в начале партии, — проверить в P4, есть ли
      она вообще.
    severity: ERROR
    status: DECIDED
    proposal: >
      Вернуть обязательность. Оговорку про Windwalker не переносить.
    confidence: HIGH
    decision: >
      «Рекомендуется» возвращается к «всегда»: если Островная Империя в игре,
      её игрок начинает партию первым.
      ПРОВЕРЕНО по требованию Alek, что правило не менялось: обе вёрстки рулбука
      дают одну формулировку «always the First Player at the start of the game»,
      а карта-памятка Ultimate Errata Pack описывает фазу определения первого
      игрока без оговорок. Ни эррата, ни дополнения его не трогали.
      Оговорка про фракцию, которая никогда не может быть первым игроком
      в начале партии, НЕ переносится: в оригинале это Windwalker, а у нас такой
      фракции нет. Если аналог появится — правило придётся вернуть.
    decision_ref: D-020
    opened: 2026-09-10
    closed: null

  - id: MISS-001
    type: MISSING
    category: [EFFECT, TIMING]
    area: UNIT
    batch: B5
    title: "Полностью отсутствует способность полковника «жертва ради нефти»"
    baseline_ref: BL-UNIT-012
    redesign_ref: null
    original: >
      Unspeakable Oath, постоянная способность High Priest: в конце действия
      ЛЮБОГО игрока, в том числе в чужой ход, вы можете убрать своего полковника
      в резерв и получить 2 Power. То же можно сделать в фазу сбора Power
      и в фазу Doom. Способность есть у обычных полковников и отсутствует
      у уникальных.
    redesign: >
      Раздел «Полковники» черновика (строки 585–592) описывает только вербовку,
      доход 1 нефть в фазу ресурсов, возможность строить и контролировать
      фабрики и возможность быть захваченным. Способности жертвы нет.
      Сплошной поиск по всем шести файлам редизайна: слов «жертва», «пожертв»
      нет ни разу.
    difference: >
      Правило отсутствует целиком. Это не терминология: пропала возможность
      реагировать в чужой ход, конвертировать полковника в 2 нефти в критический
      момент и уводить его из-под захвата. В оригинале это ключевая способность
      модуля — рулбук называет её «their key ability».
    severity: CRITICAL
    status: CLOSED
    proposal: >
      Проверить планшеты фракций до того, как дописывать текст правил.
    confidence: HIGH
    decision: >
      Потери нет, issue снят. Способность существует и называется «Боевое
      донесение», она пропечатана на планшете каждой фракции.
      В оригинале полковники были дополнением, поэтому на планшетах их не было
      и правило расписывалось в рулбуке. У нас они включены изначально, как и
      прочие свойства юнитов, — и в книге правил детально не расписываются.
      Механическую точность самой способности проверяем не здесь, а при выверке
      планшетов и фракций.
    decision_ref: D-021
    opened: 2026-09-10
    closed: 2026-09-10

  - id: MISS-002
    type: MISSING
    category: [COST, LIMIT]
    area: ACTION
    batch: B2
    title: "У задач, требующих действия, потеряны стоимость по умолчанию и лимит"
    baseline_ref: BL-ACTION-007
    redesign_ref: null
    original: >
      Действие по требованию книги заклинаний стоит Power только если это указано,
      иначе его стоимость 0. И: поскольку полученные книги не теряются, любое
      такое действие может быть выполнено только ОДИН РАЗ ЗА ПАРТИЮ.
    redesign: >
      Черновик, строки 508–509, описывает только то, что это отдельное основное
      действие. Ни стоимости по умолчанию, ни лимита «один раз за партию» нет.
      Сплошной поиск «один раз за игру / за партию» по всем файлам редизайна
      таких формулировок применительно к технологиям не находит.
    difference: >
      Потеряны два правила. Отсутствие лимита теоретически позволяет выполнять
      требование повторно; отсутствие стоимости по умолчанию оставляет вопрос
      открытым там, где на планшете цена не указана.
    severity: ERROR
    status: DECIDED
    proposal: >
      Дописать оба правила в раздел «Задачи, требующие выполнения действия».
      Формулировка лимита должна опираться на причину, как в оригинале:
      технология, однажды полученная, не теряется, поэтому и требование
      выполняется один раз за партию. Причина важна — она делает правило
      самоочевидным и снимает вопрос «а если условие перестало выполняться».
    confidence: HIGH
    decision: >
      Восстанавливаем по D-022: «все 16 находок типа MISSING подлежат
      восстановлению». Отдельного решения не требует, предложение принимается
      как есть. Статус проставлен при сводке P5.
    decision_ref: D-022
    opened: 2026-09-10
    closed: null

  - id: DEV-007
    type: DEVIATION
    category: [SETUP, SEQUENCE, EFFECT]
    area: MODULE
    batch: B8
    title: "Игра на двоих: реализован другой режим вместо оригинального"
    baseline_ref: BL-MODULE-001
    redesign_ref: null
    original: >
      Режим «один на один»: карта стороной на 3 игроков, трек Ритуала на 4
      игроков, маркер Распада из неиспользуемой фракции. Перед своим ходом игрок
      платит нефть по позиции маркера Распада; маркер растёт, когда у противника
      кончилась нефть. Добровольно обнулять запас нельзя. Doom за контроль фабрик
      в фазу Doom не начисляется, только через Ритуал. За убитый или уничтоженный
      отряд противник получает Doom, равный стоимости отряда. Неограниченная
      битва открывается обоим игрокам одновременно.
    redesign: >
      Черновик, строки 554 и 565, даёт два варианта: «Игра для двух игроков»,
      где каждый управляет двумя фракциями, и «Эпическая игра для двух игроков»,
      где каждый управляет тремя. Маркера Распада, штрафа за ход подряд, запрета
      обнулять запас, Doom за уничтоженные отряды и синхронного открытия
      неограниченной битвы нет.
    difference: >
      Это не расхождение в деталях, а другой режим. Оригинальный набор поправок
      отсутствует целиком; вместо него вариант «каждый водит несколько фракций»,
      которого в оригинале нет.
    severity: CRITICAL
    status: CLOSED
    proposal: >
      Перенести оригинальный режим, оставить свой или сделать оба.
    confidence: HIGH
    decision: >
      Ни один из трёх вариантов. Игра на двоих исключается из нашей версии
      целиком. Целевой состав — от 3 до 5 игроков, на 6–8 правила ведём.
      Что из этого следует:
      1) оригинальный режим «один на один» с маркером Распада в рулбук
         не переносится и выводится из объёма baseline;
      2) оба варианта черновика, где игрок водит две или три фракции
         (строки 554–575), из текста удаляются;
      3) в подготовке убирается «(или два)» из заголовка «Четыре (или два)
         игрока» (строка 127);
      4) в глоссарии убирается оговорка про игру на двоих из статьи «Противник»
         (строка 817).
    decision_ref: D-021
    opened: 2026-09-10
    closed: 2026-09-10

  - id: TISS-002
    type: TERMINOLOGY
    category: [OTHER]
    area: MAP
    batch: B1
    title: "«Запас» означает и резерв фигурок, и запас нефти"
    baseline_ref: BL-MAP-002
    redesign_ref: RD-SETUP-005
    original: >
      Pool — место, где лежат неиспользуемые фигурки и книги заклинаний.
      Power Track — отдельная сущность, отслеживающая ресурс.
    redesign: >
      «Поместите рядом с планшетом свои технологии и фигурки — это ваш запас»
      (строка 171) и «трек запаса нефти» (строка 227). Одно слово на два разных
      понятия. Плюс в строке 308 то же место названо «резервом».
    difference: >
      Терминологическая, не механическая. Но в правилах, где часто встречается
      «вернуть в запас», двусмысленность мешает: неясно, идёт речь о фигурках
      или о ресурсе.
    severity: WARNING
    status: DECIDED
    proposal: >
      Отряды и технологии лежат в РЕЗЕРВЕ фракции. Нефть отслеживается на ТРЕКЕ
