      То есть носитель значения — карта, а не планшет. На карточках Глобал Петролеум сказано, ЧТО сделать в регионе с символом; ГДЕ этот регион — должно быть на поле. На нашем поле символов нет ни на одной стороне (проверено по обеим).
      Цена вопроса не в Глобал Петролеум. У Братства Сингулярности от символов зависят ЧЕТЫРЕ задачи из шести и блок «Общины» на планшете: по одной общине в регионе с каждым из трёх символов и одна в регионе без них. Без символов Братство ставит одну общину вместо четырёх, получает максимум три технологии из шести и не может выиграть в принципе — §9.4 требует все шесть.
      Выбор за Alek:
      1. Нанести символы на поле — тогда в §1.4 нужен один абзац о том, что это за разметка. Вопрос «сколько регионов несёт каждый символ» решается аудитом карты.
      2. Переписать четыре задачи Братства и блок «Общины» без опоры на символы (правка компонентов, D-004) — тогда книгу трогать не нужно, но надо решить, что делать с тремя задачами Глобал Петролеум.
      Правка книги в любом случае невелика; решение о носителе — за автором. PLAY-002 и решение D-041 по нему этим снимаются: обоснование «символы нужны только Глобал Петролеум и расписаны у неё на планшете» на проверке не подтвердилось.
      РЕШЕНИЕ ALEK 2026-09-16: «безусловно символы будем отрисовывать на поле,
      никакие другие варианты никогда не рассматривались». Выбора не было —
      его придумал я, и это ошибка формулировки вопроса: вместо «что делаем»
      надо было спросить «где они стоят».
      ПЕРЕПРОВЕРКА ПО ДОКУМЕНТАМ И РЕЕСТРАМ (не по картинкам). Размещения
      символов действительно нет нигде: board/glyphs.yaml описывает
      стартовые глифы фракций и ориентиры, SPEC-BOARD §8 знает один знак —
      метку Глобал Петролеум в Европе, regions.yaml поля под символы не имеет.
      Сами символы при этом готовы: ICON-032, ICON-033 и ICON-034 в icons.yaml,
      глифы Q, W и E в шрифте print/Fonts/Oil Wars.ttf, статус OK.
      СТОРОНА ПРАВИЛ ЗАКРЫТА. В §1.4 добавлен абзац: часть регионов несёт
      символ, символов три, сам по себе символ ничего не делает, значение задаёт
      карта задачи, регионы без символов тоже есть. Больше книге про них знать
      нечего — сколько регионов несёт каждый символ, это компонент.
      СТОРОНА КАРТЫ ОТКРЫТА: заведено MF-011 в board/findings.yaml
      и строка 2 в SPEC-BOARD §11. Там же записано, откуда брать позиции:
      в оригинале это три Spellbook Glyph фракции Yellow Sign, напечатанные
      на карте Земли (SRC-RB-NEW, с. 64: «one of Yellow Sign's three Spellbook
      Glyphs»). Проверить при размещении, что на каждой из четырёх раскладок
      есть все три символа и хотя бы один регион без символа, — иначе четвёртая
      задача Братства невыполнима.
      ПЛАНШЕТ (D-072, 2026-09-24): пункты 2–5 блока «Общины» переписаны без
      разночтения, которое и породило чтение «одна община за игру»: «Не больше
      одной общины на все регионы с символом {Q}» (так же {W}, {E} и «без
      символов»). Сторона компонента закрыта; сторона поля — MF-011.
    decision_ref: D-043
    opened: 2026-09-16
    closed: null

