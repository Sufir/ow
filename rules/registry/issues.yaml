  # === P7, разбор иконок ==============================================
  # Идентификаторы ICON-1xx намеренно не пересекаются с ICON-0xx
  # из icons.yaml: устав §9 допускает совпадение префиксов между
  # реестрами, но валидатор на такие пары выдаёт предупреждение,
  # а держать реестры без предупреждений дешевле, чем объяснять их.

  - id: ICON-101
    type: ICON
    category: [OTHER]
    area: GLOSSARY
    batch: null
    title: "Иконочного набора у проекта нет — весь текст правил пишется плейсхолдерами"
    baseline_ref: null
    redesign_ref: null
    original: >
      Оригинал использует сквозной иконочный набор: Power, Doom, Elder Sign,
      Gate, типы отрядов, результаты боя. Иконка стоит вместо слова в каждой
      строке стоимости и в каждом описании способности.
    redesign: >
      Кастомный шрифт проекта `print/Fonts/Oil Wars.ttf` содержит
      11 значащих глифов: E, Q, W и цифры 1–8. Из них три — символы ресурса
      на карте (вагонетка, капля, пламя), восемь — логотипы восьми фракций.
      Ни одной иконки под нефть, влияние, фабрику, отряд, кубик или результат
      боя в шрифте нет. На жетонах вместо иконок стоят emoji (📡) и системные
      геометрические знаки (▣ ▲ ◆ ★ ✚ ⬟ ⬢ ◎ ✖ ✦).
    difference: >
      Иконочный набор придётся разрабатывать с нуля. До тех пор текст правил
      физически не может ссылаться на глифы.
    severity: WARNING
    status: DECIDED
    proposal: >
      P8 пишется плейсхолдерами {ICON_NAME} по реестру icons.yaml, 31 иконка
      в части A. Emoji не подставляются нигде, включая символы состояния
      ⏳ ✏️ ✅ 🖨️ из раздела компонентов черновика — они разметка автора,
      а не содержание, и в книгу не идут.
      Разработка самого набора — задача компонентов (D-004), не правил.
    confidence: HIGH
    decision: >
      Решение D-029. Недостающие 31 иконка рисуются и добавляются
      В КАСТОМНЫЙ ШРИФТ проекта, а не в виде картинок: так их можно набирать
      в любом редакторе и подставлять прямо в строку при сборке PDF.
      Это отдельная подзадача, идёт после правил вместе с выверкой
      компонентов (D-004), и текст не блокирует: P8 пишется плейсхолдерами,
      подстановка глифов — механическая замена на финальной сборке.
      Обе находки правила «один глиф = одно значение» разобраны и сняты
      автором: ICON-043 помечает связанные компоненты сети Роя намеренно
      и значение несёт одно; ICON-044 различает особые фабрики в первую
      очередь цветом, жетоны напечатаны, не меняем.
      Взамен CODE-04 нашёл настоящее нарушение того же правила, с обратной
      стороны: в шрифте лежат три лишние копии E/Q/W под строчными кодовыми
      точками с идентичными контурами — одно изображение набирается двумя
      символами. Плюс descender −54 вместо −200. Чинить при пересборке
      шрифта, записано в D-029.
      Опознание восьми цифровых глифов закрыто той же задачей CODE-04:
      это логотипы восьми фракций, сличение силуэтов с `art/logos/` даёт
      IoU 0.90–0.99.
    decision_ref: D-029
    opened: 2026-09-10
    closed: null

