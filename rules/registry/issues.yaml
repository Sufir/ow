    severity: ERROR
    status: CLOSED
    proposal: >
      Вопрос Alek: решение выбирает НОСИТЕЛЬ. Оригинал печатает правила Луны в
      разделе фракции; разделов фракций у нас нет (D-004), свойства фракций
      живут на планшетах (D-021), но Луна — не свойство юнита, а РЕГИОН
      игрового поля, и §1.4 о ней молчать не может. Два варианта: (1) абзац в
      §1.4 и строка в §1.1 — «отдельные фракции приносят на стол собственный
      регион; как он связан с полем, написано на их планшете», сами правила
      Луны на планшет; (2) отдельный подраздел части 11 по образцу §11.5 и
      §11.6. В обоих случаях планшет Moon Systems придётся переверстать: там
      напечатан блок «Общины» Братства вместо блока про Луну (FAC-002), а
      стартовая расстановка скопирована общая (FAC-010).
    confidence: HIGH
    decision: >
      D-049, решение Alek: «У нас все фракционные особенности печатаются на планшете
      фракции и её компонентах. Это лучше, чем разделы в правилах, которые нужно
      искать — планшет и компоненты всегда перед глазами».
      Значит правила Луны целиком уходят на планшет Moon Systems, отдельного раздела
      в книге не будет.
      В книге осталась только зацепка, без которой такой планшет нелегален: §3.3
      говорит, что отдельные фракции приносят на стол собственный регион, он лежит
      рядом с планшетом и для всех правил считается таким же регионом поля,
      а особенности описаны на планшете. Три строки, никакой фракционной конкретики
      (D-021).
      Остальное уже работает: §3.6 после D-042 знает фабрику, которую нельзя взять под
      контроль, — «так бывает устроен отряд или тайл; где это так, сказано на планшете
      фракции», и она всегда считается контролируемой владельцем. Луна под это
      определение подходит целиком.
      КОМПОНЕНТНАЯ ЧАСТЬ, БЛОКЕР ПЕЧАТИ ПЛАНШЕТА (D-004). На планшет Moon Systems
      обязано попасть, дословно по оригиналу (SRC-RB-NEW, с. 75):
      стартовая расстановка — шесть андроидов на Луне;
      Луна считается сухопутным регионом с фабрикой Moon Systems под контролем для
      любых целей, и контроль над ней не отбирается;
      другую фабрику туда не построить и не переместить;
      отряды Moon Systems свободно перемещаются и отступают между Луной и любым
      регионом поля;
      отряды других фракций могут уйти с Луны перемещением или отступлением, но попасть
      на неё так не могут.
      Плюс FAC-002 (на планшете напечатан блок «Общины» Братства вместо блока про Луну)
      и FAC-010. Отдельная находка: в оригинале все кошки дают по 1 Power в фазу
      ресурсов, а наши андроиды нефти не дают.
      КОМПОНЕНТНАЯ ЧАСТЬ ИСПОЛНЕНА 2026-09-24 (D-052): правила Луны, старт на Луне и
      блок создания «Зардоза» напечатаны на планшете Moon Systems
      (print/Faction-Card-A/Данные/Moon Systems.json). Находка про нефть с андроидов
      оказалась ложной: «Альтернативные источники энергии» дают 1 нефть за каждую
      боевую машину в игре, андроиды — боевые машины; это 1:1 с кошками оригинала.
    decision_ref: D-049
    opened: 2026-09-16
    closed: 2026-09-24

