      с контролируемой фабрики... чтобы переместить пехотинца с фабрики, вы сначала
      покидаете фабрику свободным действием, а потом выполняете перемещение».
      §8.7 отдельно оговаривает исключение для битвы: «Пехотинец, который стоял
      на фабрике, при отступлении её покидает... Свободное действие для этого
