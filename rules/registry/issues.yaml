      полуостров», а эти два региона не встречаются на одной стороне).
      Список на четверых оговорён: Аравийский полуостров и Западная Африка доступны
      только на той половине поля, что лежит стороной «5».
      §11.6: примеры размещения Узла управления и Зон сети помечены как данные
      по раскладке на пятерых; пример с Антарктидой отмечен как годный на любой.
      Списки для 6–8 не дописываются (D-040 п. 6), и раз состав 6–8 в комплект
      не входит (1.4), отдельной оговорки в §11.5 не требуется.
      ВТОРАЯ РЕДАКЦИЯ, в тот же день. Первая правка чинила списки поимённо
      и оставляла в них стартовые регионы: Азию на троих (старт Эйркрафт
      Корпорейшн), Европу и Западную Африку на четверых и пятерых. То есть
      книга рекомендовала ровно то, что сама запрещает пунктом 1. Половина
      сверки была сделана (существует ли регион на раскладке), вторая
      (не стартовый ли он) — нет.
      Поимённые списки из §11.5 УБРАНЫ целиком и заменены качественными
      соображениями: Лаборатория в середине карты переходит из рук в руки,
      на отшибе стоит спокойнее; при мобильных фракциях берите дальше от центра;
      чем меньше игроков, тем меньше выбор. Пункт 1 остаётся единственным
      связывающим правилом. То же в §11.6: поимённые примеры Узла и Зон сети
      заменены описанием двух схем — компактной у края и разнесённой к центру.
      Причина именно такого решения, а не починки списков: по карте идёт
      отдельный аудит, который соберёт состав регионов и стартовые позиции
      по всем раскладкам. Пока его данных нет, поимённый список в книге —
      обязательство, которое нечем проверить. Вернуть списки можно будет
      по итогам аудита, если они окажутся полезны.
      Статус DECIDED, а не APPLIED: правка книги внесена, но вопрос закрывается
      вместе с аудитом карты.
    decision_ref: D-041
    opened: 2026-09-15
    closed: null

