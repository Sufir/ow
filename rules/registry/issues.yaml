      противников её физически не хватает.
    redesign: >
      Технология «Шантаж» (Эйркрафт Корпорейшн, Действие. Стоимость: 0): «Раз
      в раунд. Если "Спрут" в игре, бросьте кубик. Ваши противники вместе
      теряют столько нефти, сколько выпало на кубике. У них минута, чтобы
      решить, сколько отдаст каждый из них. Если они не смогут прийти к
      согласию, то вы получаете выпавшее число нефти».
    difference: >
      Противники сравнивают два исхода: договориться — потерять d6 нефти на
      всех; не договориться — не потерять ничего, а Эйркрафт получит d6.
      Второй строго лучше для каждого из них, потому что их запас не
      уменьшается. Рациональные противники не договариваются никогда, и эффект
      карты вырождается в «раз в раунд получите d6 нефти действием стоимостью
      0» — около 3,5 нефти за раунд даром. Переговорная механика, ради которой
      карта написана, не запускается ни разу.
    severity: WARNING
    status: APPLIED
    proposal: >
      Механика, решает Alek. Правка на карте (D-004), но само правило
      разрешения споров уместно поднять в книгу: тот же приём стоит и на
      «Заражении» Клонэйд Ресёрч. Одна формулировка в §3.9 или отдельным
      абзацем части 3: «Если способность велит противникам распределить потерю
      между собой и они не договорились за минуту, распределяет применивший
      способность; игрок, которому нечем платить, в переговорах не участвует».
      Это перенос ответа FAQ и текста оригинальной карты Ghroth («If time runs
      out, you choose for them»).
    confidence: HIGH
    decision: >
      D-045: общее правило внесено в §3.9 — «Если способность велит противникам
      распределить потерю между собой, они договариваются сами, и у них на это минута.
      Не договорились — распределяет применивший способность. Игрок, которому нечем
      платить, в переговорах не участвует, и его согласия не требуется».
      Это формула оригинала: «They have 1 minute to decide how to distribute these
      Eliminations. If time runs out, you choose for them».
      Компонентная часть (D-004): «Шантаж» говорит «если они не смогут прийти
      к согласию, вы получаете выпавшее число нефти» — другая механика, и она делает
      несогласие всегда выгодным. Привести к общей формуле; наша же карта Клонэйд
      с тем же механизмом написана правильно, две карты одного механизма разошлись.
    decision_ref: D-045
    opened: 2026-09-16
    closed: null

