      «1 нефть за каждую незанятую военную фабрику на поле. Эту нефть получает
      КАЖДЫЙ игрок за каждую незанятую фабрику, где бы она ни стояла».
      §6.2: маркер продвигается на число фабрик под контролем; «незанятые
      фабрики влияния не дают».
      Планшет Сайнтифик Солюшн, «Мобильная военная фабрика»: «"Шрёдингер"
      считается фабрикой для любых целей, кроме способности "Пространственный
      сдвиг". Не берётся под контроль пехотинцами и может находиться в регионах
      с другими фабриками».
    difference: >
      Состояний у фабрики по §3.6 два, и они заданы через наличие пехотинца
      сверху. «Шрёдингер» пехотинца не принимает НИКОГДА, значит по букве он
      всегда незанятая фабрика — и тогда приносит по 1 нефти КАЖДОМУ противнику
      Сайнтифик Солюшн каждый раунд, а самой ей не даёт ни нефти, ни влияния.
