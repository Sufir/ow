  - id: PLAY-010
    type: PLAYTHROUGH
    category: [TIMING, SEQUENCE]
    area: ACTION
    batch: P10
    title: Не сказано, когда проверяется окончание фазы действий и что если нефть вернулась
    baseline_ref: null
    redesign_ref: null
    step: "Раунд 1, круг 5 — у всех ноль, но у игрока на поле полковник"
    assumption: >
      Пришлось решить, что фаза действий заканчивается сразу, как только у всех
      оказался ноль, и что обходить круг заново, проверяя, не появилась ли у кого-то
      нефть, не нужно.
    original: >
      Не сверялось: в P10 оригинал не открывается.
    redesign: >
      §7.1: «Фаза продолжается, пока у игроков остаётся нефть, и заканчивается,
      когда её не осталось ни у кого». Момент проверки не назван.
      §7.1 же: «Ход при нулевом запасе пропускается... Но если игрок с нулевым
      запасом получит нефть от способности или технологии, в свой ход он обязан
      действовать как обычно».
      §7.8: способность вида «после действия любого игрока» применяется и в чужой
      ход. «Боевое донесение» — ровно такая: «В конце действия любого игрока
      (даже если это не ваш ход) или в фазе получения ресурсов уничтожьте полковника
      и получите 2 нефти». Она есть на планшете семи фракций из восьми.
    difference: >
      Дыра в два шага. Последний игрок с нефтью совершает действие и обнуляется.
      В конце этого действия любой другой игрок вправе применить «Боевое донесение»
      и получить 2 нефти — то есть условие «ни у кого не осталось нефти» перестаёт
      выполняться в тот самый момент, когда оно выполнилось.
      Книга не отвечает, продолжается ли фаза и надо ли обойти полный круг пропусков,
      прежде чем объявить её законченной. Ответ меняет длину раунда, а вместе с ней
      и число ходов у каждого.
      Правило, из которого ответ выводится, в тексте есть (§7.1 про возврат нефти
      способностью), но лежит абзацем выше и в другом контексте — это случай
      «правило есть, но за столом его не вспомнят».
    severity: WARNING
    status: APPLIED
    proposal: >
      Дописать в §7.1 процедуру окончания: фаза заканчивается, когда круг обошёл
      всех и ни один игрок не смог совершить действие; если в это время кто-то
      получил нефть, круг продолжается. Формулировка должна прямо ссылаться
      на уже стоящее рядом правило о возврате нефти способностью.
    confidence: HIGH
    decision: >
      D-042: внесено в §7.1. Фаза заканчивается, когда полный круг прошёл впустую; получивший нефть по ходу круга обязан действовать, и круг продолжается.
    decision_ref: D-042
    opened: 2026-09-15
    closed: null

  - id: PLAY-011
    type: PLAYTHROUGH
    category: [VICTORY, NUMBER]
    area: VICTORY
    batch: P10
    title: Влияние выше 30 некуда отмечать и двух лидеров нечем сравнить
    baseline_ref: null
    redesign_ref: null
    step: "Пограничный случай Б8 — 30 влияния без шести технологий"
    assumption: >
      Пришлось придумать, куда ставить маркер при 32 влияния, и признать, что
      сравнить двух игроков, упёршихся в конец трека, книга не позволяет.
    original: >
      Не сверялось: в P10 оригинал не открывается.
    redesign: >
      §3.8: «Влияние — победные очки. Отмечается маркером фракции на общем треке
      влияния, от 0 до 30». §1.1: «Трек влияния — 1 шт.».
      §6.8 и §9.1: игра заканчивается, если «какой-нибудь игрок набрал 30 или больше
      влияния». §9.4: «Побеждает игрок, у которого одновременно наибольшее влияние
      и все шесть карт технологий», и ничья — когда «наибольшее влияние среди
      имеющих все шесть технологий одинаково у двоих или более».
      Для нефти аналогичная проблема решена явно: §4.2 задаёт обёртку трека.
    difference: >
      Три следствия одного пробела.
      (а) Куда ставить маркер при влиянии больше 30, не сказано; правила обёртки,
      как у нефти, нет.
      (б) §9.4 требует сравнить «наибольшее влияние», а двое, упёршихся в конец
      трека, неразличимы — и именно в конце партии, когда все раскрывают карты
      скрытого влияния, это наиболее вероятный исход.
      (в) Нераскрытые карты скрытого влияния почти гарантируют перелёт за 30,
      потому что раскрываются они пачкой (§9.3).
      Правило §9.4 при этом само по себе работает безупречно: игрок без шести
      технологий в сравнении не участвует вовсе, это проверено в партии.
      Ломается именно отсчёт влияния.
    severity: ERROR
    status: APPLIED
    proposal: >
      Два варианта, выбор за автором.
      1. Обёртка по образцу §4.2: влияние выше 30 отмечается вторым маркером
         или оборотом трека, и сравнение идёт по реальному числу.
      2. Считать влияние выше 30 по записи: маркер стоит на 30, избыток игроки
         фиксируют на бумаге или картами.
      В обоих случаях §3.8 должно перестать утверждать «от 0 до 30» как предел,
      ровно как §3.7 уже не утверждает этого про нефть. Отмечено в STATE.md как
      ждущее автора, но в реестр до сих пор заведено не было.
    confidence: HIGH
    decision: >
      D-041, Alek: «влияние выше 30 есть куда отмечать, у нас трек до 44 сейчас».
      Внесено в §3.8: снято «от 0 до 30» как предел, добавлен абзац — тридцать это
      порог окончания партии, а не потолок счёта; трек размечен дальше; влияние выше
      тридцати считается и сравнивается как обычное, по нему и определяется победитель
      (9.4).
      Конкретное число 44 в книгу НЕ вписано намеренно: трек влияния как компонент
      в проекте пока не найден, и если разметка изменится, менять придётся текст.
      Когда компонент будет собран — решить, называть ли предел числом.
      Третья часть находки (нераскрытые карты почти гарантируют перелёт за 30) — это
      не дефект, а описание нормального конца партии; после правки он корректно
      обрабатывается.
    decision_ref: D-041
    opened: 2026-09-15
    closed: null

