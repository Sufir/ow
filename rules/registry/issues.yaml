    confidence: HIGH
    decision: >
      Принято предложение. Трёхфазная подача сохраняется — тактическая
      подготовка, сражение, финал, — потому что термины «тактический эффект»
      и «финальный эффект» уже напечатаны на картах технологий и полковниках.
      Внутри финальной фазы явно выделяются два такта:
        такт 1 — назначение. Сначала назначаются смерти и уничтожения
          (одновременно), затем подавления. В этот момент работают финальные
          эффекты, меняющие и сами результаты, и порядок их назначения.
