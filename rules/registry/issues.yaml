      а не один раз на всю группу. Книга формул у боевых машин не предполагает вовсе.
    original: >
      Не сверялось: в P10 оригинал не открывается.
    redesign: >
      §8.4: «У каждого отряда есть боевая сила, указанная на планшете фракции или
      на карте лояльности... Большинство пехотинцев и боевых машин имеют силу от 0
