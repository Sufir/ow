  - id: RULE-007
    type: AMBIGUITY
    category: [SEQUENCE, SETUP]
    area: ROUND
    batch: B1
    title: "Первый игрок в первом раунде: перестановка фаз создала пробел"
    baseline_ref: BL-ROUND-004
    redesign_ref: RD-ROUND-003
    original: >
      В оригинале порядок фаз — действия, сбор Power, определение первого
      игрока, Doom. Поэтому первый игрок, назначенный при подготовке,
      гарантированно ведёт первую фазу действий, а фаза определения первого
      игрока впервые случается только после неё. Ситуации «определяем
      первого игрока, когда запас у всех равен» в оригинале не возникает
      вовсе.
    redesign: >
      Наш порядок фаз — ресурсы, определение первого игрока, влияние,
      действия (DEV-002, признано эквивалентным). Из-за этого в первом
      раунде фаза определения первого игрока наступает ДО первой фазы
      действий, и к этому моменту у всех игроков ровно по 8 нефти:
      претендуют все сразу.
      Черновик обходит вопрос формулировкой «в последующих раундах, жетон
      первого игрока переходит к игроку, который имеет наибольший запас
      нефти» (строка 244) — то есть первый раунд из правила просто
      исключён, а что делать в нём, не сказано.
    difference: >
      Пробел, созданный нашей перестановкой фаз, а не потеря из оригинала.
      Общее правило равенства ответ даёт: решает игрок, у которого жетон был
      в предыдущем раунде, и он может выбрать себя. Но в первом раунде
      «предыдущего раунда» нет, и кто именно решает — не названо.
      Побочный эффект, которого в оригинале нет: по букве общего правила
      первый игрок, назначенный при подготовке, может передать жетон
      другому. В оригинале он ведёт первый раунд безусловно.
    severity: WARNING
    status: CLOSED
    proposal: >
      Назвать, кто решает: игрок, получивший жетон при подготовке.
    confidence: HIGH
    decision: >
      ЗАКРЫТО 2026-09-11. Итоговое состояние задано цепочкой D-030 → D-031 →
      D-035, актуальное решение — D-035. Текст книги сверен 2026-09-15
      и соответствует ему.
      АКТУАЛЬНО. Пробела больше нет, и закрыт он не формулировкой, а тем, что
      фазы в первом раунде не стало. D-035: стартовые 8 нефти выдаются при
      подготовке, первый раунд состоит только из фазы действий (§3.2), первые
      три фазы в нём не играются. D-031: правила первого игрока перенесены как
      в оригинале — Островная Империя в партии, её игрок первый всегда; её нет,
      определяют любым удобным способом (рекомендация — по алфавиту названий
      фракций); число «Очередь» задаёт только порядок расстановки и на
      первенство не влияет.
      Текст §5.1 сейчас: «В первом раунде эта фаза не играется: первый игрок
      определён при подготовке (2.5), и первый раунд он ведёт безусловно.
      Впервые фаза отрабатывает во втором раунде.» Расхождение с оригиналом
      снято полностью: права передать жетон в первом раунде нет, потому что
      выбирать некому и негде.
      ВТОРАЯ РЕДАКЦИЯ, ОТМЕНЕНА В ЧАСТИ ОБОСНОВАНИЯ (D-030, 2026-09-10): «Alek:
      держимся оригинала, первый раунд ведёт игрок, определённый при подготовке,
      безусловно. Права передать жетон у него нет. Текст 5.1: „В первом раунде
      запас нефти у всех одинаков, поэтому эта фаза ничего не меняет: жетон
      остаётся у игрока, определённого при подготовке (2.5). Первый раунд он
      ведёт безусловно.“» Вывод устоял, обоснование — нет: D-031 отменило D-030
