      Именной запрет мы перенесли, слово «different» — нет.
    redesign: >
      §7.9: «Вторым действием годится общее, уникальное или по требованию
      задачи — если в самой способности не сказано иначе» и «ПОВТОРИТЬ ТО ЖЕ
      САМОЕ ДЕЙСТВИЕ МОЖНО, если способность прямо этого не запрещает».
      Технология «Вторжение» (Глобал Петролеум), действие стоимостью 1:
      «Переместите "Чёрный вихрь" в любой регион, где есть пехотинец любой
