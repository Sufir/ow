# FACTION REGISTRY — реестр фракций: оригинал Cthulhu Wars ↔ редизайн «Нефтяные войны».
#
# Заведён 2026-09-11. Схема — SCHEMA.md, раздел «factions.yaml».
#
# ВАЖНО ПРО ОБЪЁМ. Этот реестр НЕ входит в задачу аудита правил (P0–P12): по
# `RULES-CHARTER.md` фракции, компоненты, карты и жетоны из неё исключены. Он лежит
# здесь только потому, что здесь живут все машиночитаемые реестры проекта. Валидатор
# `rules/tools/registry.py` его пока не проверяет и в `registry.db` не собирает.
#
# Соответствие построено ПО СВОЙСТВАМ, не по названиям: количества отрядов по
# категориям, стоимости, боевые значения, формула силы боевого робота, уникальные
# механики и компоненты. Названия использованы только как дополнительный признак.
#
# Источники (см. sources.yaml, где заведены; локальные пути — от rules/):
#   SRC-RB-NEW   — sources/cthulhu-wars/SRC-RB-NEW__cw-rulebook-new-layout__2026-09-10.md
#   SRC-DRAFT    — sources/gdocs/SRC-DRAFT__rules-draft__2026-09-10.md
#   SRC-APP-MERC — sources/gdocs/SRC-APP-MERC__mercenaries__2026-09-10.md
#   FC-<фракция> — print/Saved/Faction Card — <фракция>.pdf  (эталон состава по CLAUDE.md §2)
#   JSON-<фракция> — print/Saved/<фракция>.json (состояние планшета; МОЖЕТ БЫТЬ УСТАРЕВШИМ)
#   TECH-JSON    — print/Saved/Cards - Технологии и задачи.json

