        note: >
          Не действует, пока маркер трека Ritual не дойдёт до первой «7»; тогда
          карта переворачивается. Torment (Ongoing): убивая или уничтожая
          вражеские отряды (кроме захвата), вместо этого противник теряет Power,
          равный половине исходной стоимости каждого отряда с округлением вверх;
          не может заплатить — эффект не работает вовсе, отряды гибнут как обычно.
          Transference (Ongoing): когда вражеская фракция убивает или уничтожает
          ваш отряд (не захватом), карта переходит к ней в конце текущего действия,
          а The Invasion получает 1 Doom. Оба эффекта обязательны.
      - {name_en: Battle Dice, count: 20}
    start_area: >
      Расстановка после Windwalker: 8 Power, Lord's Shadow, Fiend и 6 Demon Larvae
      в любой незанятый регион (с теми же ограничениями по картам, что у Opener).
      Дальше — по инструкции на карте Lord's Shadow.
    signature:
      - Нет Acolytes — их роль играют Demon Larvae, которые не строят и не контролируют Gates
      - Своя постройка Lord's Shadow, которая выращивается из жетонов Portent
      - Baphomet тратит Doom вместо Power и требует жертвы каждую Doom Phase
      - Число пробуждаемых Independent Great Old Ones ограничено числом Lord's Shadow
    spellbooks: [Blood Offering, Eclipse, Entropy Siphon, Hellgate, Infernolatreia, Scavenge]
    spellbooks_status: COMPLETE
    spellbooks_detail:
      - name: Blood Offering
        timing: "Action: Cost 0"
        text: >
          Открыть 4 Elder Sign. У противников 2 минуты, чтобы предложить вам
          Cultist с поля в обмен на Doom с одного из открытых Elder Sign. Можно
          принять одно предложение: захватить этого Cultist, тот игрок получает
          Doom за этот Elder Sign, карта сбрасывается. Остальные Elder Sign
          возвращаются в пул. Карта переворачивается до Gather Power Phase.
      - name: Hellgate
        timing: "Action: Cost 2"
        text: >
          Переместить любое число своих отрядов из одного региона с Lord's Shadow
          в другой регион с Lord's Shadow.
      - name: Eclipse
        timing: Only Once
        text: >
          Играется в любой момент до Doom Phase. В эту Doom Phase все остальные
          фракции не получают Doom за Gates под контролем отрядов. Doom за
          ритуалы и прочие эффекты они получают как обычно. После использования
          карта кладётся лицом вниз и больше не работает.
      - name: Infernolatreia
        timing: Ongoing
        text: >
          Получая один или больше Elder Sign, можно вместо этого сначала взять
          и посмотреть столько Elder Sign, сколько у вас Lord's Shadow плюс один,
          оставить положенное количество, остальные вернуть.
      - name: Scavenge
        timing: "Action: Cost 2"
        text: >
          Переместить любое число своих Gryllus. Затем, тем же действием, каждый
          Gryllus может либо бесплатно вступить в битву в своём регионе, либо
          захватывать там за 1 Power — но не больше одной битвы или одного
          захвата на регион. На вашей стороне в такой битве участвуют только
          Gryllus.
      - name: Entropy Siphon
        timing: Ongoing
        text: >
          Fiends могут контролировать Gates. В конце Doom Phase противники
          сообща решают, как потерять 4 Power за каждый Gate под контролем
          Fiend. За каждые 4 Power, которые они так не потеряли, все игроки
          с бо́льшим, чем у вас, Doom теряют 1 Doom.
    spellbook_requirements:
      r1: "Пробудить Baphomet"
      r2: "В конце второй Doom Phase взять этот spellbook; все прочие игроки теряют 1 Doom"
      r3: "Действием заплатить 4 Power и 1 Doom"
      r4: "Иметь на планшете захваченных Cultists двух или более разных фракций"
      r5: "Создать Lord's Shadow"
      r6: "Создать ещё один Lord's Shadow"
    stats_confidence: MEDIUM
    stats_confidence_note: >
      Рулбука по этой фракции у нас нет: числа взяты из SRC-WIKI (шаблоны unit/comp)
      и подтверждены SRC-NECRO-FAC. Оба источника фанатские, третьего нет.
      Поиск 2026-09-11: изображения faction card нет и на вики — единственная
      из двенадцати фракций, у которой карта не нашлась. Проверять, когда
      появится. См. FAC-012.
    sources:
