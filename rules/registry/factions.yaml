  # ПРАВИЛО ИСТОЧНИКОВ ПО ФРАКЦИЯМ — решение Alek 2026-09-11 (по итогам FAC-017).
  # Реестр собирает самый точный, самый свежий и самый близкий к оригиналу
  # вариант из доступного. При конфликте берётся источник выше по списку:
  source_policy:
    - rank: 1
      what: Компонент актуального издания
      refs: [SRC-WIKI-FC, SRC-WIKI-MAP]
      note: >
        Фотографии самих карт фракций и карты Земли. Это то, во что играют
        сейчас, — высший приоритет, даже если разрешение низкое.
    - rank: 2
      what: Рулбук-компендиум и официальная эррата
      refs: [SRC-RB-NEW, SRC-ERRATA-PACK, SRC-ERRATA-TABLE, SRC-FAQ]
      note: Количества фигурок, механики, правки. Числа отрядов там отсутствуют.
    - rank: 3
      what: Фанатские базы
      refs: [SRC-WIKI, SRC-NECRO-FAC]
      note: >
        Берутся там, где компонента и рулбука не хватает: формулы, тексты
        spellbooks, состав The Invasion. necronomicon назван Alek как
        допустимый крайний источник — фанатский, но достаточно точный.
        Такие записи помечаются `stats_confidence: MEDIUM`.
    - rank: 4
      what: Русское издание 2015/2017
      refs: [SRC-PLANCARD]
      note: >
        Только историческая справка и источник русских названий и терминов.
        ЧИСЛА ИЗ НЕГО НЕ ПРИНИМАЮТСЯ: издание устарело, см. FAC-017.
  source_policy_purpose: >
    Реестр — фундамент для последующей выверки наших планшетов, карт и жетонов.
    Сами планшеты в этой задаче не правятся: выверка и правки идут отдельными
    задачами и опираются на эти числа как на эталон.

  # РЕШЕНИЕ ALEK 2026-09-11 — четыре фракции оригинала игнорируются.
  # Daemon Sultan (CW-F-07), Tcho-Tcho (CW-F-10), Windwalker (CW-F-11) и
  # The Invasion (CW-F-12) в работу не берутся. По The Invasion отдельно решено
