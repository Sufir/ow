  # ШКАЛА «ОЧЕРЕДЬ» — решение Alek 2026-09-22, D-048.
  # «Очередь» — поле планшета фракции (`queue` в print/Template.html),
  # задаёт ТОЛЬКО порядок начальной расстановки (D-031). Шкала взята на полный
  # набор оригинала — 12 позиций; наши фракции занимают свои места, свободные
  # держатся за фракции оригинала, у которых нашего аналога пока нет.
  #
  # Что в шкале ИЗ ОРИГИНАЛА (жёсткие ограничения, SRC-RB-NEW):
  #   • Ancients раньше Tcho-Tcho, Windwalker и Opener   (стр. 68)
  #   • Tcho-Tcho после всех, кроме Windwalker и Opener  (стр. 89)
  #   • Opener расставляется последним                   (стр. 81)
  # Полного линейного порядка в оригинале нет, нумерации фракций нет вообще.
  #
  # Что в шкале НАШЕ (ранг произвольный, оригиналу не противоречит):
  #   • конкретные номера внутри 1…9 — там оригинал молчит;
  #   • 1, 2, 3, 7, 8 не трогались: они уже напечатаны на планшетах;
  #   • 4 и 5 держатся за Daemon Sultan и The Invasion, 11 — за Windwalker.
  queue_scale:
    updated: 2026-09-22
    decision_ref: D-048
    # ТИП ЗНАЧЕНИЯ — float, решение Alek 2026-09-22 (уточнение к D-048).
    # Целые пишутся с хвостом `.0`. Дробные позволяют втиснуть новую фракцию
    # между двумя уже напечатанными, не сдвигая ничего: 1.5 встанет между
    # Островной Империей и Эйркрафт Корпорейшн. Порядок задаётся сравнением
    # чисел, шаг между соседями значения не имеет.
    # ПЕЧАТЬ — решение Alek 2026-09-24 (D-053), отменяет прежнее «без хвоста»:
    # на планшете число печатается как float, «Очередь: 1.0», дробное — «1.5».
