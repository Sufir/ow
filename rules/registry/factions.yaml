  # такая же подробная, как у рабочих фракций. Вместе с ними игнорируются и черновые наброски по фракциям вне
  # состава — Криогеник Технолоджис, Свет Истины, Армия освобождения. Записи
  # оставлены в реестре ради полноты картины оригинала, у них `scope: IGNORED`.
  ignored_original: [CW-F-07, CW-F-10, CW-F-11, CW-F-12]
  ignored_redesign: [OW-X-01, OW-X-02, OW-X-03]

  # Общие для всех фракций соответствия, чтобы не повторять в каждой записи.
  # Проверены по SRC-RB-NEW, с. 13 и 14, и по FC-* (блок «Подготовка»).
  universal:
    - original: 6 Acolyte Cultists (у каждой фракции ровно 6)
      redesign: Рекрут ×6, стоимость 1, боевые 0
      match: EXACT
      source: {ref: SRC-RB-NEW, loc: "с. 14, BL-UNIT-002"}
    - original: Старт — 8 Power, один контролируемый Gate и 6 Acolytes в регионе с глифом фракции
      redesign: Старт — 8 нефти, 1 фабрика под контролем и 6 рекрутов в стартовом регионе
      match: EXACT
      source: {ref: SRC-RB-NEW, loc: "с. 7 и 13"}
    - original: High Priest (дополнение) — 1 шт, особый Cultist
      redesign: Полковник — 1 шт, стоимость 3, боевые 0, способность «Боевое донесение»
      match: RENAMED
      note: >
        Полковник есть у 7 фракций из 8. У Moon Systems его нет — ровно как в оригинале:
        Bubastis High Priests не использует. Подтверждено издателем 2026-09-24
        (FAC-020, SRC-PG-HPO4): «Includes high priests for ALL Factions, including
        Daemon Sultan (but not Bubastis, since they can't use high priests)». Фраза
        рулбука «the Bubastis High Priest… are included for your convenience…» (SRC-RB-NEW,
        с. 75) — дословная копия абзаца Daemon Sultan; на странице COMPONENTS Bubastis
        жреца нет, у Daemon Sultan он нарисован. Вместо жреца у Bubastis — +1 Power
        в каждую Gather Power Phase в партии с жрецами (SRC-WIKI, Bubastis → Setup:
        «In a game with High Priests, add 1 more Power each Gather Power Phase»).
        У Moon Systems так же: +1 нефть при игре с полковниками (D-057).
    - original: 4 Brain Cylinders на фракцию
      redesign: Энграммы, 8×4 шт (папка «acrylic», файл 03)
      match: RENAMED
      note: Количество на фракцию совпадает (4). Терминологическая пара — в terms.yaml.

# =============================================================================
# ORIGINAL — фракции Cthulhu Wars
# Состав: 4 базовых + 7 из дополнений (оглавление SRC-RB-NEW, с. 4) + The Invasion
# (CW-F9), которой в компендиуме нет, — итого 12.
#
# Количества фигурок в `units` — из блоков COMPONENTS (с. 5–6 и страница фракции).
# Стоимости и боевые значения в тексте рулбука отсутствуют: они напечатаны только
# на faction cards, которых у нас нет (FAC-006). Взяты из двух машиночитаемых
# источников — SRC-WIKI (шаблоны {{unit}}/{{comp}} в викитексте) и SRC-NECRO-FAC
# (necronomicon.app/data-files/factions.json). Источники сошлись по всем фракциям
# компендиума, поэтому `stats_confidence: HIGH` везде, кроме Daemon Sultan
# (неполная страница рулбука, FAC-015) и The Invasion (рулбука нет вовсе, FAC-012).
#
# Значение, заданное формулой, хранится как `null` в числовом поле плюс текст
# в `cost_note` / `combat_note`. Проверять надо оба поля, а не только число.
# =============================================================================

original:

  # Состав: 11 фракций компендиума SRC-RB-NEW + The Invasion (CW-F9), которой
  # в компендиуме нет. Официальный список Petersen Games (SRC-PG-ROSTER, 17.07.2026)
  # называет 11 фракций и The Invasion в него не включает, хотя продаёт её
  # отдельным продуктом. См. FAC-012.
  #
  # Числа юнитов: `count` — фигурок в коробке, `cost` — стоимость призыва в Power,
  # `combat` — боевые кубики. Если значение задаётся формулой, число равно null,
  # а формула лежит в `*_note`. Источники по каждой фракции — в `sources`:
  # количества подтверждены страницей COMPONENTS рулбука, стоимости и боевые
  # значения — двумя независимыми источниками (SRC-WIKI и SRC-NECRO-FAC),
  # которые сошлись по всем 11 фракциям компендиума без единого расхождения.
  # Выписка со сверкой — sources/cthulhu-wars/SRC-WIKI__faction-units-and-components__2026-09-11.md

  - id: CW-F-01
    name_en: Great Cthulhu
    set: CORE
    product_code: CW                  # в коробке ядра
    rulebook_page: 43
    start_power: 8
    goo:
      name_en: Cthulhu
      name_ru: Ктулху
      count: 1
      cost: 10
      cost_note: "10 при первом пробуждении, далее 4 каждый следующий раз (способность Immortal)"
      combat: 6
      combat_note: null
      awaken: >
        Нужен Gate в стартовом регионе Great Cthulhu (может быть брошенным или
        вражеским). Заплатить 10 Power (далее 4). Cthulhu появляется в стартовом
        регионе; за пробуждение любого Great Old One фракция получает 1 Elder Sign.
      ability: "Devour (Pre-Battle): противник выбирает и убирает одного своего Monster или Cultist из битвы"
    secondary_goo: null
    unique_ability:
      name_en: Immortal
      timing: Ongoing
      text: >
        После первого пробуждения Cthulhu стоит 4 Power каждый следующий раз.
        За пробуждение любого Great Old One — 1 Elder Sign.
    units:
      - {name_en: Acolyte, name_ru: Адепт, category: CULTIST, count: 6, cost: 1, combat: 0, spellbook: Dreams}
      - {name_en: Deep One, name_ru: Глубоководный, category: MONSTER, count: 4, cost: 1, combat: 1, spellbook: Devolve}
      - {name_en: Shoggoth, name_ru: Шоггот, category: MONSTER, count: 2, cost: 2, combat: 2, spellbook: Absorb}
      - {name_en: Starspawn, name_ru: Звёздное отродье, category: MONSTER, count: 2, cost: 3, combat: 3, spellbook: Regenerate}
    buildings: []
    extras: []
    start_area: "South Pacific"
    start_area_ru: "юг Тихого океана"
    start_area_confidence: HIGH
    start_area_glyph: >
      Глиф Great Cthulhu стоит на карте Земли в зоне South Pacific, рядом
      подписано «(R’lyeh)» — проверено по официальной карте 2026-09-11.
    start_area_source: >
      Прямого списка стартовых регионов в рулбуке нет — «Players’ Start Areas are
      listed on their Faction Cards» (с. 13). Регион восстановлен по тексту с. 44:
      «he’ll be back at R’lyeh, ready to Submerge». R’lyeh — южная часть Тихого
      океана, и South Pacific есть в списке океанских регионов карты (с. 14).
      Сверка 2026-09-11: наш планшет Островной Империи (пара MAP-01, CONFIRMED)
      называет стартовым регионом «юг Тихого океана» — два независимых пути
      дали один и тот же регион.
    signature:
      - Всегда первый игрок в начале партии, если участвует в партии
      - Submerge — уход армии под воду, недоступность для атаки
      - Самые сильные отряды в игре при малом их числе
    spellbooks: [Absorb, Devolve, Dreams, Regenerate, Submerge, "Y'ha Nthlei"]
    spellbooks_status: COMPLETE
    spellbooks_note: >
      В тексте рулбука карта Regenerate называется «Regeneration»; на самой карте
      и в обоих машинных источниках — «Regenerate». Взято написание карты.
    stats_confidence: HIGH
    sources:
