  - id: FAC-019
    type: DEVIATION
    area: FACTION
    title: На планшете Moon Systems не хватало трёх правил, которые есть в гуглдоке и в оригинале
    severity: ERROR
    status: CLOSED
    decision: >
      Решение Alek 2026-09-24 (D-052): все три правила восстановлены на планшете
      по гуглдоку «Фракции v2.0», сверены с оригиналом.
    decided: 2026-09-24
    subject: OW-F-06
    detail: >
      1) Нет блока «Создание боевого робота» — §1.3 Ж и §7.3.3 требуют условий
      на планшете, в реестре стоял robot_creation: null. Гуглдок и Bastet
      awakening совпадают: все виды БМ в игре, 6 нефти, регион без вражеских
      отрядов. 2) «Человекообразные андроиды» не помечены как обязательные:
      по §3.9 немаркированная способность необязательна, и фракция могла бы
      отказываться от чужих эффектов на андроидов. Гуглдок: «Это обязательно»;
      оригинал Lunacy: not optional. 3) Не было правила «“Зардоз” не приносит
      карту скрытого влияния при оказании давления»: по §6.3 шаг 4 он её давал.
      Оригинал: Bastet — Elder God, Elder Sign за ритуал не даёт; гуглдок —
      «Особенность» «Зардоза».
    proposal: Исполнено.

  - id: FAC-020
    type: HYPOTHESIS
    area: FACTION
    title: Может ли Bubastis использовать High Priest — нет; полковника Moon Systems не получает
    severity: WARNING
    status: CLOSED
    decision: >
      2026-09-24, D-056. Проверено по оригиналу: Bubastis High Priests не
      использует. Moon Systems полковника не получает. Вместо него — +1 нефть
      в фазу получения ресурсов при игре с полковниками, как +1 Power у Bubastis
      в оригинале (D-057; гуглдок давал +2).
    decided: 2026-09-24
    subject: [OW-F-06, CW-F-06]
    detail: >
      Повод: фраза рулбука в подготовке Bubastis — «the Bubastis High Priest, Dark
      Demon, and Brain Cylinder Tokens are included for your convenience if you are
      playing a game in which these are available to other players. Bubastis does
      not use these otherwise» (SRC-RB-NEW, с. 75). Прочитанная буквально, она
      разрешает Bubastis жреца в партии с жрецами; в предыдущем круге 24.09 она так
      и была прочитана — это была ошибка.
      Доводы против, по убыванию силы:
      1) Издатель прямо: «Includes high priests for ALL Factions, including Daemon
         Sultan (but not Bubastis, since they can't use high priests)» и «Bubastis
         is not included since they cannot use high priests» (SRC-PG-HPO4). Обзор
         фракций на сайте издателя: «Bubastis can't use high priests, by design».
      2) Страница COMPONENTS Bubastis (SRC-RB-NEW, с. 74 файла) показывает Dark
         Demon и Brain Cylinders, но не жреца. У Daemon Sultan на той же позиции
         нарисован «1 High Priest».
      3) Фраза — дословная копия абзаца Daemon Sultan (с. 81 файла), где жрец
         действительно есть; при переносе имя жреца не вычеркнули.
      4) FAQ исходит из того же: «since Bubastis can only “Control” one Gate
         (the Moon)».
      Dark Demon и Brain Cylinders из той же фразы у Bubastis работают — FAQ
      отвечает на оба («gets stuck with a Dark Demon, like anyone else»; «can
      Earth Cats be turned into Brain Cylinders? Yes»). Жреца это не касается.
      Вики High Priests перечисляет жрецов у всех фракций, кроме Bubastis.
    proposal: Исполнено.
