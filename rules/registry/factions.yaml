  - id: FAC-016
    type: SOURCE-GAP
    area: FACTION
    title: Стартовые регионы оригинала не подписаны — сняты с глифов карты
    severity: WARNING
    status: CLOSED
    decision: >
      Решение Alek 2026-09-11: брать с глифов — в наших черновых планшетах
      регионы уже названы, нужна короткая сверка. Сделано: стартовые регионы
      восстановлены через подтверждённые пары маппинга. Yellow Sign → Европа
      (MAP-03), Crawling Chaos → Южная Азия (MAP-02), Sleeper → запад Северной
      Америки (MAP-08), Black Goat уточнён с «Africa» до «Западная Африка»
      (MAP-05). Great Cthulhu совпал по двум независимым путям: текст рулбука
      про R’lyeh и наш планшет с «югом Тихого океана» дали один регион.
      Каждому проставлено `start_area_confidence`.
      Доделано в тот же день по указанию Alek «взять с глифов»: найдена
      официальная карта Земли (SRC-WIKI-MAP) и по ней прочитаны все глифы.
      Подтвердились все пять восстановленных регионов, добавился шестой —
      Windwalker с двумя зонами: Arctic Ocean (подпись «(Lomar)») и Antarctica.
      Английские имена зон теперь стоят в `start_area`, русские — в
      `start_area_ru`, доверие у всех шести HIGH, поле `start_area_glyph`
      говорит, где именно стоит глиф. Незаполненных регионов не осталось:
      у Ancients, Bubastis, Opener, Tcho-Tcho, Daemon Sultan и The Invasion
      глифа нет по устройству, регион задаётся правилом расстановки.
    decided: 2026-09-11
    subject: [CW-F-02, CW-F-03, CW-F-09, CW-F-11]
    detail: >
      В оригинале стартовые регионы названиями не подписаны: на карте стоит
      глиф фракции, а сам регион назван только на faction card, которых у нас
      нет (FAC-006). В тексте рулбука перечня нет, в SRC-WIKI в поле setup
      стоит картинка глифа, в SRC-NECRO-FAC — то же самое. В нашей версии
      регионы подписаны, поэтому имя региона берётся с нашего планшета через
      подтверждённую пару. Так закрыты четыре фракции (см. `decision`).
      Остаётся Windwalker: его пара, Криогеник Технолоджис, — только гипотеза
      (MAP-09, DEFERRED), планшет не доработан, брать имя неоткуда. У Ancients,
      Bubastis, Opener, Tcho-Tcho, Daemon Sultan и The Invasion стартовый регион
      задан правилом расстановки, а не глифом: там дозаполнять нечего.
    need: null
    proposal: >
      Сделано целиком. Побочно проверено главное: faction card оригинала регион
      НЕ называет — на ней написано «6 Acolytes and a Controlled Gate in the Area
      marked with this Glyph». То есть добор faction cards этот вопрос закрыть
      не мог в принципе, закрывала только карта. Заодно подтвердилось, что наша
      карта повторяет деление оригинала один в один: те же 17 зон под теми же
      именами по-русски.

  - id: FAC-017
    type: SOURCE-CONFLICT
    area: FACTION
    title: Русское издание даёт Ползучему Хаосу другие боевые значения
    severity: ERROR
    status: DECIDED
    decision: >
      Решение Alek 2026-09-11: редизайн равняется на АКТУАЛЬНОЕ издание.
      В реестре остаются 2/1 и 3/2. Русское издание переведено в источники
      исторической справки: из него берутся русские названия и термины, но
      не числа. Приоритет SRC-PLANCARD понижен с 1 до 3.
      Общее правило по фракциям записано в `meta.source_policy`.
      Выверка наших планшетов по реестру — отдельная задача позже; здесь
      готовится фундамент под неё, а не правятся планшеты.
    decided: 2026-09-11
    subject: CW-F-03
    detail: >
      На русском планшете (SRC-PLANCARD, с. 2) у Ползучего Хаоса стоит:
      Летающий полип — стоимость 2, мощь 2; Охотящийся Ужас — стоимость 3,
      мощь 3. На актуальной англоязычной faction card (SRC-WIKI-FC) те же
      юниты: Flying Polyp 2 / 1 и Hunting Horror 3 / 2. Совпадает всё
      остальное — количества фигурок, Ночной Мверзь 1/0, Ньярлатотеп 10,
      spellbooks. Расходятся ровно два боевых значения, и оба в одну сторону:
      в русском издании отряды на 1 кубик сильнее.
      Три остальные фракции ядра сверены по тому же PDF и совпали
      с актуальными данными полностью — то есть это не сплошной сдвиг
      локализации, а точечное расхождение.
      Ни таблица балансных правок Petersen (SRC-ERRATA-TABLE), ни Ultimate
      Errata Pack, ни FAQ изменения боевых значений Crawling Chaos не
      упоминают: по этой фракции там нет ни строчки.
      Датировка: файл Plan_Card.pdf создан 2015-10-14, изменён 2017-08-22,
      то есть отражает первое-второе издание (O1/O2). Вики и necronomicon
      отражают позднейшее.
    severity_note: >
      Для нас это ERROR, а не INFO: боевые кубики — тот самый уровень чисел,
      который редизайн копирует 1:1, и у пары MAP-02 (Эйркрафт Корпорейшн)
      от выбора зависит, сходится ли она по числам.
    proposal: >
      Исполнено. Остался хвост для будущей выверки планшетов: если планшет
      Эйркрафт Корпорейшн (пара MAP-02) писался по русскому изданию, у него
      могут быть унаследованы старые боевые значения. Проверяется не здесь,
      а в задаче на выверку планшетов — реестр для неё и есть эталон.

