  - id: FAC-012
    type: SOURCE-GAP
    area: FACTION
    title: Реестр оригинала был неполон — не хватало The Invasion (CW-F9)
    severity: ERROR
    status: DECIDED
    decision: >
      Решение Alek 2026-09-11: фракцию в работу не берём, но всю доступную
      информацию по ней вносим. Сделано: у CW-F-12 стоит `scope: IGNORED`,
      при этом запись заполнена наравне с рабочими фракциями — отряды со
      стоимостями и боевыми кубиками, Baphomet с формулой боя и обеими
      способностями, постройка Lord's Shadow с полным набором отличий от Gate,
      жетоны Portent с правилом их выкладки соперниками, карта Baphomet's Fury
      с обоими эффектами и условием включения, шесть spellbooks с текстами
      и шесть условий их получения. CW-F-12 добавлена в `meta.ignored_original`.
    decided: 2026-09-11
    subject: CW-F-12
    detail: >
      До 2026-09-11 в реестре было 11 фракций оригинала — ровно те, что есть
      в компендиуме SRC-RB-NEW. Двенадцатая, The Invasion, в компендиум не попала:
      она вышла позже, с кампанией Return to Planet Apocalypse, как кроссовер
      с игрой Planet Apocalypse (автор Matthew Folger), и продаётся отдельным
      продуктом CW-F9 (есть версия без миниатюр CW-F9-NM). Официальный список
      фракций Petersen Games от 17.07.2026 называет 11 фракций и The Invasion
      в него не включает, хотя тут же продаёт её в витрине.
      Фракция заведена как CW-F-12 по двум фанатским источникам; рулбучного
      подтверждения чисел нет.
    need: >
      Карта фракции The Invasion (или её рулбук) для подтверждения количеств,
      стоимостей и боевых значений третьим, официальным источником.
    proposal: >
      Исполнено. Остаётся один незакрытый хвост: числа держатся на двух
      фанатских источниках, официального подтверждения нет (`stats_confidence:
      MEDIUM`). Если карта фракции или её рулбук появятся — сверить и поднять
      до HIGH. Отдельной работы это не требует, делается заодно.

  - id: FAC-013
    type: AMBIGUITY
    area: FACTION
    title: Bastet числится Elder God, а не Great Old One
    severity: WARNING
    status: DEFERRED
    decision: >
      Решение Alek 2026-09-11: сейчас только пометка. Разница уже расписана
      на нашем планшете Moon Systems, и пока этого достаточно. При финальной
      сверке разобрать, создаёт ли категория Elder God проблемы в правилах,
      и тогда решить, что с ней делать.
      Уточнение того же дня: категория подтверждена официальным компонентом —
      «ELDER GOD» напечатано на самой faction card Bubastis. То есть разбирать
      придётся настоящую особенность правил, а не ошибку фанатского источника.
    decided: 2026-09-11
    subject: CW-F-06
    detail: >
      И SRC-NECRO-FAC, и SRC-WIKI дают Bastet тип «Elder God», тогда как у всех
      прочих фракций главная фигура — «Great Old One». Правила завязывают на
      категорию Great Old One много механик: пробуждение Independent Great Old
      Ones, Harbinger у Nyarlathotep, ограничение The Invasion по числу
      контролируемых Great Old Ones, подсчёт Elder Signs за пробуждение.
      Считается ли Bastet Great Old One для всех этих целей — по имеющимся
      источникам не проверено.
    proposal: >
      К финальной сверке: пройти по механикам, завязанным на категорию Great
      Old One, и проверить, попадает ли под них Bastet — пробуждение
      Independent Great Old Ones, Harbinger у Nyarlathotep, ограничение
      The Invasion по числу контролируемых Great Old Ones, Elder Sign
      за пробуждение. Источники — карта фракции Bubastis и FAQ. Для нашей
      стороны вопрос прикладной: «Зардоз» у Moon Systems — обычный боевой робот,
      и если Bastet в оригинале особый случай, у пары MAP-06 появляется
      ещё одно расхождение.

