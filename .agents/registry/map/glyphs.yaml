# glyphs.yaml — что напечатано НА поле помимо названий областей:
# стартовые глифы фракций, СИМВОЛЫ РЕГИОНОВ и подписи-ориентиры.
# Схема — SCHEMA.md.
#
# ВНИМАНИЕ: в этом файле живут ДВА разных знака, и путать их нельзя.
#   faction_glyphs  — стартовая область фракции. Семь штук, у нас на поле их НЕТ
#                     (решение № 10, MF-009): стартовый регион пишется текстом
#                     на планшете.
#   region_symbols  — символ региона. Три штуки, у нас на поле они ЕСТЬ
#                     (D-043) и от них зависят семь задач двух фракций.
#
# Стартовые области фракций оригинала живут в registry/factions.yaml
# (поля start_area / start_area_glyph / start_area_source, сверены с официальной
# картой 2026-09-11). Здесь они привязаны к ID областей карты и разложены
# по сторонам планшета, чего в factions.yaml нет.

meta:
  what_is_a_glyph: >
    Стартовая область фракции на поле не подписана словами: faction card говорит
    «in the Area marked with this Glyph», а на карте в этой области напечатана
    плоская ажурная эмблема фракции в её цвете. Рулбук списка стартовых
    регионов не даёт вообще (SRC-RB-NEW, с. 13), поэтому глифы — единственный
    источник по расстановке.
  not_glyphs: >
    На фотографиях поля (SRC-BGA-GRAPH) в каждой области лежит розовая или синяя
    «коралловая» фигурка и буквенная плашка — это пластиковые Gates и буквы
    Scrabble, расставленные автором статьи для извлечения графа. К печати поля
    они не относятся и с глифами их путать нельзя: глиф плоский и вписан
    в рисунок, фигурка объёмная и лежит поверх.
  glyph_count: >
    Глифов семь: шесть фракций плюс второй глиф Windwalker. Остальные шесть
    фракций оригинала стартовой области на поле не имеют — см. no_glyph.
  sides: >
    Глиф печатается на обеих сторонах планшета. На стороне «5 игроков» он стоит
    в дробной области, на стороне «3 игрока» — в её родительской области.
    Ориентир рядом с глифом (landmark) на обеих сторонах один и тот же, это и
    позволяет сопоставить размещения.
  what_is_a_region_symbol: >
    Второй тип знака на поле, к стартовым глифам отношения не имеющий.
    В оригинале это три Spellbook Glyph фракции Yellow Sign: Dragon, Chevron,
    Thorns. Рулбук называет их числом при расстановке The Ancients (SRC-RB-NEW,
    с. 64: «you may set up in an Area containing one of Yellow Sign's three
    Spellbook Glyphs»), имена даёт SRC-WIKI-YS, размещение — SRC-CW-MAP-SCAN.
    У нас это капля Q, пламя W, вагонетка E; размещение повторяет оригинал
    один в один (D-046). Раздел — region_symbols.
  redesign_rule: >
    РЕШЕНИЕ ALEK 2026-09-16. У нас глифов на карте не будет: стартовый регион
    записан текстом на планшете фракции. Раздел faction_glyphs остаётся
    справочным — он нужен только для сверки с оригиналом. Рабочий раздел —
    start_areas_redesign.
    На планшете указан САМЫЙ УЗКИЙ регион («Западная Африка», «Южная Азия»,
    «запад Северной Америки»). Если в собранной раскладке этого узкого региона
    нет — та половина поля лежит стороной «3» — фракция ставится в содержащий
    его широкий регион: Западная Африка → Африка, Южная Азия → Азия, запад
    Северной Америки → Северная Америка, Скандинавия → Европа. Это ровно
    отношение parent из regions.yaml, поэтому вычисляется однозначно и
    сходится всегда: у каждой области стороны «5» есть ровно один parent.
    Поля regions_3p и regions_5p ниже — уже разрешённый результат этого
    правила, пересчитывать его в уме не нужно.
  out_of_scope: >
    Фракции, у которых стартовый регион правилом не задан (Братство
    Сингулярности, Moon Systems, Сайнтифик Солюшн — «любой свободный»),
    в задачу по карте не входят: они расставляются по своим правилам, и от
    карты тут ничего не требуется. Записаны в start_areas_redesign с
    regions_*: null только для полноты состава.

