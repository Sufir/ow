# --- символы регионов --------------------------------------------------------
# Три знака, напечатанные на поле помимо стартовых глифов. В оригинале это
# три Spellbook Glyph фракции Yellow Sign; у нас — капля Q, пламя W,
# вагонетка E (ICON-032/033/034 в ../icons.yaml, шрифт Templates/Fonts/Oil
# Wars.ttf). Размещение снято своими глазами с SRC-CW-MAP-SCAN — растра обеих
# сторон оригинального поля, — и повторяется у нас один в один (D-046).
#
# ЗАКОН РАЗМЕЩЕНИЯ, который держит весь раздел: СИМВОЛ ИДЁТ ПО МАТЕРИКУ.
# Америки — Dragon, Европа с Азией — Thorns, Африка с Австралией — Chevron.
# Отсюда два следствия, и оба проверены отдельно, а не выведены из закона:
#   1. каждая область СУШИ, КРОМЕ АНТАРКТИДЫ, несёт ровно один символ —
#      6 из 6 на стороне «3», 14 из 14 на стороне «5»;
#   2. шесть океанов и Антарктида не несут ни одного — свободных областей
#      ровно 7 в любой из четырёх раскладок.
# Из (1) следует, что дробление стороны «5» символ наследует: все дети
# области стороны «3» несут тот же символ, что и родитель. Проверено
# пофамильно, исключений нет.
#
# ЧТО ЭТО ЗНАЧИТ ДЛЯ ЗАДАЧ. Четвёртая задача Братства Сингулярности — община
# в регионе БЕЗ символов — выполняется только в океане или в Антарктиде.
# Это не наша особенность: у The Ancients в оригинале четвёртый собор ставится
# ровно туда же и по той же причине.

region_symbols:

  - id: MS-001
    original_name: Dragon Glyph
    original_shape: >
      свёрнутый в кольцо завиток с отростками, похож на спираль или на
      скрученный хвост; оранжевая заливка с жёлтым бликом, чёрный контур
    redesign_symbol: капля
    redesign_glyph: "Q"
    icon_ref: ICON-032
    resource_reading: нефть
    landmasses: [NORTH_AMERICA, SOUTH_AMERICA]
    regions_3p: [MR-L3-NAM, MR-L3-SAM]
    regions_5p: [MR-L5-NAMW, MR-L5-NAME, MR-L5-CAM, MR-L5-SAMW, MR-L5-SAME]
    confidence: HIGH
    note: >
      Сторона «3»: по одному знаку в Северной и Южной Америке. Сторона «5»:
      знак есть в каждой из пяти американских областей, включая обе половины
      Северной Америки — они стоят по разные стороны границы Запад / Восток
      и это проверено отдельным кропом, потому что знаки там близко.
    sources: [SRC-CW-MAP-SCAN, SRC-WIKI-YS]

  - id: MS-002
    original_name: Thorns Glyph
    original_shape: >
      пучок из пяти острых шипов, средний выше и залит оранжево-красным;
      легко принять за язычки пламени — в первом проходе так и вышло
    redesign_symbol: пламя
    redesign_glyph: "W"
    icon_ref: ICON-033
    resource_reading: природный газ
    landmasses: [EUROPE, ASIA]
    regions_3p: [MR-R3-EUR, MR-R3-ASI]
    regions_5p: [MR-R5-SCA, MR-R5-EUR, MR-R5-ASIN, MR-R5-ASIS, MR-R5-ARB]
    confidence: HIGH
    note: >
      Размер знака гуляет: в Европе он мельче, чем в Азии, — это один и тот же
      символ в разном масштабе, а не два разных. Скандинавия и Европа стороны
      «5» несут по своему знаку, проверено кропом по их общей границе:
      скандинавский стоит в оранжевой заливке, европейский — в оливковой.
      Аравия несёт свой знак у юго-восточного угла.
    sources: [SRC-CW-MAP-SCAN, SRC-WIKI-YS]

  - id: MS-003
    original_name: Chevron Glyph
    original_shape: >
      шеврон «^» с расходящимися книзу концами, оранжево-жёлтая заливка
    redesign_symbol: рудничная вагонетка
    redesign_glyph: "E"
    icon_ref: ICON-034
    resource_reading: уголь и руды
    landmasses: [AFRICA, AUSTRALIA]
    regions_3p: [MR-R3-AFR, MR-L3-AUS]
    regions_5p: [MR-R5-AFRW, MR-R5-AFRE, MR-L5-AUS, MR-L5-NZL]
    confidence: HIGH
    note: >
      Единственное имя из трёх, которое подтверждается не только вики,
      но и рулбуком: SRC-RB-OLD про карту Yuggoth говорит «the Yellow Sign's
      Chevron glyph». Австралия и Новая Зеландия несут по своему знаку;
      новозеландский стоит у северного края своей области, близко к границе,
      и проверен отдельным кропом.
    sources: [SRC-CW-MAP-SCAN, SRC-WIKI-YS, SRC-RB-OLD]

