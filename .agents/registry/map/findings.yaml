  - id: MF-011
    type: GAP
    severity: CRITICAL
    status: CLOSED
    title: Символы регионов Q / W / E нигде не размещены, а от них зависят семь задач двух фракций
    subject: null
    detail: >
      На карту, кроме названий областей и метки Глобал Петролеум (§8.1
      SPEC-BOARD), печатаются ТРИ СИМВОЛА РЕГИОНА: капля (глиф Q),
      пламя (W) и рудничная вагонетка (E). Они уже нарисованы и лежат
      в шрифте проекта Templates/Fonts/Oil Wars.ttf; в registry/icons.yaml это
      ICON-032, ICON-033, ICON-034 со статусом OK.
      В реестре карты их нет НИГДЕ. glyphs.yaml описывает стартовые глифы
      фракций и ориентиры; SPEC-BOARD §8 знает один знак — метку Глобал
      Петролеум. Ни один файл не говорит, в каких областях стоят символы
      и сколько областей несёт каждый.
      КТО ОТ НИХ ЗАВИСИТ. Глобал Петролеум: три задачи из шести —
      «Разместить "Нефтяную вышку" в регионе, отмеченном символом Q / W / E».
      Братство Сингулярности: четыре задачи из шести — по одной общине
      в регионе с каждым из трёх символов и одна в регионе, где нет ни одного
      из них; плюс блок «Общины» на планшете, который разрешает по одной общине
      на символ. Без символов Братство ставит одну общину вместо четырёх,
      получает потолок в три технологии из шести и не может выиграть
      в принципе: §9.4 правил требует все шесть.
      ЧТО ЭТО В ОРИГИНАЛЕ. Три Spellbook Glyph фракции Yellow Sign, напечатанные
      прямо на карте Земли. Рулбук упоминает их в правиле расстановки The
      Ancients (SRC-RB-NEW, с. 64): «you may set up in an Area containing one of
      Yellow Sign's three Spellbook Glyphs, if desired» — то есть их ровно три
      и расстановке они не мешают. Yellow Sign = Глобал Петролеум, так что наши
      три задачи с символами — прямой перенос; задачи Братства на те же символы
      — наша надстройка, но арифметически она с тремя символами сходится.
    proposal: >
      Завести в glyphs.yaml пятый раздел (например, region_symbols) по образцу
      faction_glyphs: символ, глиф шрифта, области на стороне «3» и на стороне
      «5», источник. Позиции снимать с оригинальной карты — это Spellbook Glyphs
      Yellow Sign, они там напечатаны и видны. Затем внести размещение
      в SPEC-BOARD §8 отдельным подразделом рядом с меткой Глобал Петролеум.
      Проверить, что на каждой из четырёх раскладок присутствуют все три символа
      и остаётся хотя бы один регион без символа, — иначе четвёртая задача
      Братства невыполнима.
    decision: >
      Alek 2026-09-16: «безусловно символы будем отрисовывать на поле, никакие
      другие варианты никогда не рассматривались». Вопрос не в том, рисовать ли,
      а в том, что их размещение не записано. Правила со своей стороны закрыты:
      §1.4 говорит, что часть регионов несёт символ и что значение задаёт карта
      задачи (D-043).

      ЗАКРЫТО 2026-09-17, D-046. Размещение снято с растра обеих сторон
      оригинального поля (SRC-CW-MAP-SCAN, файлы Карта/карта.jpg
      и Карта/карта_5.jpg — они лежали в папке проекта всё это время, просто
      не были заведены источником). Имена трёх глифов взяты из SRC-WIKI-YS:
      Dragon, Thorns, Chevron. Закон размещения — символ идёт по материку;
      каждая область суши кроме Антарктиды несёт ровно один символ, океаны
      и Антарктида — ни одного.
      Alek 2026-09-17: расположение строго как в оригинале, ничего не сокращать
      и не перемещать; меняются только значки, и соответствие им берётся
      тематически по реальной добыче — капля Q = нефть = Dragon (Америки),
      пламя W = газ = Thorns (Европа, Скандинавия, Азия, Аравия), вагонетка
      E = уголь и руды = Chevron (Африка, Австралия, Новая Зеландия).
      Записано в glyphs.yaml → region_symbols, проверяется map.py check,
      попадает в derived/*.json и out/11-map.md. Условие «все три символа
      и хотя бы один регион без символа в каждой раскладке» проверено машинно:
      3P 2/2/2, 4P-A 2/5/3, 4P-B 5/2/3, 5P 5/5/4, без символа везде 7 областей.
    decided: 2026-09-17
    refs: [MF-009, MF-013]
    opened: 2026-09-16
    closed: 2026-09-17

