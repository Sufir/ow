  - id: MF-015
    type: DECISION
    severity: INFO
    status: CLOSED
    title: Географические соглашения эталонной основы, принятые по умолчанию
    subject: null
    detail: >
      При сборке geo/ пришлось принять четыре решения, у которых есть
      альтернативы. Все они зафиксированы в коде и в отчёте, но формально
      не утверждены.
      (1) ПОРОГ ЗНАЧИМОГО ОСТРОВА 5000 км². Отброшено 1304 куска общей площадью
      721 тыс. км² — 0.49 % суши. Из узнаваемого выпали Тринидад (4880),
      Галапагосы (4607), Фолкленды (4473), Сокотра (3796), Флорида-Кис,
      мальтийский и эгейский мелкоостров. Порог выбран по печати: 5000 км²
      на полотне 900 мм — это точка около 2 мм.
      (2) НОВАЯ ГВИНЕЯ ЦЕЛИКОМ В ОКЕАНИИ. Геосхема ООН делит её по 141° в.д.
      между Индонезией (Азия) и Папуа (Океания). Резать остров пополам ради
      геосхемы для настольной игры смысла нет, поэтому режутся только два
      мегамассива — Афроевразия и Америки, а острова относятся целиком.
      (3) КАСПИЙ ВНУТРИ МАСКИ OCEAN. Слой Land оставляет его дырой в суше,
      поэтому дополнение суши включает Каспий как отдельный кусок (395 тыс. км²).
      Он вынесен справочным объектом INLAND_WATER, чтобы разбиение могло его
      исключить одной строкой, но из маски не вырезан — иначе ломается
      равенство WORLD = LAND ∪ OCEAN.
      (4) АНТАРКТИДА С ШЕЛЬФОВЫМИ ЛЕДНИКАМИ. Так устроен слой Land: площадь
      12.20 млн км² против ~12.3 материковой и ~14.2 с полным шельфом. Для
      игрового поля это скорее плюс, но число в таблице не равно справочному.
    proposal: >
      Либо утвердить как есть, либо назвать, что менять: порог (например 3000
      км², чтобы вернуть Тринидад, Галапагосы и Фолкленды), деление Новой
      Гвинеи, обращение с Каспием. Любая правка — это правка констант
      в tools/worldgeom.py и пересборка, геометрия перестраивается за минуту.
    decision: >
      Alek 2026-09-17: все четыре соглашения приемлемы, стопроцентная
      географическая достоверность не требуется. Приоритет — игровая функция
      и узнаваемость; допущения и коррекции разрешены в обе стороны. Часть
      выпавших островов возвращена в игровой базе как якоря океанских областей
      (MF-016), master оставлен честным.
    decided: 2026-09-17
    refs: [MF-014, MF-016]
    opened: 2026-09-17
    closed: 2026-09-17

  - id: MF-016
    type: DECISION
    severity: INFO
    status: DECIDED
    title: Игровая функция важнее географической точности; заведена игровая база world-game
    subject: null
    detail: >
      Решение Alek 2026-09-17, формулировка автора: «Это в первую очередь
      игровая карта, основная цель — решить функциональные игровые задачи.
      Главное — узнаваемость очертаний и взаимного расположения, всё остальное
      ровно настолько, насколько укладывается в функциональные требования.
      Если где-то удобно добавить остров, перешеек или пролив для игровых или
      эстетических целей — допустимо сделать его больше, чем он есть.
      И наоборот: если по масштабу попадает, но плохо смотрится или мешает
      механике — безжалостно выпиливать.»
      Отсюда два слоя вместо одного. geo/world-base.geojson — честная
      география, не правится «под игру»: это точка отсчёта, по которой видно,
      где и насколько мы отошли. geo/world-game.geojson — та же география
      с коррекциями, рабочая основа для разбиения на регионы. Коррекции лежат
      списком в tools/worldgeom.py (RESTORE_ISLANDS, MIN_VISIBLE_KM2, WIDEN),
      каждая с причиной, и применяются к master детерминированно.
      Что сделано в первой сборке игровой базы: возвращены восемь якорных
      островов ниже порога отбора (Тринидад, Фолкленды, Галапагосы, Сокотра,
      Азоры, Канары, Маврикий с Реюньоном, Таити) — океанская область без
      единого клочка суши читается как пустое поле; 64 острова меньше
      15 000 км² раздуты до этого размера, что на полотне 880 × 530 мм даёт
      примерно 3.7 × 3.7 мм; Панамский перешеек расширен с 50 до 153 км, потому
      что 1.1 мм — это не то, по чему можно нарисовать узел из ТЗ §6.3,
      а выдумать сушу разбиение не может. Суэцкий перешеек рассмотрен
      и намеренно НЕ расширен: узость Синая ничему не мешает, а расширение
      съело бы Суэцкий залив и залив Акаба. Берингов пролив не трогается.
      ВТОРОЕ СЛЕДСТВИЕ, важное для этапа разбиения. Посчитан масштабный разрыв
      между честным масштабом и целевыми площадями ТЗ §5: суша на игровом поле
      занимает 53 % вместо реальных 29 %, океаны ужаты с 71 % до 47 %,
      а коэффициенты по объектам расходятся на порядок — Африке нужно ×1.2,
      Европе ×3.7, Новой Зеландии ×62. Игровое поле — картограмма, а не
      проекция: география задаёт форму и соседство, площади берутся из ТЗ §5,
      топология из edges.yaml.
      ТРЕТЬЕ. Вертикальный шов, которого требовала постановка этапа, снят тем же
      решением: на нашем поле шва нет и не планировалось, меридианы к задаче
      отношения не имеют. В metadata.seam мастера стоит applicable: false
      с пояснением, чтобы его не завели заново.
    proposal: >
      Дальнейшие коррекции вносить строками в tools/worldgeom.py и пересобирать,
      а не правкой geojson руками. Каждая правка — с причиной, иначе через месяц
      не отличить географию от решения.
    decision: Принято, см. detail
    decided: 2026-09-17
    refs: [MF-014, MF-015]
    opened: 2026-09-17
    closed: null

  - id: MF-017
    type: DECISION
    severity: INFO
    status: DECIDED
    title: Формат и инструментарий поля — вектор GeoJSON плюс SVG, проверка по вектору
    subject: null
    detail: >
      Решение Alek 2026-09-18. Поле рисует Claude Code, поэтому формат
      выбирается не «как принято в полиграфии», а «на чём Claude даёт лучшее
      качество и быстрее крутит итерации». PSD как формат сдачи отменён:
      требование стояло в ТЗ §10.1 и в SPEC-BOARD §10, попало туда от автора
      задачи (не от Alek) только потому, что tools/mapgeom.py умел мерить
      единственным способом — по растровым маскам слоёв PSD. Alek PSD
      не требовал и не требует.
      ЧТО ПРИНЯТО.
      (1) Источник истины по геометрии поля — GeoJSON: один файл на раскладку,
      один Feature на игровую область, id совпадает с regions.yaml.
      (2) Система координат файла поля — МИЛЛИМЕТРЫ ПОЛОТНА: начало в левом
      верхнем углу, x вправо 0…900, y вниз 0…550, прямоугольник карты — вставка
      10 мм по периметру. Все пороги SPEC-BOARD §4 и §6 заданы в мм и см²,
      поэтому проверка становится прямым сравнением без пересчётов.
      (3) Картинка — SVG, генерируется из GeoJSON скриптом и руками не правится.
      PNG рендерится из SVG только для того, чтобы Claude посмотрел результат
      глазами; в репозиторий как артефакт не кладётся.
      (4) Проверка — по вектору, а не по растру. Длина касания = длина общей
      границы двух полигонов, зазор = минимальное расстояние между полигонами,
      рабочая площадь и вписанный круг = эрозия полигона. Растровый замер давал
      ровно два известных ложных срабатывания: обрывок маски 0,54 см² создавал
      несуществующую смежность Африки с Северным Ледовитым океаном, а крошки
      у Панамы показывали зазор 0,3 мм там, где на самом деле 8,5. В векторе
      этот класс ошибок не существует.
      (5) Печать — SVG в PDF. Если типография потребует растр, он экспортируется
      из того же SVG, а не рисуется отдельно.
      (6) Арт поверх геометрии, а не вместо неё. Проход 1 — чертёж (ТЗ §1),
      живопись и текстуры ложатся позже, границы при этом остаются из вектора.
      Если позже подключится художник, он получает SVG, а не чистый лист.
      ПОЧЕМУ НЕ ИНАЧЕ. PSD: Claude его не редактирует, правка одной границы —
      ручная работа в GUI, замер идёт через растр со всеми его артефактами.
      Рисование SVG-путей руками: координаты пишутся вслепую, обратной связи
      по площадям нет, попасть в ТЗ §5 невозможно. Inkscape и прочий CLI:
      лишняя зависимость, ничего сверх генерации SVG скриптом не даёт.
      ЧТО ЭТО МЕНЯЕТ В ИНСТРУМЕНТАХ. tools/mapgeom.py остаётся только для
      замера старого референса по psd-черновику и новых файлов не касается.
      Для нового поля пишутся два скрипта: сборка полотна из geo/world-game
      и проверка по вектору против edges.yaml, SPEC-BOARD §4 и §6, ТЗ §5.
    proposal: >
      Первая задача Claude Code — качественная векторная основа полотна:
      материки и океаны в южно-полярной проекции, уложенные на 900 x 550 мм,
      без нарезки на регионы. Нарезка — отдельными задачами после.
    decision: Принято, см. detail
    decided: 2026-09-18
    refs: [MF-014, MF-016, MF-002]
    opened: 2026-09-18
    closed: null
