  - id: MF-010
    type: VERIFICATION
    severity: INFO
    status: CLOSED
    title: Два перекрёстка — Панама и Магелланов пролив — разобраны и совпадают с оригиналом
    subject: [ME-004, ME-005, ME-027, ME-044, ME-045, ME-047, ME-048, ME-074, ME-077]
    detail: >
      На карте два места, где в одной точке сходятся два океана и две суши, и
      оба разобраны отдельно, потому что рисуются легко и ошибаются тоже легко.

      ПАНАМСКИЙ ПЕРЕКРЁСТОК. Перешеек нарисован цепочкой островков, вода между
      ними проходит, поэтому Север Атлантического и Север Тихого океана
      смежны НАПРЯМУЮ (ME-074) — рулбук это отдельно отмечает на с. 9.
      На стороне «3» вокруг перекрёстка: Северная Америка — Южная Америка,
      Южная Америка — Северная Атлантика (ME-044) и Южная Америка — Север
      Тихого океана (ME-047, всего 458 px). Степень Южной Америки 5 при этом
      совпадает с опубликованной — то есть оба этих коротких ребра
      подтверждены независимо.
      На стороне «5» перешеек и весь карибский берег забирает Центральная
      Америка: она смежна с обоими океанами (ME-027, ME-028), с Западом и
      Востоком Южной Америки (ME-005, ME-004) и с Западом Северной Америки.
      Из-за этого у Запада Южной Америки Северной Атлантики в соседях НЕТ:
      выход в Атлантику у него только южный (ME-034), а карибский берег
      достаётся Центральной Америке. Северную Атлантику из Южной Америки на
      стороне «5» видит только восточная половина (ME-045).
      Проверено глазами и по нашему арту, и по фотографии оригинала
      (SRC-BGA-GRAPH, сторона «5»): в обоих случаях полоса Центральной Америки
      идёт по берегу до самого Востока Южной Америки.

      МАГЕЛЛАНОВ ПЕРЕКРЁСТОК. Юг Тихого и Юг Атлантического океана смежны
      южнее Огненной Земли (ME-077). Запад Южной Америки выходит в оба океана
      (ME-035 и ME-034), Восток Южной Америки — только в Юг Атлантического.
      Ребра «Восток Южной Америки — Юг Тихого океана» нет.
    proposal: >
      Ничего менять не нужно. Заметки по каждому из девяти рёбер положены
      в edges.yaml в поле note, чтобы при следующем касании карты никто
      не «починил» эти места по интуиции.
    decision: null
    decided: null
    refs: [MF-001]
    opened: 2026-09-16
    closed: 2026-09-16

