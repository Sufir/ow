<!DOCTYPE html>
<html lang="ru">
<head>
<style>
.wrapper {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 200px;
  background: red;
}
.illus {
  width: 90%;
  aspect-ratio: 4 / 3;
  background: blue;
}
.wrapper::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  aspect-ratio: 4 / 3;
  background: rgba(0, 255, 0, 0.5);
  pointer-events: none;
}
</style>
</head>
<body>
  <div class="wrapper">
    <div class="illus"></div>
  </div>
</body>
</html>
