<!DOCTYPE html>
<html>
<head>
<style>
.page {
  width: 210mm;
  height: 297mm;
  background-color: #eee;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, 50mm);
  grid-template-rows: repeat(5, 50mm);
  padding: 2mm;
  background-color: #191b1c;
}
.token {
  width: 50mm;
  height: 50mm;
  background-color: #ccc;
  border: 1px solid red;
}
</style>
</head>
<body>
<div class="page">
  <div class="grid">
    <div class="token"></div>
    <div class="token"></div>
    <div class="token"></div>
  </div>
</div>
</body>
</html>
