  Тексты — D-115, экраны и рубашка — D-118.

  Как устроено:
    • содержимое — только в JSON слота «данные» (<script id="card-data">): заголовки, строки, тексты, картинки;
      {R} — значок нефти (ICON-001), кавычки — только “ ” (D-075), проверка: python3 print/check_quotes.py;
    • оформление — в FactoryEvents/FactoryEvents.css; листы и метки строит скрипт ниже;
    • печать — A4 книжный, 3 страницы: лицо 1, лицо 2, рубашка; по четыре карты с выпуском 6 мм.
      Рубашка у всех одна, поэтому её страница одна: печатается на обороте обоих листов лиц.
      Метки реза — крестики на лице: на ровном тёмном выпуске они видны лучше, чем на рубашке.
      Подробно — print/ПЕЧАТЬ.md;
    • рубашка FactoryEvents/back.jpg уже с выпуском 6 мм: 92 × 132 мм, выпуск — отражение краёв картинки;
      за 12 мм до линии реза картинка плавно бледнеет до 35 % на цвете края #3f4d63 — сдвиг реза не виден (D-118);
    • экран — скошенная рамка SVG 68 × 38,8 мм, картинка 1,8 : 1 обрезается по внутреннему контуру.
-->

<script>
const DATA = JSON.parse(document.getElementById('card-data').textContent);
const W = 80, H = 120, B = 6;                   // карта и выпуск, мм
const NS = 'http://www.w3.org/2000/svg';

function div(cls) { const e = document.createElement('div'); e.className = cls; return e; }
function place(el, x, y, w, h) { Object.assign(el.style, { left: x + 'mm', top: y + 'mm', width: w + 'mm', height: h + 'mm' }); return el; }
function sym(html) { return html.replace(/\{R\}/g, '<span class="sym">R</span>'); }

/* экран: скошенная рамка (вариант В, D-118) — срез углов 3 мм, картинка внутри с полем 1,2 мм, планки по сторонам */
let clipN = 0;
function screen(img) {
  const w = div('screen');
  const SW = 68, SH = 38.8, k = 3, i = 1.2, ki = 2.4, id = 'scr' + (++clipN), blue = '#25A4EE';
  const poly = (x0, y0, x1, y1, c) => [[x0 + c, y0], [x1 - c, y0], [x1, y0 + c], [x1, y1 - c], [x1 - c, y1], [x0 + c, y1], [x0, y1 - c], [x0, y0 + c]]
    .map(([x, y]) => `${+x.toFixed(2)},${+y.toFixed(2)}`).join(' ');
  const outer = poly(.25, .25, SW - .25, SH - .25, k), inner = poly(i, i, SW - i, SH - i, ki);
  const bar = (x, y, bw, bh) => `<rect x="${+x.toFixed(2)}" y="${+y.toFixed(2)}" width="${bw}" height="${bh}" fill="${blue}"/>`;
  w.innerHTML = `<svg viewBox="0 0 ${SW} ${SH}" preserveAspectRatio="none" xmlns="${NS}" aria-hidden="true">
    <defs><clipPath id="${id}"><polygon points="${inner}"/></clipPath></defs>
    <polygon points="${outer}" fill="#050D15"/>
    <rect width="${SW}" height="${SH}" fill="#0A2236" clip-path="url(#${id})"/>
    <image href="${img}" x="${i}" y="${i}" width="${+(SW - 2 * i).toFixed(2)}" height="${+(SH - 2 * i).toFixed(2)}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/>
    <polygon points="${inner}" fill="none" stroke="rgba(127,214,255,.55)" stroke-width=".2"/>
    <polygon points="${outer}" fill="none" stroke="${blue}" stroke-width=".5"/>
    ${bar(9, 0, 14, .9)}${bar(SW - 23, 0, 14, .9)}${bar(9, SH - .9, 14, .9)}${bar(SW - 23, SH - .9, 14, .9)}
    ${bar(0, SH / 2 - 4, .9, 8)}${bar(SW - .9, SH / 2 - 4, .9, 8)}</svg>`;
  return w;
}

function face(d) {                               // лицо одной карты
  const c = div('card ' + (d['вид'] === 'экран' ? 'screen-card' : 'table'));
  const hd = div('card-header'); hd.textContent = d['заголовок']; c.appendChild(hd);
  if (d['вид'] === 'экран') {
    c.appendChild(screen(d['картинка']));
    const cp = div('card-copy');
    for (const t of d['текст']) {
      if (t) { const p = document.createElement('p'); p.innerHTML = sym(t); cp.appendChild(p); }
      else cp.appendChild(div('gap'));
    }
    c.appendChild(cp);
  } else {
    const tt = div('card-title'); tt.textContent = d['шапка']; c.appendChild(tt);
    const tx = div('card-text');
    for (const t of d['строки']) { const p = document.createElement('p'); p.innerHTML = sym(t); tx.appendChild(p); }
    c.appendChild(tx);
  }
  return c;
}

function marks(segs, dark, SW, SH) {             // метки реза: части над тёмным фоном — светлые, над белым полем — тёмные
  const inDark = (x, y) => dark.some(([a, b, c, d]) => x > a && x < c && y > b && y < d);
  let light = '', ink = '';
  for (const [x1, y1, x2, y2] of segs) {
    const ts = [0, 1], vert = x1 === x2;
    for (const [a, b, c, d] of dark) for (const v of (vert ? [b, d] : [a, c])) {
      const t = vert ? (v - y1) / (y2 - y1) : (v - x1) / (x2 - x1);
      if (t > 0 && t < 1) ts.push(t);
    }
    ts.sort((p, q) => p - q);
    const P = t => [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t];
    for (let k = 0; k + 1 < ts.length; k++) {
      if (ts[k + 1] - ts[k] < 1e-6) continue;
      const [ax, ay] = P(ts[k]), [bx, by] = P(ts[k + 1]), [mx, my] = P((ts[k] + ts[k + 1]) / 2);
      const d = `M${ax.toFixed(3)},${ay.toFixed(3)} L${bx.toFixed(3)},${by.toFixed(3)} `;
      if (inDark(mx, my)) light += d; else ink += d;
    }
  }
  const box = document.createElement('div');
  box.innerHTML = `<svg class="marks" viewBox="0 0 ${SW} ${SH}" style="width:${SW}mm;height:${SH}mm" xmlns="${NS}" aria-hidden="true">`
    + `<path d="${ink}" stroke="#1A1A1A" stroke-width=".1" fill="none"/><path d="${light}" stroke="#FFFFFF" stroke-width=".1" fill="none"/></svg>`;
  return box.firstChild;
}

function build() {
  const pages = document.getElementById('pages'); pages.innerHTML = '';
  // A4 книжный: 2 × 2 карты, выпуски встык, блок по центру листа — при перевороте листа он ложится сам на себя.
  // Сначала листы лиц, в конце одна страница рубашки: рубашка у всех карт одна.
  const cw = W + 2 * B, ch = H + 2 * B, x0 = (210 - 2 * cw) / 2, y0 = (297 - 2 * ch) / 2;
  const cards = DATA['карты'];
  const sheets = [];
  for (let g = 0; g < cards.length; g += 4) sheets.push([g, 0]);
  sheets.push([0, 1]);
  for (const [g, side] of sheets) {
    const sh = div('sheet'); pages.appendChild(sh);
    const segs = [], dark = [];
    for (let k = 0; k < 4 && g + k < cards.length; k++) {
      const col = side === 0 ? k % 2 : 1 - k % 2, row = Math.floor(k / 2);
      const x = x0 + col * cw + B, y = y0 + row * ch + B;
      const bl = place(div('bleed' + (side ? ' back' : '')), x - B, y - B, cw, ch);
      if (side) bl.style.backgroundImage = `url("${DATA['рубашка']}")`;
      sh.appendChild(bl);
      if (!side) sh.appendChild(place(face(cards[g + k]), x, y, W, H));
      dark.push([x - B, y - B, x + W + B, y + H + B]);
      // крестик в каждом углу: обе линии идут через угол наружу на 10 мм и внутрь вдоль кромки на 4 мм
      const OUT = 10, IN = 4;
      for (const [cx, dx] of [[x, 1], [x + W, -1]]) for (const [cy, dy] of [[y, 1], [y + H, -1]]) {
        segs.push([cx - dx * OUT, cy, cx + dx * IN, cy]);
        segs.push([cx, cy - dy * OUT, cx, cy + dy * IN]);
      }
    }
    // метки реза — на лице: его выпуск ровный тёмный, белая метка видна по всей длине;
    // на рубашке светлое небо, белая метка на нём теряется
    if (side === 0) sh.appendChild(marks(segs, dark, 210, 297));
  }
}

document.fonts.ready.then(build);
</script>
