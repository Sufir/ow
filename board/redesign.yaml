# redesign.yaml — области карты «Нефтяных войн» и их соответствие оригиналу.
# Источник имён: подписи на карте (board/legacy/карта.pdf, board/legacy/карта 5.jpg) и имена слоёв
# в board/legacy/карта 5.psd. Слой «Слой 3» в PSD не назван — идентифицирован по подписи.
# colour — заливка области на всех полотнах, где она есть (COMP-C-03, этап 3, шаг 1; D-099).
#   Подобрана board/tools/palette.py по графу четырёх раскладок и принята Alek 30.09.2026;
#   board/tools/boardview.py берёт цвета отсюда. Поменять — правка здесь и пересборка slice5.py, glue.py.

