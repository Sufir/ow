<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Factory Tokens</title>
  <link rel="stylesheet" href="Factory/factory.css">
</head>
<body>
  <!-- Страница 1 -->
  <div class="page front page-1">
    <div class="grid">
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
    </div>
  </div>

  <!-- Страница 2 -->
  <div class="page front page-2">
    <div class="grid">
      <!-- 8 жетона Фабрик -->
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
	  <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      
	  <!-- 10 жетонов особых Фабрик -->
      <div class="token factory-special-1"><div class="special-symbol">▣</div></div>
      <div class="token factory-special-2"><div class="special-symbol">▲</div></div>
      <div class="token factory-special-3"><div class="special-symbol">◆</div></div>
      <div class="token factory-special-4"><div class="special-symbol">★</div></div>
      <div class="token factory-special-5"><div class="special-symbol">✚</div></div>
      <div class="token factory-special-6"><div class="special-symbol">⬟</div></div>
      <div class="token factory-special-7"><div class="special-symbol">⬢</div></div>
      <div class="token factory-special-8"><div class="special-symbol">◎︎</div></div>
      <div class="token factory-special-9"><div class="special-symbol">✖</div></div>
      <div class="token factory-special-10"><div class="special-symbol">✦</div></div>
	  
	  <!-- прочее -->
      <div class="token lab"></div>
      <div class="token swarm-controller"><div class="special-symbol">📡</div></div>
    </div>
  </div>

  <!-- Страница 3 -->
  <div class="page front page-3">
    <div class="grid">
      <!-- 4 жетона ретрансляторо Роя -->
      <div class="token swarm-zone"><div class="special-symbol">📡</div></div>
      <div class="token swarm-zone"><div class="special-symbol">📡</div></div>
      <div class="token swarm-zone"><div class="special-symbol">📡</div></div>
      <div class="token swarm-zone"><div class="special-symbol">📡</div></div>
    </div>
  </div>

  <!-- Страница 4: Пример форм жетонов (Shapes) -->
  <div class="page front page-4">
    <div class="grid">
      <!-- Различные формы жетонов -->
      <div class="token shape-circle factory-common"></div>
      <div class="token shape-pentagon factory-special-1"><div class="special-symbol">▣</div></div>
      <div class="token shape-hexagon factory-special-2"><div class="special-symbol">▲</div></div>
      <div class="token shape-octagon factory-special-3"><div class="special-symbol">◆</div></div>
    </div>
  </div>
</body>
</html>
