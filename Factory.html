    <button type="button" data-action="dec">-</button>
    <div class="token-size">
      <input id="tokenSizeInput" type="text" inputmode="decimal" aria-label="Token size in millimeters">
      <span>мм</span>
    </div>
    <button type="button" data-action="inc">+</button>
  </div>

  <!-- Лист 1 - печатать с двух сторон -->
  <div class="page front">
    <div class="grid">
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>

      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
    </div>
  </div>

  <!-- Лист 2 - сторона 1 -->
  <div class="page front">
    <div class="grid">     
	  <!-- 10 жетонов особых Фабрик -->
      <div class="token factory-special-1"><div class="special-symbol">▣</div></div>
      <div class="token factory-special-2"><div class="special-symbol">▲</div></div>
      <div class="token factory-special-3"><div class="special-symbol">◆</div></div>
      <div class="token factory-special-4"><div class="special-symbol">★</div></div>
      <div class="token factory-special-5"><div class="special-symbol">✚</div></div>
      <div class="token factory-special-6"><div class="special-symbol">⬟</div></div>
      <div class="token factory-special-7"><div class="special-symbol">⬢</div></div>
      <div class="token factory-special-8"><div class="special-symbol">◎︎</div></div>
      <div class="token factory-special-9"><div class="special-symbol">✖</div></div>
      <div class="token factory-special-10"><div class="special-symbol">✦</div></div>
	  
	  <!-- прочее -->
	  <div class="token swarm-controller symbol-bottom-right"><div class="special-symbol">📡</div></div>
      <div class="token lab"></div>
	  
	  <!-- 4 жетона ретрансляторо Роя -->
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
	  
	  <!-- 8 жетона общин Братства Сингулярности -->
      <div class="token community symbol-bottom-right"><div class="special-symbol">6</div></div>
      <div class="token community symbol-bottom-right"><div class="special-symbol">6</div></div>
      <div class="token community symbol-bottom-right"><div class="special-symbol">6</div></div>
      <div class="token community symbol-bottom-right"><div class="special-symbol">6</div></div>
    </div>
  </div>

    <div class="grid">

      <div class="token factory-common"></div>
      <div class="token factory-common"></div>

      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
	  
	  <!-- прочее -->
	  <div class="token lab"></div>
	  <div class="token swarm-controller symbol-bottom-right"><div class="special-symbol">📡</div></div>
	  
      <div class="token factory-common"></div>
      <div class="token factory-common"></div>
	  
	  <!-- 4 жетона ретрансляторо Роя -->
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
      <div class="token shape-circle swarm-zone symbol-bottom-center"><div class="special-symbol">📡</div></div>
	  
	  <!-- 8 жетона общин Братства Сингулярности -->

      <div class="token community symbol-bottom-right"><div class="special-symbol">6</div></div>
      <div class="token community symbol-bottom-right"><div class="special-symbol">6</div></div>
      <div class="token community symbol-bottom-right"><div class="special-symbol">6</div></div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var inputEl = document.getElementById('tokenSizeInput');
      var step = 0.5;
      var min = 20;
      var max = 50;
      var storageKey = 'tokenSizeMm';

      function readTokenSizeMm() {
        var raw = getComputedStyle(root).getPropertyValue('--token-size').trim();
        var n = parseFloat(raw.replace('mm', ''));
        return Number.isFinite(n) ? n : 50;
      }

      function normalizeNumberString(s) {
        return String(s || '').trim().replace(',', '.').replace(/[^0-9.]/g, '');
      }

      function render(mm) {
        if (inputEl) inputEl.value = mm.toFixed(1);
      }

      function setTokenSizeMm(mm) {
        var clamped = Math.max(min, Math.min(max, Math.round(mm / step) * step));
        root.style.setProperty('--token-size', clamped.toFixed(1) + 'mm');
        try { localStorage.setItem(storageKey, String(clamped)); } catch (e) {}
        render(clamped);
      }

      document.addEventListener('click', function (e) {
        var btn = e.target && e.target.closest ? e.target.closest('button[data-action]') : null;
        if (!btn) return;
        var current = readTokenSizeMm();
        if (btn.getAttribute('data-action') === 'inc') setTokenSizeMm(current + step);
        if (btn.getAttribute('data-action') === 'dec') setTokenSizeMm(current - step);
      });

      function applyFromInput() {
        if (!inputEl) return;
        var n = parseFloat(normalizeNumberString(inputEl.value));
        if (!Number.isFinite(n)) {
          render(readTokenSizeMm());
          return;
        }
        setTokenSizeMm(n);
      }

      if (inputEl) {
        inputEl.addEventListener('focusout', applyFromInput);
        inputEl.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            inputEl.blur();
          }
        });
      }

      var initial = (function () {
        try {
          var stored = parseFloat(String(localStorage.getItem(storageKey) || '').replace(',', '.'));
          if (Number.isFinite(stored)) return stored;
        } catch (e) {}
        return readTokenSizeMm();
      })();

      setTokenSizeMm(initial);
    })();
  </script>
</body>
</html>
